<script>
/* desktop: let the mouse wheel scroll horizontal topic-chip rows sideways (touch already swipes) */
document.addEventListener('wheel', function(e){
  var el = e.target.closest && e.target.closest('.chips');
  if(el && el.scrollWidth > el.clientWidth + 2 && Math.abs(e.deltaY) > Math.abs(e.deltaX)){ el.scrollLeft += e.deltaY; e.preventDefault(); }
}, {passive:false});
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('service-worker.js').then(function(reg){
      reg.update();
      // when a new version is found, ask it to activate as soon as it's installed
      reg.addEventListener('updatefound',function(){
        var sw=reg.installing;
        if(!sw)return;
        sw.addEventListener('statechange',function(){
          if(sw.state==='installed' && navigator.serviceWorker.controller){ sw.postMessage('SKIP_WAITING'); }
        });
      });
    }).catch(function(){});
    // NOTE: intentionally NO controllerchange auto-reload. On iOS Safari the reload-on-
    // service-worker-activation pattern can loop / interrupt the slow in-browser Babel compile
    // and leave the app stuck loading. Network-first already serves fresh code on the next load.
  });
}
</script>
