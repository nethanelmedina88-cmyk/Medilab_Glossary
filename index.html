<script>
/* intro video: play once per calendar day, then fade out to reveal the app. Self-healing. */
(function(){
  var intro=document.getElementById('intro'); if(!intro) return;
  var vid=document.getElementById('introVid'), done=false;
  function hide(){ if(done) return; done=true; intro.classList.add('hide'); try{ vid && vid.pause(); }catch(e){} setTimeout(function(){ if(intro && intro.parentNode) intro.parentNode.removeChild(intro); },600); }
  // show only on the first entry of the day — skip on refreshes / later entries the same day
  var today=new Date().toDateString(), last=null;
  try{ last=localStorage.getItem('ml-intro-day'); }catch(e){}
  if(last===today){ if(intro.parentNode) intro.parentNode.removeChild(intro); return; }
  try{ localStorage.setItem('ml-intro-day', today); }catch(e){}
  if(vid){
    vid.addEventListener('ended', hide);
    vid.addEventListener('error', hide);
    var p = vid.play && vid.play();
    if(p && p.catch) p.catch(function(){ /* autoplay blocked: safety timer will dismiss */ });
  } else { hide(); }
  intro.addEventListener('click', hide); // tap anywhere to dismiss (no visible button)
  setTimeout(hide, 7000); // safety: never trap the user even if the video stalls
})();
</script>
<script>
/* desktop: let the mouse wheel scroll the horizontal topic + letter rows sideways (touch already swipes).
   RTL-aware: in a right-to-left row, scrollLeft runs negative, so flip the wheel delta. */
document.addEventListener('wheel', function(e){
  var el = e.target.closest && e.target.closest('.chips, .letters');
  if(el && el.scrollWidth > el.clientWidth + 2 && Math.abs(e.deltaY) > Math.abs(e.deltaX)){
    var rtl = getComputedStyle(el).direction === 'rtl';
    el.scrollLeft += (rtl ? -e.deltaY : e.deltaY);
    e.preventDefault();
  }
}, {passive:false});
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('service-worker.js').then(function(reg){
      reg.update();
      // when a new version is found, ask it to activate as soon as it's installed
      reg.addEventListener('updatefound',function(){
        var sw=reg.installing;
        if(!sw)return;
        sw.addEventListener('statechange',function(){
          if(sw.state==='installed' && navigator.serviceWorker.controller){ sw.postMessage('SKIP_WAITING'); }
        });
      });
    }).catch(function(){});
    // NOTE: intentionally NO controllerchange auto-reload. On iOS Safari the reload-on-
    // service-worker-activation pattern can loop / interrupt the slow in-browser Babel compile
    // and leave the app stuck loading. Network-first already serves fresh code on the next load.
  });
}
</script>
<div id="cookiebar" role="dialog" aria-label="הודעת עוגיות" style="display:none;position:fixed;inset-inline:0;bottom:0;z-index:9999;background:#15212C;color:#fff;padding:14px 16px;box-shadow:0 -6px 24px rgba(0,0,0,.3);font-family:'Assistant',system-ui,sans-serif">

    <button id="cookieok" style="background:#F4A52A;color:#15212C;border:none;border-radius:10px;padding:9px 22px;font-weight:700;font-family:inherit;font-size:14px;cursor:pointer">אישור</button>

<script>
(function(){ try{ if(localStorage.getItem('sl-cookie-ok')==='1') return; }catch(e){}
  var bar=document.getElementById('cookiebar'); if(!bar) return; bar.style.display='block';
  var btn=document.getElementById('cookieok'); if(btn) btn.addEventListener('click',function(){ try{localStorage.setItem('sl-cookie-ok','1');}catch(e){} bar.style.display='none'; });
})();
</script>
