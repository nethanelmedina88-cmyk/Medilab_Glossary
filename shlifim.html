<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>שליפים SHLIFIM · MediLab</title>
<meta name="description" content="אפליקציית שליפים: 465 מושגי ביולוגיה בכרטיסיות פלאש ומבחון. מבית MediLab."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;600;700;800;900&family=Assistant:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* === NEW PALETTE: "Lab Notebook" === */
  --paper: #FAF5E7;
  --paper-2: #F2EBD3;
  --paper-3: #ECE2C1;
  --ink: #0F1E2C;
  --ink-soft: #2C3E50;
  --ink-light: #6B7588;
  --line: #D9CFB2;
  --line-soft: #E8DFC4;
  
  /* === ACCENT SYSTEM === */
  --primary: #1F4A35;
  --primary-soft: #C8D9CD;
  --accent: #C9665D;
  --accent-soft: #F4DDDA;
  --highlight: #D9C036;
  --highlight-soft: #F5E8A1;
  --info: #4A6FA5;
  
  /* === BACKWARD COMPAT === */
  --blue: var(--info);
  --blue-dark: var(--primary);
  --blue-soft: var(--primary-soft);
  --green: #5C8A6E;
  --green-dark: var(--primary);
  --green-soft: var(--primary-soft);
  --yellow: var(--highlight);
  --coral: var(--accent);
  
  /* === STRUCTURE === */
  --r: 4px;
  --r-card: 12px;
  --r-pill: 999px;
  
  /* === SHADOWS === */
  --shadow-sm: 0 1px 2px rgba(15,30,44,0.06);
  --shadow: 0 2px 8px rgba(15,30,44,0.08), 0 1px 2px rgba(15,30,44,0.05);
  --shadow-lg: 0 8px 24px rgba(15,30,44,0.12), 0 2px 6px rgba(15,30,44,0.06);
  --shadow-card: 0 2px 4px rgba(15,30,44,0.08), 0 1px 2px rgba(15,30,44,0.04);
}

html.dark{
  --paper: #0F1B26;
  --paper-2: #16242F;
  --paper-3: #1C2E3B;
  --ink: #F0EBD8;
  --ink-soft: #C0BDB0;
  --ink-light: #8090A0;
  --line: #2A3845;
  --line-soft: #1F2A35;
  
  --primary: #5C9A7E;
  --primary-soft: #1F3328;
  --accent: #E08A82;
  --accent-soft: #3A2828;
  --highlight: #E8CF4F;
  --highlight-soft: #3A3018;
  --info: #6FA0D4;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/* Base typography overhaul */
body {
  font-family: 'Heebo', 'Assistant', system-ui, sans-serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--paper);
  direction: rtl;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font-family: inherit; cursor: pointer; }
html.dark{--paper:#0E1822;--paper-2:#16232F;--ink:#F0EBD8;--ink-soft:#C0BDB0;--ink-light:#7B8090;--line:#2A3845;--blue-soft:#1A3344;--green-soft:#1B3220}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Assistant',system-ui,sans-serif;background:var(--paper);color:var(--ink);direction:rtl;min-height:100vh;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer}

/* HEADER */
.hdr{background:var(--blue-dark);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(27,111,168,.3)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4)}
.brand-name{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:600;letter-spacing:.5px}
.brand-sub{font-size:11px;opacity:.75;display:block}
.hdr-actions{display:flex;align-items:center;gap:6px}
.dark-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center}
.dark-btn:hover{background:rgba(255,255,255,.25)}
.score-pill{background:rgba(255,255,255,.15);border:none;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}

/* PROGRESS */
.prog-wrap{margin-top:10px}
.prog-info{display:flex;justify-content:space-between;font-size:11px;opacity:.8;margin-bottom:4px}
.prog-bar{height:3px;background:rgba(255,255,255,.2);border-radius:2px}
.prog-fill{height:3px;background:#fff;border-radius:2px;transition:width .4s}

/* CONTROLS */
.controls{padding:12px 16px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mode-btn{padding:9px 12px;border-radius:var(--r);border:1.5px solid var(--blue);background:var(--paper);color:var(--blue-dark);font-size:14px;font-weight:600;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.mode-btn.on{background:var(--blue-dark);color:#fff;border-color:var(--blue-dark)}
.letters{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.letters::-webkit-scrollbar{display:none}
.let-btn{padding:5px 9px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.let-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-dark);font-weight:700}
.search-wrap{margin-bottom:10px}
.search-inp{width:100%;padding:9px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;font-family:inherit;outline:none}
.search-inp:focus{border-color:var(--blue)}

/* FLASH CARD */
.card-area{padding:12px 16px}
.card-outer{perspective:1000px;height:270px;cursor:pointer;user-select:none;margin-bottom:10px}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.card-inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--r);padding:22px 20px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.face.front{background:var(--paper)}
.face.back{background:var(--blue-dark);color:#fff;transform:rotateY(180deg)}
.face-label{font-size:11px;letter-spacing:1.5px;opacity:.45;text-transform:uppercase}
.face.back .face-label{opacity:.6;color:#fff}
.face-term{font-family:'Fredoka',sans-serif;font-size:30px;font-weight:600;color:var(--ink);text-align:center}
.face-en{font-size:13px;color:var(--ink-light);text-align:center}
.face-def{font-size:14px;color:#fff;text-align:center;line-height:1.65}
.face-backterm{font-family:'Fredoka',sans-serif;font-size:15px;color:rgba(255,255,255,.7);margin-bottom:4px;text-align:center}
.let-badge{position:absolute;top:14px;right:16px;font-size:12px;padding:3px 9px;border-radius:12px;font-weight:700}
.face.front .let-badge{background:var(--blue-soft);color:var(--blue-dark)}
.face.back .let-badge{background:rgba(255,255,255,.18);color:#fff}
.flip-hint{text-align:center;font-size:12px;color:var(--ink-light)}
.fav-indicator{position:absolute;bottom:14px;left:16px;font-size:18px}

/* NAV ROW */
.nav-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.nav-btn{flex:1;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:600;transition:all .1s}
.nav-btn:hover{background:var(--blue-soft)}
.nav-btn:disabled{opacity:.3;cursor:default}
.counter{min-width:50px;text-align:center;font-size:13px;color:var(--ink-soft);font-weight:600}
.fav-btn{background:none;border:none;font-size:22px;padding:5px;border-radius:50%;transition:transform .15s}
.fav-btn:hover{transform:scale(1.2)}

/* KNOWN ROW */
.known-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.known-btn{padding:10px;border-radius:var(--r);border:none;font-size:14px;font-weight:700;transition:all .15s}
.known-btn.yes{background:var(--green-soft);color:var(--green-dark)}
.known-btn.yes:hover{background:#c6e8bc}
.known-btn.no{background:#fde8e6;color:#a33}
.known-btn.no:hover{background:#f9ccc8}

/* QUIZ */
.quiz-area{padding:12px 16px}
.score-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sc-card{background:var(--paper-2);border-radius:var(--r);padding:10px;text-align:center;border:1px solid var(--line)}
.sc-num{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700}
.sc-lbl{font-size:11px;color:var(--ink-light)}
.sc-num.g{color:var(--green-dark)}
.sc-num.r{color:#c44}
.quiz-q{background:var(--paper-2);border-radius:var(--r);padding:18px 16px;margin-bottom:12px;border:1.5px solid var(--line)}
.quiz-q-tag{font-size:11px;color:var(--ink-light);letter-spacing:1px;margin-bottom:8px;text-align:center}
.quiz-def-text{font-size:15px;color:var(--ink);line-height:1.65;text-align:center}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{padding:13px 16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;font-weight:600;text-align:right;transition:all .15s;font-family:inherit}
.q-opt:hover:not([disabled]){border-color:var(--blue);background:var(--blue-soft)}
.q-opt.correct{background:#e3f5da;border-color:var(--green-dark);color:var(--green-dark)}
.q-opt.wrong{background:#fde8e6;border-color:#c44;color:#c44}
.q-opt[disabled]{cursor:default}
.quiz-fb{text-align:center;margin-top:10px;font-size:15px;font-weight:700;min-height:24px}
.quiz-fb.ok{color:var(--green-dark)}
.quiz-fb.bad{color:#c44}
.quiz-next{width:100%;margin-top:10px;padding:12px;border-radius:var(--r);background:var(--blue-dark);color:#fff;border:none;font-size:15px;font-weight:700;font-family:inherit;transition:background .15s}
.quiz-next:hover{background:var(--blue)}
.quiz-next[style*="none"]{display:none!important}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--ink-light)}
.empty-ico{font-size:40px;margin-bottom:10px}

/* FAV LIST */
.fav-section{padding:12px 16px}
.fav-title{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fav-list{display:flex;flex-direction:column;gap:8px}
.fav-item{background:var(--paper-2);border-radius:var(--r);padding:12px 16px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fav-item-term{font-weight:700;font-size:15px;color:var(--ink)}
.fav-item-en{font-size:12px;color:var(--ink-light);margin-top:2px}
.fav-item-def{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.5}
.fav-remove{background:none;border:none;font-size:18px;flex-shrink:0;opacity:.5;padding:2px}
.fav-remove:hover{opacity:1}

/* STUDIED BADGE */
.studied-badge{display:inline-block;background:var(--green-soft);color:var(--green-dark);border-radius:10px;font-size:11px;padding:2px 7px;font-weight:700;margin-top:4px}

/* ABOUT */
.about-wrap{padding:16px}
.about-profile{background:var(--paper-2);border-radius:var(--r);border:1px solid var(--line);padding:18px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start}
.about-portrait{width:72px;height:72px;border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid var(--blue)}
.about-name{font-family:'Fredoka',sans-serif;font-size:19px;font-weight:700;color:var(--ink)}
.about-role{font-size:13px;color:var(--blue-dark);font-weight:600;margin:2px 0 6px}
.about-bio{font-size:13px;color:var(--ink-soft);line-height:1.6}
.about-quote{font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:8px;padding-right:10px;border-right:3px solid var(--yellow)}
.degrees{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.deg{display:flex;align-items:flex-start;gap:10px}
.deg-tag{background:var(--blue-dark);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;margin-top:2px}
.deg-name{font-size:13px;font-weight:700;color:var(--ink)}
.deg-place{font-size:11px;color:var(--ink-light)}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.stat-card{background:var(--paper-2);border-radius:var(--r);padding:10px;text-align:center;border:1px solid var(--line)}
.stat-n{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;color:var(--blue-dark)}
.stat-l{font-size:11px;color:var(--ink-light)}
.cta-row{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cta-btn{padding:12px;border-radius:var(--r);font-size:15px;font-weight:700;text-align:center;text-decoration:none;font-family:inherit;border:none;display:block}
.cta-primary{background:var(--green-dark);color:#fff}
.cta-ghost{background:var(--paper-2);color:var(--blue-dark);border:1.5px solid var(--blue)}
.contact-line{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:8px}
.contact-line a{color:var(--blue-dark);text-decoration:none;font-weight:600}
.books-section{margin-top:4px}
.books-head{margin-bottom:12px}
.books-title{font-family:'Fredoka',sans-serif;font-size:19px;font-weight:700;color:var(--ink)}
.books-sub{font-size:12px;color:var(--ink-light);margin-top:3px}
.books-grid{display:flex;flex-direction:column;gap:10px}
.book-card{background:var(--paper-2);border-radius:var(--r);border:1px solid var(--line);display:flex;gap:12px;padding:14px;text-decoration:none;color:inherit;transition:border-color .15s}
.book-card:hover{border-color:var(--blue)}
.book-cover img{width:60px;border-radius:8px;object-fit:cover;display:block}
.book-tag{font-size:10px;font-weight:700;background:var(--blue-soft);color:var(--blue-dark);padding:2px 7px;border-radius:8px;display:inline-block;margin-bottom:4px}
.book-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px}
.book-desc{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:5px}
.book-price{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:700;color:var(--green-dark)}
.bundle{background:var(--blue-dark);border-radius:var(--r);padding:16px;margin-top:12px;color:#fff}
.bundle-title{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:700;margin-bottom:4px}
.bundle-desc{font-size:13px;opacity:.85;margin-bottom:12px}
.bundle-prices{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.price-old{font-size:14px;text-decoration:line-through;opacity:.55}
.price-new{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700}
.price-save{font-size:12px;background:var(--yellow);color:#333;padding:2px 8px;border-radius:10px;font-weight:700}
.bundle-btn{display:block;background:#fff;color:var(--blue-dark);text-align:center;border-radius:var(--r);padding:11px;font-size:15px;font-weight:700;text-decoration:none}

/* LOGIN UI */
.login-btn{background:#fff;color:#444;border:none;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit}
.login-btn:hover{background:#f0f0f0}
.login-btn img{width:14px;height:14px}
.user-pill{background:rgba(255,255,255,.15);color:#fff;padding:3px 8px 3px 3px;border-radius:20px;font-size:11px;display:flex;align-items:center;gap:6px;cursor:pointer;border:none;font-family:inherit}
.user-pill:hover{background:rgba(255,255,255,.25)}
.user-pill img{width:24px;height:24px;border-radius:50%;border:1.5px solid #fff}
.user-name{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.user-menu-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.2);z-index:199}
.user-menu{position:fixed;top:60px;left:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;min-width:220px}
.user-menu-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.user-menu-row img{width:40px;height:40px;border-radius:50%}
.user-menu-name{font-weight:700;color:var(--ink);font-size:14px}
.user-menu-email{font-size:11px;color:var(--ink-light)}
.user-menu-sync{font-size:11px;color:var(--green-dark);margin-bottom:10px;text-align:center}
.signout-btn{width:100%;padding:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit}
.signout-btn:hover{background:#fde8e6;color:#c44}
.welcome-banner{background:linear-gradient(135deg,var(--green-soft),var(--blue-soft));padding:10px 16px;font-size:13px;color:var(--ink);text-align:center;border-bottom:1px solid var(--line)}
.welcome-banner strong{color:var(--blue-dark)}
.sync-spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--blue);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-left:5px}
@keyframes spin{to{transform:rotate(360deg)}}

/* USER ZONE — visible logout button */
.user-zone{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);border-radius:20px;padding:3px 4px 3px 8px}
.user-avatar{width:26px;height:26px;border-radius:50%;border:1.5px solid #fff;object-fit:cover}
.user-zone .user-name{color:#fff;font-size:12px;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn{background:#fff;color:var(--blue-dark);border:none;width:26px;height:26px;border-radius:50%;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background .15s}
.logout-btn:hover{background:#fde8e6;color:#c44}

/* PROGRESS PAGE */
.prog-wrap-main{padding:16px}
.prog-greeting{display:flex;align-items:center;gap:12px;margin-bottom:16px;background:linear-gradient(135deg,var(--blue-soft),var(--green-soft));border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.prog-greeting img{width:48px;height:48px;border-radius:50%;border:2px solid #fff}
.prog-hello{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;color:var(--ink)}
.prog-sub{font-size:12px;color:var(--ink-soft)}
.prog-card{background:var(--paper-2);border-radius:var(--r);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.prog-card-big .prog-card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-card-title{font-size:14px;font-weight:700;color:var(--ink)}
.prog-card-pct{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;color:var(--blue-dark)}
.prog-card-bar{height:10px;background:rgba(0,0,0,.06);border-radius:5px;overflow:hidden;margin-bottom:10px}
html.dark .prog-card-bar{background:rgba(255,255,255,.1)}
.prog-card-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-dark));border-radius:5px;transition:width .6s ease-out}
.prog-fill-green{background:linear-gradient(90deg,var(--green),var(--green-dark))}
.prog-card-stats{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-soft)}
.prog-card-stats div{text-align:center;flex:1}
.prog-card-stats strong{display:block;font-family:'Fredoka',sans-serif;font-size:18px;color:var(--ink);font-weight:700}
.prog-mini-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.prog-mini{background:var(--paper);border-radius:var(--r);border:1px solid var(--line);padding:12px 8px;text-align:center}
.prog-mini-ico{font-size:22px;margin-bottom:4px}
.prog-mini-num{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;color:var(--blue-dark)}
.prog-mini-lbl{font-size:11px;color:var(--ink-light)}
.prog-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.prog-empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);margin-bottom:14px}

/* Clickable avatar button */
.user-avatar-btn{background:none;border:none;padding:0;cursor:pointer;border-radius:50%;transition:transform .15s}
.user-avatar-btn:hover{transform:scale(1.1)}
.user-avatar-btn:active{transform:scale(0.95)}

/* Quiz option needs to support longer text now (definitions) */
.q-opt{line-height:1.5}


/* ================================================================
   SHLIFIM v3 — Clean Educational Dashboard
   One source of truth. Mobile-first. RTL-aware.
   ================================================================ */

:root {
  --bg: #F8FAFB;
  --surface: #FFFFFF;
  --surface-2: #F1F4F7;
  --surface-3: #E4E9EE;
  --border: #E1E5EA;
  --border-2: #C5CCD3;
  
  --ink: #0F172A;
  --ink-2: #475569;
  --ink-3: #94A3B8;
  --ink-4: #CBD5E1;
  
  --primary: #4F46E5;
  --primary-2: #6366F1;
  --primary-soft: #EEF2FF;
  --primary-tint: #F5F7FF;
  
  --success: #059669;
  --success-2: #10B981;
  --success-soft: #ECFDF5;
  --success-tint: #F0FDF7;
  
  --warm: #EA580C;
  --warm-2: #F97316;
  --warm-soft: #FFF7ED;
  
  --error: #DC2626;
  --error-soft: #FEF2F2;
  
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
  --shadow-md: 0 2px 8px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04);
  --shadow-lg: 0 10px 24px -8px rgba(15,23,42,0.12), 0 4px 8px -4px rgba(15,23,42,0.06);
  --shadow-xl: 0 20px 40px -12px rgba(15,23,42,0.18);
}

html.dark {
  --bg: #0B0F1A;
  --surface: #131825;
  --surface-2: #1B2235;
  --surface-3: #232C42;
  --border: #2A3447;
  --border-2: #3A4561;
  
  --ink: #F1F5F9;
  --ink-2: #CBD5E1;
  --ink-3: #94A3B8;
  --ink-4: #64748B;
  
  --primary: #6366F1;
  --primary-2: #818CF8;
  --primary-soft: rgba(99,102,241,0.15);
  --primary-tint: rgba(99,102,241,0.08);
  
  --success-soft: rgba(16,185,129,0.15);
  --success-tint: rgba(16,185,129,0.08);
  
  --warm-soft: rgba(249,115,22,0.15);
  --error-soft: rgba(220,38,38,0.15);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Heebo', system-ui, -apple-system, sans-serif;
  font-weight: 400;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  direction: rtl;
}

.app {
  background: var(--bg);
  min-height: 100vh;
  padding-bottom: 160px;
  max-width: 100vw;
  overflow-x: hidden;
}

button { font-family: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }

a { color: inherit; text-decoration: none; }

/* ============ TOP BAR ============ */
.top {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  gap: 12px;
}

.top-left, .top-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.top-title {
  flex: 1;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.3px;
}

.avatar-btn {
  background: none;
  border: 0;
  padding: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--border);
}

.avatar-btn img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.login-pill {
  background: var(--ink);
  color: var(--surface);
  border: 0;
  height: 36px;
  padding: 0 14px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.icon-pill {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--ink-2);
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 16px;
}

.icon-pill.install-pill {
  background: var(--warm-2);
  color: white;
  border-color: var(--warm-2);
}

.icon { display: inline-flex; align-items: center; justify-content: center; }
.icon svg { width: 100%; height: 100%; display: block; }

/* ============ HOME / DASHBOARD ============ */
.home {
  padding: 20px 16px 24px;
  max-width: 640px;
  margin: 0 auto;
}

.home-greeting {
  margin-bottom: 20px;
}

.greeting-text {
  font-size: 14px;
  color: var(--ink-3);
  font-weight: 500;
  margin-bottom: 2px;
}

.greeting-name {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.8px;
  color: var(--ink);
}

/* The HERO STAT — biggest visual element */
.hero-stat {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
  color: white;
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.hero-stat::before {
  content: '';
  position: absolute;
  top: -40%;
  left: -20%;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 65%);
  border-radius: 50%;
  pointer-events: none;
}

.hero-stat-label {
  font-size: 13px;
  font-weight: 600;
  opacity: 0.9;
  margin-bottom: 6px;
  position: relative;
}

.hero-stat-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 14px;
  position: relative;
}

.hero-stat-num {
  font-size: 56px;
  font-weight: 900;
  letter-spacing: -2.5px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.hero-stat-unit {
  font-size: 22px;
  font-weight: 700;
  opacity: 0.9;
}

.hero-stat-detail {
  font-size: 13px;
  font-weight: 500;
  opacity: 0.92;
  margin-bottom: 14px;
  position: relative;
}

.hero-stat-bar {
  height: 8px;
  background: rgba(255,255,255,0.2);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}

.hero-stat-fill {
  height: 100%;
  background: white;
  border-radius: 4px;
  transition: width 1s cubic-bezier(0.4,0,0.2,1);
}

/* CONTINUE BUTTON — the primary action */
.continue-btn {
  width: 100%;
  background: var(--success);
  color: white;
  border: 0;
  border-radius: 20px;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: right;
  margin-bottom: 16px;
  box-shadow: var(--shadow-lg);
  transition: transform 0.15s;
}

.continue-btn:active { transform: scale(0.98); }

.continue-icon {
  background: rgba(255,255,255,0.25);
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.continue-text {
  flex: 1;
}

.continue-title {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.4px;
  margin-bottom: 2px;
}

.continue-sub {
  font-size: 12px;
  font-weight: 500;
  opacity: 0.9;
}

.continue-arrow {
  font-size: 20px;
  opacity: 0.8;
}

/* QUICK ACTIONS GRID */
.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}

.quick-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  text-align: right;
  transition: all 0.15s;
}

.quick-card:active { transform: scale(0.97); }

.quick-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-2);
  color: var(--ink-2);
}

.quick-card.q-quiz .quick-icon { background: var(--primary-soft); color: var(--primary); }
.quick-card.q-study .quick-icon { background: var(--success-soft); color: var(--success); }
.quick-card.q-fav .quick-icon { background: var(--warm-soft); color: var(--warm); }
.quick-card.q-profile .quick-icon { background: var(--surface-3); color: var(--ink-2); }

.quick-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.3px;
}

.quick-sub {
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 500;
}

/* Streak strip */
.streak-strip {
  background: var(--warm-soft);
  border: 1px solid var(--warm-2);
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

html.dark .streak-strip { background: var(--warm-soft); }

.streak-strip-icon {
  font-size: 22px;
  line-height: 1;
}

.streak-strip-info { flex: 1; }

.streak-strip-num {
  font-size: 15px;
  font-weight: 800;
  color: var(--warm);
  letter-spacing: -0.3px;
}

.streak-strip-label {
  font-size: 11px;
  color: var(--ink-2);
  font-weight: 600;
}

/* Level card */
.level-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
}

.level-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.level-badge-big {
  background: var(--primary-soft);
  color: var(--primary);
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.level-info { flex: 1; }

.level-title-big {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 700;
  color: var(--ink-3);
  margin-bottom: 2px;
}

.level-name-big {
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.4px;
}

.level-next-info {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  text-align: left;
}

.level-bar-big {
  height: 6px;
  background: var(--surface-2);
  border-radius: 3px;
  overflow: hidden;
}

.level-bar-fill-big {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
  border-radius: 3px;
  transition: width 0.8s;
}

/* ============ STUDY (combined glossary + flash) ============ */
.study {
  max-width: 640px;
  margin: 0 auto;
  padding: 14px 16px 20px;
}

.study-header {
  margin-bottom: 14px;
}

.search-box {
  position: relative;
  margin-bottom: 10px;
}

.search-box input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 44px 12px 40px;
  font-size: 15px;
  color: var(--ink);
  font-family: inherit;
  font-weight: 500;
}

.search-box input:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--surface);
}

.search-icon-svg {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-3);
  pointer-events: none;
}

.search-clear-btn {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--surface-2);
  border: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  color: var(--ink-2);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

/* View toggle - List vs Cards */
.view-toggle {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 3px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin-bottom: 12px;
}

.view-toggle button {
  background: transparent;
  border: 0;
  padding: 9px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-3);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.view-toggle button.on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

/* Topic/letter filter chips — scrollable */
.chips-container {
  margin-bottom: 14px;
  overflow: hidden;
}

.chips-mode {
  display: flex;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 2px;
  margin-bottom: 8px;
  width: fit-content;
}

.chips-mode button {
  background: none;
  border: 0;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-3);
  border-radius: 8px;
}

.chips-mode button.on {
  background: var(--surface);
  color: var(--ink);
}

.chips-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  -webkit-overflow-scrolling: touch;
  scroll-padding-right: 16px;
  scrollbar-width: none;
}

.chips-row::-webkit-scrollbar { display: none; }

.chip {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--ink-2);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.chip.on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

.chip-count {
  font-size: 11px;
  font-weight: 700;
  opacity: 0.65;
  font-variant-numeric: tabular-nums;
}

.chip.on .chip-count { opacity: 0.85; }

/* Result meta line */
.result-line {
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 500;
  padding: 4px 2px 8px;
}

.result-line strong {
  color: var(--ink);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

/* TERM LIST */
.term-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.term-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  gap: 12px;
}

.term-row.is-studied {
  background: var(--success-tint);
  border-color: var(--success-2);
}

.term-letter-box {
  background: var(--surface-2);
  color: var(--ink-2);
  width: 36px;
  height: 36px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.term-row.is-studied .term-letter-box {
  background: var(--success-2);
  color: white;
}

.term-content { flex: 1; min-width: 0; }

.term-line-1 {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 4px;
}

.term-titles { flex: 1; min-width: 0; }

.term-heb {
  font-size: 16px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.term-eng {
  font-size: 11px;
  color: var(--ink-3);
  font-style: italic;
  margin-top: 1px;
}

.term-defin {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.55;
}

.term-row-acts {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.term-act-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--ink-3);
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 14px;
}

.term-act-btn.is-fav { background: var(--error); border-color: var(--error); color: white; }
.term-act-btn.is-studied { background: var(--success); border-color: var(--success); color: white; }

.gloss-hl {
  background: #FEF3C7;
  color: #92400E;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
}
html.dark .gloss-hl { background: rgba(252,211,77,0.25); color: #FCD34D; }

/* ============ FLASH CARDS — RESTRUCTURED ============ */
.flash-screen {
  padding: 8px 16px 16px;
  max-width: 640px;
  margin: 0 auto;
}

.flash-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding: 0 4px;
}

.flash-counter {
  font-size: 13px;
  color: var(--ink-3);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.flash-counter strong {
  color: var(--ink);
  font-weight: 800;
  font-size: 14px;
}

.flash-prog-bar {
  flex: 1;
  margin: 0 14px;
  height: 4px;
  background: var(--surface-2);
  border-radius: 2px;
  overflow: hidden;
}

.flash-prog-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 2px;
  transition: width 0.4s;
}

/* The card itself */
.flash-stage {
  position: relative;
  perspective: 1800px;
  margin-bottom: 16px;
}

.flash-card {
  width: 100%;
  height: 360px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.flash-card.flipped { transform: rotateY(-180deg); }

.flash-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 24px;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: var(--shadow-xl);
  overflow: hidden;
}

.flash-face.front {
  background: var(--surface);
  border: 1px solid var(--border);
}

.flash-face.back {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
  color: white;
  transform: rotateY(180deg);
}

.flash-corner {
  position: absolute;
  top: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.flash-corner.right { right: 16px; }
.flash-corner.left { left: 16px; }

.flash-letter-badge {
  background: var(--surface-2);
  color: var(--ink-2);
  width: 36px;
  height: 36px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}

.flash-face.back .flash-letter-badge {
  background: rgba(255,255,255,0.2);
  color: white;
}

.flash-action-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--ink-2);
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 15px;
}

.flash-action-btn.fav-on {
  background: var(--error);
  border-color: var(--error);
  color: white;
}

.flash-face.back .flash-action-btn {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.3);
  color: white;
}

.flash-tag {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--ink-3);
  margin-bottom: 16px;
}

.flash-face.back .flash-tag {
  color: rgba(255,255,255,0.75);
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  width: 100%;
  text-align: center;
  letter-spacing: 1.5px;
}

.flash-main {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: -1.5px;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 10px;
  max-width: 100%;
  word-wrap: break-word;
}

.flash-sub {
  font-size: 14px;
  color: var(--ink-3);
  font-style: italic;
  margin-bottom: 20px;
}

.flash-def-text {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.6;
  color: white;
  text-align: right;
  width: 100%;
}

.flash-flip-hint {
  position: absolute;
  bottom: 18px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: 1.2px;
}

/* Rate buttons under the card */
.flash-rate-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}

.rate-btn {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: all 0.15s;
}

.rate-btn:active { transform: scale(0.96); }

.rate-emoji { font-size: 22px; }
.rate-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-2);
  letter-spacing: -0.2px;
}

.rate-btn.r-no:hover { border-color: var(--error); background: var(--error-soft); }
.rate-btn.r-maybe:hover { border-color: var(--warm-2); background: var(--warm-soft); }
.rate-btn.r-yes:hover { border-color: var(--success); background: var(--success-soft); }

/* Navigation under flash */
.flash-nav-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.flash-nav-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--ink-2);
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.flash-nav-btn:disabled { opacity: 0.4; }

/* ============ QUIZ ============ */
.quiz-area {
  max-width: 640px;
  margin: 0 auto;
  padding: 18px 16px;
}

.quiz-scores {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}

.qsc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
}

.qsc-num {
  font-size: 24px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
  margin-bottom: 4px;
  color: var(--ink);
}

.qsc-num.g { color: var(--success); }
.qsc-num.r { color: var(--error); }

.qsc-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-3);
}

.q-question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 14px;
}

.q-tag {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--primary);
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.q-text {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: -0.3px;
  color: var(--ink);
}

.q-opts {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.q-opt-btn {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.5;
  text-align: right;
  width: 100%;
  transition: all 0.15s;
}

.q-opt-btn:not(:disabled):hover {
  border-color: var(--primary);
  background: var(--primary-tint);
}

.q-opt-btn.correct {
  background: var(--success);
  border-color: var(--success);
  color: white;
}

.q-opt-btn.wrong {
  background: var(--error-soft);
  border-color: var(--error);
  color: var(--error);
}

.q-feedback {
  margin-top: 12px;
  font-size: 14px;
  font-weight: 700;
  padding: 0 4px;
}
.q-feedback.ok { color: var(--success); }
.q-feedback.bad { color: var(--error); }

.q-next-btn {
  width: 100%;
  background: var(--ink);
  color: var(--bg);
  border: 0;
  border-radius: 14px;
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
  margin-top: 12px;
}

/* ============ PROFILE ============ */
.profile {
  max-width: 640px;
  margin: 0 auto;
  padding: 18px 16px;
}

.profile-hero {
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: white;
  border-radius: 22px;
  padding: 24px 18px 20px;
  text-align: center;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}

.profile-hero::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 65%);
  border-radius: 50%;
}

.profile-hero img, .profile-hero-placeholder {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  margin: 0 auto 12px;
  display: block;
  border: 3px solid white;
  position: relative;
  z-index: 1;
  object-fit: cover;
}

.profile-hero-placeholder {
  background: white;
  color: var(--primary);
  font-size: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.profile-name {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.4px;
  position: relative;
}

.profile-email {
  font-size: 12px;
  opacity: 0.85;
  margin-top: 4px;
  position: relative;
}

.profile-signout {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  color: white;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 999px;
  margin-top: 12px;
  position: relative;
}

.profile-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
}

.profile-section-title {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink-3);
  margin-bottom: 12px;
}

.profile-stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.pst-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.pst-card.streak-pst {
  background: var(--warm-soft);
  border-color: var(--warm-2);
}

.pst-icon { font-size: 18px; color: var(--ink-2); margin-bottom: 2px; }
.streak-pst .pst-icon { color: var(--warm); }

.pst-num {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -0.8px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.streak-pst .pst-num { color: var(--warm); }

.pst-lbl {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-3);
}

.badges-wrap {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.badge-tile {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 4px;
  text-align: center;
  opacity: 0.4;
}

.badge-tile.earned {
  background: var(--warm-soft);
  border-color: var(--warm-2);
  opacity: 1;
}

.badge-tile-icon { font-size: 22px; margin-bottom: 2px; }
.badge-tile-name {
  font-size: 9px;
  font-weight: 800;
  color: var(--ink-2);
  line-height: 1.2;
}

.about-mini {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 12px;
}

.about-mini-pic {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 2px solid var(--border);
  object-fit: cover;
}

.about-mini-name {
  font-size: 16px;
  font-weight: 800;
  color: var(--ink);
}

.about-mini-role {
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 600;
  margin-top: 2px;
}

.about-quote {
  background: var(--surface-2);
  border-right: 3px solid var(--primary);
  padding: 12px 14px;
  border-radius: 0 10px 10px 0;
  font-size: 13px;
  font-style: italic;
  color: var(--ink-2);
  line-height: 1.6;
  margin-bottom: 14px;
}

.profile-btn-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.btn-primary {
  background: var(--success);
  color: white;
  border: 0;
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  padding: 13px;
  border-radius: 12px;
  text-align: center;
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--ink);
  border: 1px solid var(--border);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  padding: 13px;
  border-radius: 12px;
  text-align: center;
}

.book-tile-v2 {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  gap: 12px;
  margin-bottom: 8px;
  align-items: center;
}

.book-cover-v2 {
  width: 52px;
  height: 68px;
  border-radius: 6px;
  object-fit: cover;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

.book-info-v2 { flex: 1; min-width: 0; }
.book-info-v2 .book-title-tile {
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
}
.book-info-v2 .book-meta-tile {
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 1px;
}
.book-price-tile {
  font-size: 14px;
  font-weight: 900;
  color: var(--primary);
  margin-top: 3px;
}

.bundle-strip {
  background: var(--primary);
  color: white;
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
}

.bundle-text { font-size: 13px; font-weight: 700; }
.bundle-save { background: var(--warm-2); color: white; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-right: 5px; }
.bundle-go { background: white; color: var(--primary); padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 800; }

/* ============ BOTTOM NAV ============ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 6px 4px max(6px, env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 0;
  z-index: 100;
}

.nav-tab {
  background: 0;
  border: 0;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--ink-3);
  font-family: inherit;
  transition: color 0.15s;
}

.nav-tab.active {
  color: var(--primary);
}

.nav-tab-icon {
  width: 22px;
  height: 22px;
}

.nav-tab-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: -0.2px;
}

/* ============ EMPTY STATES ============ */
.empty {
  text-align: center;
  padding: 60px 24px;
  color: var(--ink-3);
}

.empty-ico {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.5;
}

/* ============ HIDE OLD STUFF ============ */
.hdr-v2, .controls, .welcome-banner-v2, .bio-decor,
.streak-section, .level-card:not(.level-card-new),
.prog-card, .prog-mini-row, .prog-greeting,
.badges-section, .about-section { display: none !important; }

/* When showing the OLD flash mode (from old code), hide it */
.card-area { display: none !important; }
.card-mode { display: none !important; }

/* Search highlight */
mark.gloss-hl { background: #FEF3C7; color: #92400E; font-weight: 700; padding: 1px 4px; border-radius: 3px; }

/* Mobile micro adjustments */
@media (max-width: 380px) {
  .greeting-name { font-size: 22px; }
  .hero-stat-num { font-size: 48px; }
  .flash-main { font-size: 32px; }
  .quick-title { font-size: 14px; }
  .continue-title { font-size: 16px; }
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}



/* ================================================================
   BRAND BANNER + ABOUT + ANIMATIONS
   ================================================================ */

/* ============ BRAND BANNER ============ */
.brand-banner {
  background: linear-gradient(135deg, var(--primary) 0%, #7C3AED 50%, var(--primary-2) 100%);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  color: white;
  position: relative;
  overflow: hidden;
  box-shadow: 0 12px 28px -8px rgba(79,70,229,0.4);
  animation: brandReveal 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes brandReveal {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand-banner::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -20%;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 60%);
  border-radius: 50%;
  pointer-events: none;
  animation: brandGlow 6s ease-in-out infinite;
}

@keyframes brandGlow {
  0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.18; }
  50% { transform: scale(1.2) translate(20px, 20px); opacity: 0.25; }
}

.brand-banner::after {
  content: '';
  position: absolute;
  bottom: -30%;
  right: -10%;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 60%);
  border-radius: 50%;
  pointer-events: none;
  animation: brandGlow 8s ease-in-out infinite reverse;
}

.brand-logo-wrap {
  position: relative;
  flex-shrink: 0;
  width: 62px;
  height: 62px;
}

.brand-logo {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  border: 3px solid white;
  object-fit: cover;
  background: white;
  position: relative;
  z-index: 2;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  animation: logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-3px) rotate(3deg); }
}

.brand-pulse {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.5);
  animation: pulseRing 2.5s ease-out infinite;
  pointer-events: none;
}

@keyframes pulseRing {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(1.5); opacity: 0; }
}

.brand-text {
  flex: 1;
  position: relative;
  z-index: 1;
  min-width: 0;
}

.brand-name {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1;
  margin-bottom: 2px;
}

.brand-name-en {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 4px;
  opacity: 0.85;
  margin-bottom: 8px;
  font-family: 'Heebo', system-ui;
}

.brand-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  opacity: 0.95;
  flex-wrap: wrap;
}

.brand-company {
  background: rgba(255,255,255,0.2);
  padding: 3px 9px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.5px;
}

.brand-dot { opacity: 0.6; }

.brand-author {
  font-size: 12px;
  opacity: 0.9;
}

/* ============ TOPIC CHIPS - WITH EMOJIS ============ */
.chip-topic {
  padding: 8px 12px 8px 10px !important;
}

.chip-emoji {
  font-size: 14px;
  line-height: 1;
}

/* Chips row - hint that scrollable */
.chips-row {
  scroll-snap-type: x proximity;
  padding-right: 2px;
  padding-left: 16px;
  position: relative;
}

.chips-row::after {
  content: '';
  position: sticky;
  left: 0;
  top: 0;
  width: 24px;
  height: 100%;
  background: linear-gradient(to left, var(--bg), transparent);
  pointer-events: none;
  flex-shrink: 0;
}

.chip { scroll-snap-align: start; }

/* ============ HOME ABOUT SECTION ============ */
.home-about {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  animation: fadeUp 0.6s ease-out 0.2s backwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.home-about-header {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 14px;
}

.home-about-pic {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 3px solid var(--surface);
  box-shadow: 0 0 0 1px var(--border), 0 4px 12px rgba(15,23,42,0.08);
  object-fit: cover;
}

.home-about-name {
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.3px;
}

.home-about-role {
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 600;
  margin-top: 2px;
}

.home-about-body {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.7;
  margin-bottom: 16px;
}

.home-about-degrees {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.degree-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.degree-tag {
  background: var(--ink);
  color: white;
  font-size: 10px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.5px;
  flex-shrink: 0;
  font-family: 'Heebo', system-ui;
}

.degree-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  flex: 1;
}

.degree-uni {
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 500;
}

.home-about-quote {
  background: var(--primary-tint);
  border-right: 3px solid var(--primary);
  padding: 14px 16px;
  border-radius: 0 12px 12px 0;
  font-size: 13px;
  font-style: italic;
  color: var(--ink-2);
  line-height: 1.7;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.home-about-quote::before {
  content: '"';
  position: absolute;
  top: -10px;
  right: 10px;
  font-size: 60px;
  color: var(--primary);
  opacity: 0.15;
  font-family: Georgia, serif;
  font-weight: 900;
  line-height: 1;
}

.home-about-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.home-about-cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 800;
  text-decoration: none;
  transition: transform 0.15s;
}

.home-about-cta:active { transform: scale(0.98); }

.home-about-cta.primary {
  background: #25D366;
  color: white;
  box-shadow: 0 6px 16px -4px rgba(37,211,102,0.4);
}

.home-about-cta.secondary {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
}

.cta-icon-ws {
  font-size: 16px;
}

/* ============ ENHANCED ANIMATIONS ============ */

/* Hero stat number — count animation feel */
.hero-stat-num {
  animation: numPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s backwards;
}

@keyframes numPop {
  0% { opacity: 0; transform: scale(0.5); }
  60% { opacity: 1; transform: scale(1.15); }
  100% { opacity: 1; transform: scale(1); }
}

/* Hero stat bar fill */
.hero-stat-fill {
  animation: fillBar 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.4s backwards;
}

@keyframes fillBar {
  from { width: 0% !important; }
}

/* Streak strip fire flicker */
.streak-strip-icon {
  display: inline-block;
  animation: flameFlicker 1.5s ease-in-out infinite;
  transform-origin: bottom center;
}

@keyframes flameFlicker {
  0%, 100% { transform: scale(1) rotate(-2deg); filter: brightness(1); }
  25% { transform: scale(1.1) rotate(2deg); filter: brightness(1.15); }
  50% { transform: scale(0.95) rotate(-1deg); filter: brightness(0.95); }
  75% { transform: scale(1.05) rotate(3deg); filter: brightness(1.1); }
}

/* Streak strip pulse */
.streak-strip {
  position: relative;
  overflow: hidden;
}

.streak-strip::before {
  content: '';
  position: absolute;
  top: 0;
  right: -100%;
  width: 50%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(249,115,22,0.15), transparent);
  animation: streakShimmer 3s ease-in-out infinite;
}

@keyframes streakShimmer {
  to { right: 200%; }
}

/* Continue button - subtle breathing pulse */
.continue-btn {
  animation: continuePulse 3s ease-in-out infinite;
}

@keyframes continuePulse {
  0%, 100% { box-shadow: 0 10px 24px -8px rgba(5,150,105,0.4); }
  50% { box-shadow: 0 14px 32px -6px rgba(5,150,105,0.55); }
}

.continue-btn .continue-arrow {
  animation: arrowSlide 1.8s ease-in-out infinite;
  display: inline-block;
}

@keyframes arrowSlide {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-4px); }
}

/* Quick cards entrance stagger */
.quick-card {
  animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

.quick-card:nth-child(1) { animation-delay: 0.1s; }
.quick-card:nth-child(2) { animation-delay: 0.18s; }
.quick-card:nth-child(3) { animation-delay: 0.26s; }
.quick-card:nth-child(4) { animation-delay: 0.34s; }

@keyframes cardPop {
  from { opacity: 0; transform: translateY(12px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.quick-card:hover .quick-icon {
  transform: scale(1.1) rotate(-5deg);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Level card entrance */
.level-card {
  animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s backwards;
}

.level-badge-big {
  animation: badgeWiggle 5s ease-in-out infinite;
}

@keyframes badgeWiggle {
  0%, 90%, 100% { transform: rotate(0deg); }
  93% { transform: rotate(-8deg); }
  96% { transform: rotate(8deg); }
}

.level-bar-fill-big {
  animation: fillBar 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.6s backwards;
}

/* Background ambient particles */
.home {
  position: relative;
  overflow: visible;
}

.home::before, .home::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
}

.home::before {
  top: 30%;
  right: -100px;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, rgba(79,70,229,0.08) 0%, transparent 70%);
  animation: floatBlob1 22s ease-in-out infinite;
}

.home::after {
  top: 60%;
  left: -80px;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(234,88,12,0.06) 0%, transparent 70%);
  animation: floatBlob2 28s ease-in-out infinite;
}

html.dark .home::before { background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%); }
html.dark .home::after { background: radial-gradient(circle, rgba(234,88,12,0.12) 0%, transparent 70%); }

@keyframes floatBlob1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(-40px, 30px) scale(1.1); }
  66% { transform: translate(20px, -20px) scale(0.95); }
}

@keyframes floatBlob2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -25px) scale(1.05); }
  66% { transform: translate(-15px, 35px) scale(0.95); }
}

/* About section image - subtle glow on hover */
.home-about-pic {
  transition: transform 0.3s, box-shadow 0.3s;
}

.home-about-pic:hover {
  transform: scale(1.05);
}

/* Degree rows stagger */
.degree-row {
  animation: slideIn 0.4s ease-out backwards;
}

.degree-row:nth-child(1) { animation-delay: 0.5s; }
.degree-row:nth-child(2) { animation-delay: 0.6s; }
.degree-row:nth-child(3) { animation-delay: 0.7s; }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-12px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Quote shine */
.home-about-quote {
  position: relative;
}

.home-about-quote::after {
  content: '';
  position: absolute;
  top: 0;
  right: -100%;
  width: 80px;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(79,70,229,0.1), transparent);
  animation: quoteShine 5s ease-in-out infinite;
}

@keyframes quoteShine {
  0% { right: -100%; }
  50%, 100% { right: 200%; }
}

/* Term cards stagger on study screen */
.term-row {
  animation: termIn 0.3s ease-out backwards;
}

.term-row:nth-child(1) { animation-delay: 0.05s; }
.term-row:nth-child(2) { animation-delay: 0.08s; }
.term-row:nth-child(3) { animation-delay: 0.11s; }
.term-row:nth-child(4) { animation-delay: 0.14s; }
.term-row:nth-child(5) { animation-delay: 0.17s; }
.term-row:nth-child(n+6) { animation-delay: 0.2s; }

@keyframes termIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Topic chips entrance */
.chip {
  animation: chipPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

.chip:nth-child(1) { animation-delay: 0.05s; }
.chip:nth-child(2) { animation-delay: 0.08s; }
.chip:nth-child(3) { animation-delay: 0.11s; }
.chip:nth-child(4) { animation-delay: 0.14s; }
.chip:nth-child(n+5) { animation-delay: 0.17s; }

@keyframes chipPop {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

/* Quiz option appear */
.q-opt-btn {
  animation: optAppear 0.35s ease-out backwards;
}

.q-opt-btn:nth-child(1) { animation-delay: 0.05s; }
.q-opt-btn:nth-child(2) { animation-delay: 0.1s; }
.q-opt-btn:nth-child(3) { animation-delay: 0.15s; }
.q-opt-btn:nth-child(4) { animation-delay: 0.2s; }

@keyframes optAppear {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Correct answer celebration */
.q-opt-btn.correct {
  animation: correctBurst 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes correctBurst {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); box-shadow: 0 8px 24px rgba(16,185,129,0.4); }
  100% { transform: scale(1); }
}

/* Badge earned shine */
.badge-tile.earned {
  position: relative;
  overflow: hidden;
}

.badge-tile.earned::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: badgeShimmer 3s ease-in-out infinite;
}

@keyframes badgeShimmer {
  to { left: 100%; }
}

/* Nav tabs tap feedback */
.nav-tab {
  transition: color 0.15s;
}

.nav-tab:active {
  transform: scale(0.92);
  transition: transform 0.1s;
}

.nav-tab.active .nav-tab-icon {
  animation: navBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes navBounce {
  0% { transform: scale(1); }
  50% { transform: scale(1.25); }
  100% { transform: scale(1); }
}

/* Avatar in header - subtle ring on hover */
.avatar-btn:hover {
  transform: scale(1.05);
  transition: transform 0.2s;
}

.avatar-btn img {
  transition: transform 0.3s;
}

.avatar-btn:active {
  transform: scale(0.92);
}

/* Page entrance */
.home, .study, .quiz-area, .profile {
  animation: pageIn 0.35s ease-out;
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Flash card flip enhanced */
.flash-card {
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

.flash-face.front .flash-main {
  animation: termReveal 0.4s ease-out;
}

.flash-face.back .flash-def-text {
  animation: defReveal 0.5s ease-out;
}

@keyframes termReveal {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes defReveal {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Profile hero entrance */
.profile-hero {
  animation: heroIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes heroIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.profile-hero img, .profile-hero-placeholder {
  animation: avatarIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s backwards;
}

@keyframes avatarIn {
  from { opacity: 0; transform: scale(0); }
  to { opacity: 1; transform: scale(1); }
}

/* Streak emoji pop */

}

/* ================================================================
   BOTTOM NAV CLEARANCE — Fixed space at bottom of every page
   ================================================================ */

:root {
  --nav-height: 70px;
  --nav-clearance: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px) + 20px);
}

/* App-level bottom space (catches everything) */
.app {
  padding-bottom: var(--nav-clearance) !important;
}

/* Each page screen also explicitly reserves bottom space — belt and suspenders */
.home,
.study,
.quiz-area,
.profile,
.favs-view,
.flash-screen,
.card-mode {
  padding-bottom: 32px !important;
}

/* The bottom-nav itself */
.bottom-nav {
  height: auto;
  min-height: var(--nav-height);
  padding-top: 6px !important;
  padding-bottom: calc(env(safe-area-inset-bottom, 6px) + 6px) !important;
}

/* Mobile - make sure the clearance is right for various devices */
@media (max-width: 480px) {
  :root {
    --nav-height: 68px;
  }
}



/* ================================================================
   MASSIVE BOTTOM CLEARANCE — Final override
   Nothing else can compete with this.
   ================================================================ */

:root {
  --nav-height: 76px !important;
  --nav-clearance: 180px !important;
}

html, body {
  padding-bottom: 0 !important;
}

.app {
  padding-bottom: 180px !important;
  min-height: 100vh;
  box-sizing: border-box;
}

/* Every page container gets explicit massive padding */
.home,
.study,
.quiz-area,
.profile,
.favs-view,
.flash-screen,
.card-mode,
.gloss-wrap,
.fav-list,
.prog-wrap-main,
.about-wrap {
  padding-bottom: 120px !important;
  margin-bottom: 0 !important;
}

/* Add a visible spacer at the end of every page */
.bottom-spacer {
  height: 140px;
  width: 100%;
  flex-shrink: 0;
}

/* Bottom nav itself - keep compact but secure on bottom */
.bottom-nav {
  height: auto !important;
  min-height: 60px !important;
  padding: 8px 0 max(8px, env(safe-area-inset-bottom, 8px)) !important;
  z-index: 1000;
}

/* iOS safe area handling */
@supports (padding: max(0px)) {
  .app {
    padding-bottom: max(180px, calc(180px + env(safe-area-inset-bottom, 0px))) !important;
  }
}

/* Specific brand colors */
.pf-whatsapp { border-color: rgba(37, 211, 102, 0.3); }
.pf-whatsapp:hover { border-color: #25D366; background: rgba(37, 211, 102, 0.06); }

.pf-instagram { border-color: rgba(225, 48, 108, 0.3); }
.pf-instagram:hover { border-color: #E1306C; background: rgba(225, 48, 108, 0.06); }

.pf-phone:hover { border-color: var(--success); background: var(--success-tint); }
.pf-web:hover { border-color: var(--primary); background: var(--primary-tint); }

/* Big CTA button */
.pf-cta-row {
  margin-bottom: 14px;
}

.pf-cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(135deg, var(--primary), #7C3AED);
  color: white;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 14px;
  font-weight: 800;
  text-decoration: none;
  box-shadow: 0 6px 16px -4px rgba(79, 70, 229, 0.35);
  transition: transform 0.15s;
  letter-spacing: -0.2px;
}

.pf-cta:active {
  transform: scale(0.98);
}

.pf-cta-arrow {
  font-size: 18px;
  font-weight: 300;
  animation: pfArrowFloat 1.8s ease-in-out infinite;
  display: inline-block;
}

@keyframes pfArrowFloat {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-4px); }
}

/* Fine print */
.pf-fine {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: 0.3px;
  flex-wrap: wrap;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.pf-dot {
  color: var(--ink-4);
}

/* Mobile fine-tune */
@media (max-width: 380px) {
  .page-footer { padding: 16px 14px 14px; }
  .pf-contact-card { padding: 9px 10px; gap: 8px; }
  .pf-c-icon { font-size: 18px; }
  .pf-c-value { font-size: 11px; }
  .pf-c-label { font-size: 9px; }
  .pf-cta { font-size: 13px; padding: 12px 16px; }
  .pf-fine { font-size: 9px; }
}

/* Dark mode adjustments */
html.dark .pf-whatsapp { background: rgba(37, 211, 102, 0.08); }
html.dark .pf-instagram { background: rgba(225, 48, 108, 0.08); }

/* Animation - footer appears with a soft slide */
.page-footer {
  animation: pfSlideUp 0.5s ease-out 0.4s backwards;
}

@keyframes pfSlideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Now we don't need the bottom-spacer at all since the footer fills the space */
.bottom-spacer { display: none !important; }

/* Reduce the .app bottom padding since the footer provides natural space + the nav clearance */
.app {
  padding-bottom: 100px !important;
}
