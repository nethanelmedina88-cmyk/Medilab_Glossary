function saveLifetimeStats(){
  localStorage.setItem('ml_stats', JSON.stringify(lifetimeStats));
  if(currentUser) saveUserData(currentUser.uid);
}

async function signInWithGoogle(){
  try{
    await auth.signInWithPopup(googleProvider);
  }catch(e){
    console.error(e);
    alert('שגיאה בהתחברות. נסה שוב.');
  }
}

async function signOut(){
  // Clear currentUser FIRST so saveFavs won't push empty data to cloud
  currentUser = null;
  showUserMenu = false;
  await auth.signOut();
  // Clear local cache only (not cloud)
  favorites = new Set();
  studied = new Set();
  localStorage.setItem('ml_favs', '[]');
  localStorage.setItem('ml_studied', '[]');
  render();
}

async function loadUserData(uid){
  syncStatus = 'syncing'; render();
  try{
    const doc = await db.collection('users').doc(uid).get();
    if(doc.exists){
      const data = doc.data();
      // Cloud is source of truth on login
      favorites = new Set(data.favorites || []);
      studied = new Set(data.studied || []);
      if(data.stats) lifetimeStats = data.stats;
      localStorage.setItem('ml_favs', JSON.stringify([...favorites]));
      localStorage.setItem('ml_studied', JSON.stringify([...studied]));
      localStorage.setItem('ml_stats', JSON.stringify(lifetimeStats));
      syncStatus = 'synced';
      render();
      setTimeout(()=>{syncStatus='';render();},2000);
    } else {
      // First time user — push current local data to cloud
      await saveUserData(uid);
    }
  }catch(e){
    console.error('Load failed:', e);
    alert('שגיאה בטעינת הנתונים מהענן: ' + e.message);
    syncStatus = '';
    render();
  }
}

async function saveUserData(uid){
  if(!currentUser) return;
  syncStatus = 'syncing';
  updateSyncIndicator();
  try{
    await db.collection('users').doc(uid).set({
      displayName: currentUser.displayName,
      email: currentUser.email,
      photoURL: currentUser.photoURL,
      favorites: [...favorites],
      studied: [...studied],
      stats: lifetimeStats,
      lastSync: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    syncStatus = 'synced';
    updateSyncIndicator();
    setTimeout(()=>{ syncStatus=''; updateSyncIndicator(); }, 1500);
  }catch(e){
    console.error('Save failed:', e);
    syncStatus = 'error';
    updateSyncIndicator();
    alert('שגיאה בסנכרון: ' + e.message);
  }
}

// Update only the sync indicator without re-rendering everything
function updateSyncIndicator(){
  const banner = document.getElementById('welcome-banner');
  if(!banner || !currentUser) return;
  const name = (currentUser.displayName||'').split(' ')[0];
  let statusHtml = '';
  if(syncStatus === 'syncing') statusHtml = ' <span class="sync-spinner"></span> שומר...';
  else if(syncStatus === 'synced') statusHtml = ' ✓ נשמר בענן';
  else if(syncStatus === 'error') statusHtml = ' ⚠ שגיאה';
  else statusHtml = ' · הנתונים שלך מסונכרנים בין מכשירים';
  banner.innerHTML = 'שלום <strong>'+name+'</strong>'+statusHtml;
}

// Auth state listener
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    loadUserData(user.uid);
  } else {
    currentUser = null;
    render();
  }
});

function toggleUserMenu(){ showUserMenu = !showUserMenu; render(); }
function closeUserMenu(){ showUserMenu = false; render(); }

function getFiltered(){
  let arr = GLOSSARY;
  if(activeLetter !== 'הכל') arr = arr.filter(t=>t.letter===activeLetter);
  if(searchQ.trim()){
    const q = searchQ.trim().toLowerCase();
    arr = arr.filter(t=>t.hebrew.toLowerCase().includes(q)||t.english.toLowerCase().includes(q)||t.definition.toLowerCase().includes(q));
  }
  return arr;
}

function getLetters(){
  const all = [...new Set(GLOSSARY.map(t=>t.letter))];
  return ['הכל',...all];
}

function saveFavs(){
  localStorage.setItem('ml_favs', JSON.stringify([...favorites]));
  if(typeof currentUser !== 'undefined' && currentUser) saveUserData(currentUser.uid);
}
function saveStudied(){
  localStorage.setItem('ml_studied', JSON.stringify([...studied]));
  if(typeof currentUser !== 'undefined' && currentUser) saveUserData(currentUser.uid);
}

function buildControls(){
  const letters = getLetters();
  return `<div class="controls">
    <div class="mode-toggle" style="grid-template-columns:1fr 1fr 1fr 1fr">
      <button class="mode-btn ${mode==='glossary'?'on':''}" onclick="setMode('glossary')">${SVG_BOOK} <span>מילון</span></button>
      <button class="mode-btn ${mode==='flash'?'on':''}" onclick="setMode('flash')">${SVG_CARDS} <span>פלאש</span></button>
      <button class="mode-btn ${mode==='quiz'?'on':''}" onclick="setMode('quiz')">${SVG_TARGET} <span>מבחון</span></button>
      <button class="mode-btn ${mode==='about'?'on':''}" onclick="setMode('about')">${SVG_USER_BIO} <span>אודות</span></button>
    </div>
    <div class="search-wrap">
      <input class="search-inp" type="search" placeholder="חפש מושג..." value="${searchQ}" oninput="onSearch(this.value)" autocomplete="off"/>
    </div>
    <div class="letters">
      ${letters.map(l=>`<button class="let-btn ${l===activeLetter?'on':''}" onclick="setLetter('${l}')">${l==='הכל'?'הכל':l}</button>`).join('')}
    </div>
  </div>`;
}

function buildMain(filtered){
  if(mode==='favs') return buildFavs();
  if(mode==='about') return buildAbout();
  if(mode==='progress') return buildProgress();
  if(mode==='glossary') return buildGlossary(filtered);
  if(!filtered.length) return `<div class="empty"><div class="empty-ico">${SVG_MICROSCOPE}</div><div>לא נמצאו מושגים</div></div>`;
  if(mode==='flash') return buildFlash(filtered);
  return buildQuiz(filtered);
}

function buildFlash(filtered){
  const t = filtered[Math.min(cardIdx,filtered.length-1)];
  if(!t) return '';
  const isFav = favorites.has(t.hebrew);

function buildQuiz(filtered){
  if(!quizState.pool.length){
    // Build pool from 100 curated questions, each tagged with topic for distractor selection
    const termMap = {};
    GLOSSARY.forEach(t => termMap[t.hebrew] = t);
    let workingPool = QUIZ_QUESTIONS
      .map(q => ({ ...termMap[q.term], _topic: q.topic }))
      .filter(t => t.hebrew); // only keep those that exist in GLOSSARY
    // Apply user filter (letter or search) within the curated 100
    if(activeLetter !== 'הכל' || searchQ.trim()){
      const filteredSet = new Set(filtered.map(t=>t.hebrew));
      const inFilter = workingPool.filter(t => filteredSet.has(t.hebrew));
      if(inFilter.length > 0) workingPool = inFilter;
    }
    quizState.pool = [...workingPool].sort(()=>Math.random()-.5);
    quizState.idx = 0;quizState.correct=0;quizState.wrong=0;quizState.total=0;quizState.answered=false;

function buildQuizQuestion(term, pool){
  // Two question types only
  const type = Math.random() < 0.5 ? 'def_to_term' : 'term_to_def';
  
  // Build distractor pool from SAME sub-topic for challenging, related distractors
  const topic = term._topic;
  const sameTopicTerms = (QUIZ_DISTRACTOR_POOLS[topic] || [])
    .filter(name => name !== term.hebrew);
  
  // Map names to GLOSSARY entries
  const termMap = {};
  GLOSSARY.forEach(t => termMap[t.hebrew] = t);
  let distractors = sameTopicTerms
    .map(name => termMap[name])
    .filter(t => t); // only existing entries
  
  // Shuffle and pick 3
  distractors = distractors.sort(() => Math.random() - .5).slice(0, 3);
  
  // Safety fallback: if somehow fewer than 3 from topic, fill with closely-named glossary terms
  if(distractors.length < 3){
    const filler = GLOSSARY
      .filter(t => t.hebrew !== term.hebrew && !distractors.some(d => d.hebrew === t.hebrew))
      .sort(() => Math.random() - .5)
      .slice(0, 3 - distractors.length);
    distractors = [...distractors, ...filler];
  }
  
  let promptLabel, prompt, options;
  if(type === 'def_to_term'){
    promptLabel = '<svg viewBox="0 0 100 100" width="18" height="18" style="vertical-align:middle;margin-left:4px"><circle cx="50" cy="50" r="42" fill="none" stroke="#C44747" stroke-width="3"/><circle cx="50" cy="50" r="28" fill="none" stroke="#C44747" stroke-width="2.5"/><circle cx="50" cy="50" r="14" fill="#F47A6E" stroke="#C44747" stroke-width="2.5"/></svg> מהו המושג המתאים להגדרה?';
    prompt = term.definition;
    options = [term, ...distractors].sort(() => Math.random() - .5)
      .map(t => ({text: t.hebrew, isCorrect: t.hebrew === term.hebrew}));
  } else {
    promptLabel = '<svg viewBox="0 0 100 100" width="18" height="18" style="vertical-align:middle;margin-left:4px"><path d="M 14 18 L 50 14 L 86 18 L 86 84 L 50 80 L 14 84 Z" fill="#F9D85C" stroke="#1B6FA8" stroke-width="3"/><line x1="50" y1="14" x2="50" y2="80" stroke="#1B6FA8" stroke-width="3"/></svg> מהי ההגדרה הנכונה למושג:';
    prompt = term.hebrew;
    options = [term, ...distractors].sort(() => Math.random() - .5)
      .map(t => ({text: t.definition, isCorrect: t.hebrew === term.hebrew}));
  }
  return {promptLabel, prompt, options, term};
}

function toggleStudiedDirect(term){
  if(studied.has(term)) studied.delete(term);
  else studied.add(term);
  saveStudied();
  render();
}

function highlightText(text, q){
  if(!q || !q.trim()) return text;
  const query = q.trim();
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + ')', 'gi');
  return text.replace(re, '<mark class="gloss-hl">$1</mark>');
}

function buildFavs(){
  const favItems = GLOSSARY.filter(t=>favorites.has(t.hebrew));
  if(!favItems.length) return `<div class="empty"><div class="empty-ico">${SVG_HEART_OUTLINE}</div><div>אין מועדפים עדיין</div><div style="margin-top:6px;font-size:13px">לחץ על הלב בכרטיסיות הפלאש</div></div>`;
  return `<div class="fav-section">
    <div class="fav-title">${SVG_HEART} <span>המועדפים שלי</span> <span style="font-size:14px;color:var(--ink-light);font-weight:600">(${favItems.length})</span></div>
    ${favItems.length >= 10 ? `
      <div class="fav-banner">

        <div class="fav-item">

// ===== ACTIONS =====
function toggleDark(){ dark=!dark; document.documentElement.classList.toggle('dark',dark); saveDark(); render(); }
function setMode(m){ mode=m; if(m==='quiz') quizState.pool=[]; render(); }
function setLetter(l){ activeLetter=l; cardIdx=0; isFlipped=false; if(mode==='quiz') quizState.pool=[]; render(); }
function onSearch(v){ searchQ=v; cardIdx=0; isFlipped=false; if(mode==='quiz') quizState.pool=[]; render(); }
function flipCard(){ isFlipped=!isFlipped; const ci=document.getElementById('card-inner'); if(ci) ci.classList.toggle('flipped',isFlipped); const h=document.querySelector('.flip-hint'); if(h) h.textContent=isFlipped?'לחץ לחזרה לכרטיסייה':'לחץ לגלות את ההגדרה'; }
function nav(d){ const f=getFiltered(); cardIdx=Math.max(0,Math.min(f.length-1,cardIdx+d)); isFlipped=false; render(); }
function toggleFav(term){ if(favorites.has(term)) favorites.delete(term); else favorites.add(term); saveFavs(); render(); }
function removeFav(term){ favorites.delete(term); saveFavs(); render(); }
function markStudied(term,yes){ if(yes) studied.add(term); else studied.delete(term); saveStudied(); nav(1); }

function answerQuiz(idx){
  if(quizState.answered) return;
  const q = window._currentQuiz;
  if(!q) return;
  quizState.answered = true;
  quizState.total++;
  const chosen = q.options[idx];
  const ok = chosen.isCorrect;
  if(ok) quizState.correct++; else quizState.wrong++;
  
  // Update lifetime stats
  lifetimeStats.quizTotal = (lifetimeStats.quizTotal || 0) + 1;
  if(ok) lifetimeStats.quizCorrect = (lifetimeStats.quizCorrect || 0) + 1;
  else lifetimeStats.quizWrong = (lifetimeStats.quizWrong || 0) + 1;
  saveLifetimeStats();
  
  // Visual feedback
  document.querySelectorAll('.q-opt').forEach((b, i) => {
    b.disabled = true;
    if(q.options[i].isCorrect) b.classList.add('correct');
    else if(i === idx) b.classList.add('wrong');
  });
  const fb = document.getElementById('quiz-fb');
  if(fb){
    fb.innerHTML = ok ? '✅ נכון מאוד!' : `❌ התשובה הנכונה: <strong>${q.options.find(o=>o.isCorrect).text}</strong>`;
    fb.className = 'quiz-fb ' + (ok ? 'ok' : 'bad');
  }
  const nxt = document.getElementById('quiz-next');
  if(nxt) nxt.style.display = 'block';
}

function nextQuiz(){ quizState.idx++; quizState.answered=false; render(); }
function resetQuiz(){ quizState={correct:0,wrong:0,total:0,answered:false,idx:0,pool:[]}; render(); }
function bindEvents(){ /* already inline */ }

render();
</script>

<script>
// Register service worker for PWA / offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW registration failed:', err));
  });
}

// PWA install prompt handling
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install button after 30 seconds or 5 interactions
  setTimeout(() => {
    if (deferredPrompt && !localStorage.getItem('ml_install_dismissed')) {
      showInstallPrompt();
    }
  }, 30000);
});

function showInstallPrompt() {
  if (!deferredPrompt) return;
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1B6FA8;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 -4px 12px rgba(0,0,0,.2);z-index:1000;font-family:Assistant,sans-serif';
  banner.innerHTML = `
    <div style="flex:1">
      <div style="font-weight:700;font-size:15px">התקן את שליפים בטלפון</div>
      <div style="font-size:12px;opacity:.85">גישה מהירה, עובד גם ללא אינטרנט</div>
    </div>
    <button id="pwa-install" style="background:#fff;color:#1B6FA8;border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-family:inherit;cursor:pointer">התקן</button>
    <button id="pwa-dismiss" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);padding:8px 12px;border-radius:8px;font-family:inherit;cursor:pointer">לא תודה</button>
  `;
  document.body.appendChild(banner);
  document.getElementById('pwa-install').onclick = async () => {
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.remove();
  };
  document.getElementById('pwa-dismiss').onclick = () => {
    localStorage.setItem('ml_install_dismissed', '1');
    banner.remove();
  };
}
</script>
