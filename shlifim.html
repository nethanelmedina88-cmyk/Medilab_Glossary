function buildGlossary(filtered){
  if(!filtered.length){
    return `<div class="empty"><div class="empty-ico">${SVG_MICROSCOPE}</div><div>לא נמצאו מושגים</div><div style="margin-top:6px;font-size:13px;font-weight:500">נסה אות אחרת או חיפוש שונה</div></div>`;
  }
  
  // Group by letter
  const byLetter = {};
  filtered.forEach(t => {
    if(!byLetter[t.letter]) byLetter[t.letter] = [];
    byLetter[t.letter].push(t);
  });
  
  const letters = Object.keys(byLetter);
  const totalCount = filtered.length;
  
  return `<div class="gloss-wrap">
    <div class="gloss-summary">
      ${SVG_BOOK}
      <div style="flex:1">
        <div class="gloss-summary-num">${totalCount}</div>
        <div class="gloss-summary-lbl">מושגים ${searchQ.trim()?`עבור "${searchQ.trim()}"`:activeLetter!=='הכל'?`באות ${activeLetter}`:'במילון'}</div>
      </div>
      <a class="gloss-summary-cta" href="https://wa.me/972524295838?text=%D7%94%D7%99%D7%99%2C%20%D7%9E%D7%A2%D7%95%D7%A0%D7%99%D7%99%D7%9F%20%D7%91%D7%9E%D7%95%D7%A0%D7%97%D7%95%D7%9F%20%D7%94%D7%9E%D7%95%D7%93%D7%A4%D7%A1" target="_blank" title="קבל את המונחון המודפס">${SVG_BOOK}</a>
    </div>
    ${letters.map(letter => `
      <div class="gloss-letter-group">
        <div class="gloss-letter-hdr">
          <span class="gloss-letter-circle">${letter}</span>
          <span class="gloss-letter-count">${byLetter[letter].length} מושגים</span>
        </div>
        ${byLetter[letter].map(t => {
          const isFav = favorites.has(t.hebrew);
          const isStudied = studied.has(t.hebrew);
          const safeName = t.hebrew.replace(/'/g, "\\'");
          const theme = getTermTheme(t.hebrew);
          return `
            <div class="gloss-card ${isStudied?'is-studied':''}" style="border-right:4px solid ${theme.primary}">
              <div class="gloss-card-hdr">
                <div class="gloss-card-titles">
                  <div class="gloss-card-heb">${highlightText(t.hebrew, searchQ)}</div>
                  <div class="gloss-card-eng">${highlightText(t.english, searchQ)}</div>
                </div>
                <div class="gloss-card-actions">
                  <button class="gloss-act-btn" onclick="speakText('${safeName} ' + '${t.definition.replace(/'/g,"\\'").replace(/"/g,'')}')" title="הקרא">🔊</button>
                  <button class="gloss-act-btn ${isFav?'fav-on':''}" onclick="toggleFav('${safeName}')" title="${isFav?'הסר ממועדפים':'הוסף למועדפים'}">${isFav?SVG_HEART:SVG_HEART_OUTLINE}</button>
                  <button class="gloss-act-btn ${isStudied?'stud-on':''}" onclick="toggleStudiedDirect('${safeName}')" title="${isStudied?'סמן כלא ידוע':'סמן כידוע לי'}">${isStudied?'✓':'○'}</button>
                </div>
              </div>
              <div class="gloss-card-def">${highlightText(t.definition, searchQ)}</div>
            </div>
          `;
        }).join('')}
      </div>
    `).join('')}
  </div>`;
}

function toggleStudiedDirect(term){
  if(studied.has(term)) studied.delete(term);
  else studied.add(term);
  saveStudied();
  render();
}

function highlightText(text, q){
  if(!q || !q.trim()) return text;
  const query = q.trim();
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + ')', 'gi');
  return text.replace(re, '<mark class="gloss-hl">$1</mark>');
}

function buildFavs(){
  const favItems = GLOSSARY.filter(t=>favorites.has(t.hebrew));
  if(!favItems.length) return `<div class="empty"><div class="empty-ico">${SVG_HEART_OUTLINE}</div><div>אין מועדפים עדיין</div><div style="margin-top:6px;font-size:13px">לחץ על הלב בכרטיסיות הפלאש</div></div>`;
  return `<div class="fav-section">
    <div class="fav-title">${SVG_HEART} <span>המועדפים שלי</span> <span style="font-size:14px;color:var(--ink-light);font-weight:600">(${favItems.length})</span></div>
    ${favItems.length >= 10 ? `
      <div class="fav-banner">
        <div class="fav-banner-icon">${SVG_GIFT}</div>
        <div class="fav-banner-content">
          <div class="fav-banner-title">${favItems.length} מועדפים? מרשים!</div>

          <a class="fav-banner-btn" href="https://wa.me/972524295838?text=%D7%94%D7%99%D7%99%2C%20%D7%90%D7%A0%D7%99%20%D7%9E%D7%A2%D7%95%D7%A0%D7%99%D7%99%D7%9F%20%D7%91%D7%97%D7%91%D7%99%D7%9C%D7%AA%20%D7%94%D7%A1%D7%A4%D7%A8%D7%99%D7%9D%20%D7%91%D7%9E%D7%91%D7%A6%D7%A2" target="_blank">לחבילה במחיר ₪249 →</a>
        </div>
      </div>

      ${favItems.map(t=>`
        <div class="fav-item">
          <div style="flex:1">
            <div class="fav-item-term">${t.hebrew}</div>

// ===== ACTIONS =====
function toggleDark(){ dark=!dark; document.documentElement.classList.toggle('dark',dark); saveDark(); render(); }
function setMode(m){ mode=m; if(m==='quiz') quizState.pool=[]; render(); }
function setLetter(l){ activeLetter=l; cardIdx=0; isFlipped=false; if(mode==='quiz') quizState.pool=[]; render(); }
function setTopic(t){ activeTopic=t; cardIdx=0; isFlipped=false; if(mode==='quiz') quizState.pool=[]; render(); }
function setFilterMode(m){ filterMode=m; activeLetter='הכל'; activeTopic='הכל'; cardIdx=0; if(mode==='quiz') quizState.pool=[]; render(); }
let _searchTimeout = null;
function onSearch(v){
  searchQ = v;
  cardIdx = 0;
  isFlipped = false;
  if(mode === 'quiz') quizState.pool = [];
  // Debounce render and preserve focus on the search input
  if(_searchTimeout) clearTimeout(_searchTimeout);
  _searchTimeout = setTimeout(() => {
    const activeInput = document.activeElement;
    const wasSearchFocused = activeInput && (activeInput.classList.contains('study-search') || activeInput.classList.contains('search-inp'));
    const selStart = wasSearchFocused ? activeInput.selectionStart : null;
    const selEnd = wasSearchFocused ? activeInput.selectionEnd : null;
    render();
    if(wasSearchFocused){
      const newInput = document.querySelector('.study-search') || document.querySelector('.search-inp');
      if(newInput){
        newInput.focus();
        if(selStart !== null && selStart !== undefined){
          try { newInput.setSelectionRange(selStart, selEnd); } catch(e){}
        }
      }
    }
  }, 200);
}
function flipCard(){ isFlipped=!isFlipped; const ci=document.getElementById('card-inner'); if(ci) ci.classList.toggle('flipped',isFlipped); const h=document.querySelector('.flip-hint'); if(h) h.textContent=isFlipped?'לחץ לחזרה לכרטיסייה':'לחץ לגלות את ההגדרה'; }
function nav(d){ const f=getFiltered(); cardIdx=Math.max(0,Math.min(f.length-1,cardIdx+d)); isFlipped=false; render(); }
function toggleFav(term){ if(favorites.has(term)) favorites.delete(term); else favorites.add(term); saveFavs(); render(); }
function removeFav(term){ favorites.delete(term); saveFavs(); render(); }
function markStudied(term, yes){
  if(yes){
    studied.add(term);
    if(soundEnabled) playSuccessSound();
  } else {
    studied.delete(term);
  }
  saveStudied();
  setTimeout(() => nav(1), yes ? 400 : 0);
}

function markTermStatusAndNext(term, status){
  markTermStatus(term, status);
  if(status === 'mastered' && soundEnabled) playSuccessSound();
  else if(status === 'known' && soundEnabled){
    // softer success sound
    try{
      if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = _audioCtx; const now = ctx.currentTime;
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.value=659.25;
      g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.1, now+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now+0.25);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now+0.25);
    }catch(e){}
  }
  checkBadges();
  setTimeout(() => nav(1), 350);
}

function answerQuiz(idx){
  if(quizState.answered) return;
  const q = window._currentQuiz;
  if(!q) return;
  quizState.answered = true;
  quizState.total++;
  const chosen = q.options[idx];
  const ok = chosen.isCorrect;
  if(ok) quizState.correct++; else quizState.wrong++;
  
  // Play sound + track streak
  if(ok){
    _quizStreakCount++;
    if(soundEnabled) playSuccessSound();
  } else {
    _quizStreakCount = 0;
    if(soundEnabled) playWrongSound();
  }
  checkBadges();
  
  // Update lifetime stats
  lifetimeStats.quizTotal = (lifetimeStats.quizTotal || 0) + 1;
  if(ok) lifetimeStats.quizCorrect = (lifetimeStats.quizCorrect || 0) + 1;
  else lifetimeStats.quizWrong = (lifetimeStats.quizWrong || 0) + 1;
  saveLifetimeStats();
  
  // Visual feedback
  document.querySelectorAll('.q-opt-btn').forEach((b, i) => {
    b.disabled = true;
    if(q.options[i].isCorrect) b.classList.add('correct');
    else if(i === idx) b.classList.add('wrong');
  });
  const fb = document.getElementById('quiz-fb');
  if(fb){
    fb.innerHTML = ok ? '✅ נכון מאוד!' : `❌ התשובה הנכונה: <strong>${q.options.find(o=>o.isCorrect).text}</strong>`;
    fb.className = 'quiz-fb ' + (ok ? 'ok' : 'bad');
  }
  const nxt = document.getElementById('quiz-next');
  if(nxt) nxt.style.display = 'block';
  
  // Auto-advance after correct answer (give time to see the green highlight)
  if(ok){
    setTimeout(() => {
      if(quizState.answered){ // only if user didn't click next manually
        nextQuiz();
      }
    }, 900);
  }
}

function nextQuiz(){ quizState.idx++; quizState.answered=false; render(); }
function resetQuiz(){ quizState={correct:0,wrong:0,total:0,answered:false,idx:0,pool:[]}; render(); }
function bindEvents(){ /* already inline */ }

render();
</script>

<script>
// Register service worker for PWA / offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW registration failed:', err));
  });
}

// PWA install prompt handling
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPromptEvent = e;
  // Re-render so the install button appears
  if(typeof render === 'function') render();
});

window.addEventListener('appinstalled', () => {
  installPromptEvent = null;
  isInstalled = true;
  if(typeof render === 'function') render();
});

async function triggerInstall(){
  if(installPromptEvent){
    installPromptEvent.prompt();
    const result = await installPromptEvent.userChoice;
    if(result.outcome === 'accepted'){
      installPromptEvent = null;
      isInstalled = true;
    }
    if(typeof render === 'function') updateStreak();
render();
  } else {
    // Show manual instructions for browsers that don't support install prompt (iOS Safari, etc.)
    showInstallInstructions();
  }
}

function showInstallInstructions(){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const overlay = document.createElement('div');
  overlay.className = 'install-overlay';
  overlay.innerHTML = `
    <div class="install-modal">
      <button class="install-close" onclick="this.closest('.install-overlay').remove()">×</button>
      <div class="install-title">התקנת האפליקציה</div>
      ${isIOS ? `
        <div class="install-step">
          <span class="install-num">1</span>
          <div>לחץ על כפתור השיתוף <strong>⬆</strong> בתחתית הדפדפן</div>
        </div>
        <div class="install-step">
          <span class="install-num">2</span>
          <div>גלול מטה ובחר <strong>"הוסף למסך הבית"</strong></div>
        </div>
        <div class="install-step">
          <span class="install-num">3</span>
          <div>לחץ <strong>"הוסף"</strong> בפינה הימנית העליונה</div>
        </div>
      ` : `
        <div class="install-step">
          <span class="install-num">1</span>
          <div>פתח את תפריט הדפדפן <strong>⋮</strong> (3 נקודות)</div>
        </div>
        <div class="install-step">
          <span class="install-num">2</span>
          <div>בחר <strong>"התקן אפליקציה"</strong> או <strong>"הוסף למסך הבית"</strong></div>
        </div>
        <div class="install-step">
          <span class="install-num">3</span>
          <div>אשר את ההתקנה</div>
        </div>
      `}
      <button class="install-ok" onclick="this.closest('.install-overlay').remove()">הבנתי</button>
    </div>
  `;
  document.body.appendChild(overlay);
}


</script>
