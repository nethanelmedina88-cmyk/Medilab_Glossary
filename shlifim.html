<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>שליפים SHLIFIM · MediLab</title>
<meta name="description" content="אפליקציית שליפים: 465 מושגי ביולוגיה בכרטיסיות פלאש ומבחון. מבית MediLab."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Heebo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#3FA9D6;--blue-dark:#1B6FA8;--blue-soft:#D6ECF6;--green:#5CB85C;--green-dark:#3F8C3F;--green-soft:#E0F0DA;--yellow:#F9D85C;--coral:#F47A6E;--paper:#FAF6EC;--paper-2:#F4EFE0;--ink:#1a2A38;--ink-soft:#4A5868;--ink-light:#8090A0;--line:#E6DEC9;--r:18px}
html.dark{--paper:#0E1822;--paper-2:#16232F;--ink:#F0EBD8;--ink-soft:#C0BDB0;--ink-light:#7B8090;--line:#2A3845;--blue-soft:#1A3344;--green-soft:#1B3220}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Assistant',system-ui,sans-serif;background:var(--paper);color:var(--ink);direction:rtl;min-height:100vh;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer}

/* HEADER */
.hdr{background:var(--blue-dark);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(27,111,168,.3)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4)}
.brand-name{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:600;letter-spacing:.5px}
.brand-sub{font-size:11px;opacity:.75;display:block}
.hdr-actions{display:flex;align-items:center;gap:6px}
.dark-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center}
.dark-btn:hover{background:rgba(255,255,255,.25)}
.score-pill{background:rgba(255,255,255,.15);border:none;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}

/* PROGRESS */
.prog-wrap{margin-top:10px}
.prog-info{display:flex;justify-content:space-between;font-size:11px;opacity:.8;margin-bottom:4px}
.prog-bar{height:3px;background:rgba(255,255,255,.2);border-radius:2px}
.prog-fill{height:3px;background:#fff;border-radius:2px;transition:width .4s}

/* CONTROLS */
.controls{padding:12px 16px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mode-btn{padding:9px 12px;border-radius:var(--r);border:1.5px solid var(--blue);background:var(--paper);color:var(--blue-dark);font-size:14px;font-weight:600;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.mode-btn.on{background:var(--blue-dark);color:#fff;border-color:var(--blue-dark)}
.letters{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.letters::-webkit-scrollbar{display:none}
.let-btn{padding:5px 9px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.let-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-dark);font-weight:700}
.search-wrap{margin-bottom:10px}
.search-inp{width:100%;padding:9px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;font-family:inherit;outline:none}
.search-inp:focus{border-color:var(--blue)}

/* FLASH CARD */
.card-area{padding:12px 16px}
.card-outer{perspective:1000px;height:270px;cursor:pointer;user-select:none;margin-bottom:10px}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.card-inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--r);padding:22px 20px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.face.front{background:var(--paper)}
.face.back{background:var(--blue-dark);color:#fff;transform:rotateY(180deg)}
.face-label{font-size:11px;letter-spacing:1.5px;opacity:.45;text-transform:uppercase}
.face.back .face-label{opacity:.6;color:#fff}
.face-term{font-family:'Fredoka',sans-serif;font-size:30px;font-weight:600;color:var(--ink);text-align:center}
.face-en{font-size:13px;color:var(--ink-light);text-align:center}
.face-def{font-size:14px;color:#fff;text-align:center;line-height:1.65}
.face-backterm{font-family:'Fredoka',sans-serif;font-size:15px;color:rgba(255,255,255,.7);margin-bottom:4px;text-align:center}
.let-badge{position:absolute;top:14px;right:16px;font-size:12px;padding:3px 9px;border-radius:12px;font-weight:700}
.face.front .let-badge{background:var(--blue-soft);color:var(--blue-dark)}
.face.back .let-badge{background:rgba(255,255,255,.18);color:#fff}
.flip-hint{text-align:center;font-size:12px;color:var(--ink-light)}
.fav-indicator{position:absolute;bottom:14px;left:16px;font-size:18px}

/* NAV ROW */
.nav-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.nav-btn{flex:1;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:600;transition:all .1s}
.nav-btn:hover{background:var(--blue-soft)}
.nav-btn:disabled{opacity:.3;cursor:default}
.counter{min-width:50px;text-align:center;font-size:13px;color:var(--ink-soft);font-weight:600}
.fav-btn{background:none;border:none;font-size:22px;padding:5px;border-radius:50%;transition:transform .15s}
.fav-btn:hover{transform:scale(1.2)}

/* KNOWN ROW */
.known-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.known-btn{padding:10px;border-radius:var(--r);border:none;font-size:14px;font-weight:700;transition:all .15s}
.known-btn.yes{background:var(--green-soft);color:var(--green-dark)}
.known-btn.yes:hover{background:#c6e8bc}
.known-btn.no{background:#fde8e6;color:#a33}
.known-btn.no:hover{background:#f9ccc8}

/* QUIZ */
.quiz-area{padding:12px 16px}
.score-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sc-card{background:var(--paper-2);border-radius:var(--r);padding:10px;text-align:center;border:1px solid var(--line)}
.sc-num{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700}
.sc-lbl{font-size:11px;color:var(--ink-light)}
.sc-num.g{color:var(--green-dark)}
.sc-num.r{color:#c44}
.quiz-q{background:var(--paper-2);border-radius:var(--r);padding:18px 16px;margin-bottom:12px;border:1.5px solid var(--line)}
.quiz-q-tag{font-size:11px;color:var(--ink-light);letter-spacing:1px;margin-bottom:8px;text-align:center}
.quiz-def-text{font-size:15px;color:var(--ink);line-height:1.65;text-align:center}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{padding:13px 16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;font-weight:600;text-align:right;transition:all .15s;font-family:inherit}
.q-opt:hover:not([disabled]){border-color:var(--blue);background:var(--blue-soft)}
.q-opt.correct{background:#e3f5da;border-color:var(--green-dark);color:var(--green-dark)}
.q-opt.wrong{background:#fde8e6;border-color:#c44;color:#c44}
.q-opt[disabled]{cursor:default}
.quiz-fb{text-align:center;margin-top:10px;font-size:15px;font-weight:700;min-height:24px}
.quiz-fb.ok{color:var(--green-dark)}
.quiz-fb.bad{color:#c44}
.quiz-next{width:100%;margin-top:10px;padding:12px;border-radius:var(--r);background:var(--blue-dark);color:#fff;border:none;font-size:15px;font-weight:700;font-family:inherit;transition:background .15s}
.quiz-next:hover{background:var(--blue)}
.quiz-next[style*="none"]{display:none!important}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--ink-light)}
.empty-ico{font-size:40px;margin-bottom:10px}

/* FAV LIST */
.fav-section{padding:12px 16px}
.fav-title{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fav-list{display:flex;flex-direction:column;gap:8px}
.fav-item{background:var(--paper-2);border-radius:var(--r);padding:12px 16px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fav-item-term{font-weight:700;font-size:15px;color:var(--ink)}
.fav-item-en{font-size:12px;color:var(--ink-light);margin-top:2px}
.fav-item-def{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.5}
.fav-remove{background:none;border:none;font-size:18px;flex-shrink:0;opacity:.5;padding:2px}
.fav-remove:hover{opacity:1}

/* STUDIED BADGE */
.studied-badge{display:inline-block;background:var(--green-soft);color:var(--green-dark);border-radius:10px;font-size:11px;padding:2px 7px;font-weight:700;margin-top:4px}

/* ABOUT */
.about-wrap{padding:16px}
.about-profile{background:var(--paper-2);border-radius:var(--r);border:1px solid var(--line);padding:18px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start}
.about-portrait{width:72px;height:72px;border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid var(--blue)}
.about-name{font-family:'Fredoka',sans-serif;font-size:19px;font-weight:700;color:var(--ink)}
.about-role{font-size:13px;color:var(--blue-dark);font-weight:600;margin:2px 0 6px}
.about-bio{font-size:13px;color:var(--ink-soft);line-height:1.6}
.about-quote{font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:8px;padding-right:10px;border-right:3px solid var(--yellow)}
.degrees{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.deg{display:flex;align-items:flex-start;gap:10px}
.deg-tag{background:var(--blue-dark);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;margin-top:2px}
.deg-name{font-size:13px;font-weight:700;color:var(--ink)}
.deg-place{font-size:11px;color:var(--ink-light)}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.stat-card{background:var(--paper-2);border-radius:var(--r);padding:10px;text-align:center;border:1px solid var(--line)}
.stat-n{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;color:var(--blue-dark)}
.stat-l{font-size:11px;color:var(--ink-light)}
.cta-row{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cta-btn{padding:12px;border-radius:var(--r);font-size:15px;font-weight:700;text-align:center;text-decoration:none;font-family:inherit;border:none;display:block}
.cta-primary{background:var(--green-dark);color:#fff}
.cta-ghost{background:var(--paper-2);color:var(--blue-dark);border:1.5px solid var(--blue)}
.contact-line{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:8px}
.contact-line a{color:var(--blue-dark);text-decoration:none;font-weight:600}
.books-section{margin-top:4px}
.books-head{margin-bottom:12px}
.books-title{font-family:'Fredoka',sans-serif;font-size:19px;font-weight:700;color:var(--ink)}
.books-sub{font-size:12px;color:var(--ink-light);margin-top:3px}
.books-grid{display:flex;flex-direction:column;gap:10px}
.book-card{background:var(--paper-2);border-radius:var(--r);border:1px solid var(--line);display:flex;gap:12px;padding:14px;text-decoration:none;color:inherit;transition:border-color .15s}
.book-card:hover{border-color:var(--blue)}
.book-cover img{width:60px;border-radius:8px;object-fit:cover;display:block}
.book-tag{font-size:10px;font-weight:700;background:var(--blue-soft);color:var(--blue-dark);padding:2px 7px;border-radius:8px;display:inline-block;margin-bottom:4px}
.book-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px}
.book-desc{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:5px}
.book-price{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:700;color:var(--green-dark)}
.bundle{background:var(--blue-dark);border-radius:var(--r);padding:16px;margin-top:12px;color:#fff}
.bundle-title{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:700;margin-bottom:4px}
.bundle-desc{font-size:13px;opacity:.85;margin-bottom:12px}
.bundle-prices{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.price-old{font-size:14px;text-decoration:line-through;opacity:.55}
.price-new{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700}
.price-save{font-size:12px;background:var(--yellow);color:#333;padding:2px 8px;border-radius:10px;font-weight:700}
.bundle-btn{display:block;background:#fff;color:var(--blue-dark);text-align:center;border-radius:var(--r);padding:11px;font-size:15px;font-weight:700;text-decoration:none}

/* LOGIN UI */
.login-btn{background:#fff;color:#444;border:none;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit}
.login-btn:hover{background:#f0f0f0}
.login-btn img{width:14px;height:14px}
.user-pill{background:rgba(255,255,255,.15);color:#fff;padding:3px 8px 3px 3px;border-radius:20px;font-size:11px;display:flex;align-items:center;gap:6px;cursor:pointer;border:none;font-family:inherit}
.user-pill:hover{background:rgba(255,255,255,.25)}
.user-pill img{width:24px;height:24px;border-radius:50%;border:1.5px solid #fff}
.user-name{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.user-menu-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.2);z-index:199}
.user-menu{position:fixed;top:60px;left:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;min-width:220px}
.user-menu-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.user-menu-row img{width:40px;height:40px;border-radius:50%}
.user-menu-name{font-weight:700;color:var(--ink);font-size:14px}
.user-menu-email{font-size:11px;color:var(--ink-light)}
.user-menu-sync{font-size:11px;color:var(--green-dark);margin-bottom:10px;text-align:center}
.signout-btn{width:100%;padding:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit}
.signout-btn:hover{background:#fde8e6;color:#c44}
.welcome-banner{background:linear-gradient(135deg,var(--green-soft),var(--blue-soft));padding:10px 16px;font-size:13px;color:var(--ink);text-align:center;border-bottom:1px solid var(--line)}
.welcome-banner strong{color:var(--blue-dark)}
.sync-spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--blue);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-left:5px}
@keyframes spin{to{transform:rotate(360deg)}}

/* USER ZONE — visible logout button */
.user-zone{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);border-radius:20px;padding:3px 4px 3px 8px}
.user-avatar{width:26px;height:26px;border-radius:50%;border:1.5px solid #fff;object-fit:cover}
.user-zone .user-name{color:#fff;font-size:12px;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn{background:#fff;color:var(--blue-dark);border:none;width:26px;height:26px;border-radius:50%;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background .15s}
.logout-btn:hover{background:#fde8e6;color:#c44}

/* PROGRESS PAGE */
.prog-wrap-main{padding:16px}
.prog-greeting{display:flex;align-items:center;gap:12px;margin-bottom:16px;background:linear-gradient(135deg,var(--blue-soft),var(--green-soft));border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.prog-greeting img{width:48px;height:48px;border-radius:50%;border:2px solid #fff}
.prog-hello{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;color:var(--ink)}
.prog-sub{font-size:12px;color:var(--ink-soft)}
.prog-card{background:var(--paper-2);border-radius:var(--r);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.prog-card-big .prog-card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-card-title{font-size:14px;font-weight:700;color:var(--ink)}
.prog-card-pct{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;color:var(--blue-dark)}
.prog-card-bar{height:10px;background:rgba(0,0,0,.06);border-radius:5px;overflow:hidden;margin-bottom:10px}
html.dark .prog-card-bar{background:rgba(255,255,255,.1)}
.prog-card-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-dark));border-radius:5px;transition:width .6s ease-out}
.prog-fill-green{background:linear-gradient(90deg,var(--green),var(--green-dark))}
.prog-card-stats{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-soft)}
.prog-card-stats div{text-align:center;flex:1}
.prog-card-stats strong{display:block;font-family:'Fredoka',sans-serif;font-size:18px;color:var(--ink);font-weight:700}
.prog-mini-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.prog-mini{background:var(--paper);border-radius:var(--r);border:1px solid var(--line);padding:12px 8px;text-align:center}
.prog-mini-ico{font-size:22px;margin-bottom:4px}
.prog-mini-num{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;color:var(--blue-dark)}
.prog-mini-lbl{font-size:11px;color:var(--ink-light)}
.prog-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.prog-empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);margin-bottom:14px}

/* Clickable avatar button */
.user-avatar-btn{background:none;border:none;padding:0;cursor:pointer;border-radius:50%;transition:transform .15s}
.user-avatar-btn:hover{transform:scale(1.1)}
.user-avatar-btn:active{transform:scale(0.95)}

/* Quiz option needs to support longer text now (definitions) */
.q-opt{line-height:1.5}

/* ============ TYPOGRAPHY UPGRADES — bigger, bolder fonts like the main site ============ */
body{font-family:'Assistant','Heebo',system-ui,sans-serif;font-weight:500;font-size:16px}

/* HEADER — bigger brand */
.brand-name{font-family:'Fredoka','Heebo',sans-serif!important;font-size:22px!important;font-weight:700!important;letter-spacing:.3px!important}
.brand-sub{font-size:12px!important;font-weight:600!important;opacity:.85}
.brand img{width:44px!important;height:44px!important;border-radius:50%!important;border:2.5px solid rgba(255,255,255,.6)!important}

/* SCORE PILL — bolder */
.score-pill{font-size:14px!important;font-weight:700!important;padding:6px 12px!important;gap:6px!important}
.score-pill svg{width:18px!important;height:18px!important}

/* PROGRESS BAR */
.prog-info{font-size:12px!important;font-weight:600!important;opacity:.95!important}

/* MODE BUTTONS — bigger, bolder */
.mode-btn{font-size:15px!important;font-weight:700!important;padding:11px 8px!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:6px!important;line-height:1!important}
.mode-btn svg{width:20px!important;height:20px!important;flex-shrink:0}
.mode-btn span{font-family:'Fredoka','Heebo',sans-serif}

/* LETTER FILTER buttons */
.let-btn{font-size:15px!important;font-weight:700!important;padding:6px 11px!important;font-family:'Fredoka','Heebo',sans-serif!important}

/* SEARCH INPUT */
.search-inp{font-size:16px!important;font-weight:600!important;padding:11px 16px!important}
.search-inp::placeholder{font-weight:500;opacity:.55}

/* FLASH CARD — much bigger term */
.card-outer{height:300px!important}
.face{padding:26px 22px!important;border-width:2.5px!important}
.face-term{font-family:'Fredoka','Heebo',sans-serif!important;font-size:38px!important;font-weight:700!important;letter-spacing:-.5px!important;line-height:1.15!important}
.face-en{font-size:15px!important;font-weight:600!important;margin-top:3px}

/* Float animation — same as the original MediLab site */
@keyframes float{
  0%,100%{transform:translateY(0) rotate(var(--r,0deg))}
  50%{transform:translateY(-12px) rotate(var(--r,0deg))}
}

/* Apply gentle floating to small SVG decorations in cards */
.card-bio-decor{animation:floatSmall 5s ease-in-out infinite}

@keyframes floatSmall{
  0%,100%{transform:translateY(-50%) rotate(0deg)}
  50%{transform:translateY(calc(-50% - 6px)) rotate(3deg)}
}

/* Card back decoration has different transform origin */
.card-bio-decor-back{animation:floatSmallBack 6s ease-in-out infinite;animation-delay:-1.5s}

  0%,100%{transform:translateY(0) rotate(0deg)}

}

.gloss-letter-circle{animation:wobble 8s ease-in-out infinite}

<script>
const GLOSSARY = [{"letter":"א","hebrew":"אאוקריוטים","english":"Eukaryote","definition":"אורגניזמים שתאיהם מכילים גרעין ואברונים תחומים בקרום. למשל בעלי חיים, צמחים, פטריות ופרוטיסטים."},{"letter":"א","hebrew":"אבולוציה","english":"Evolution","definition":"שינוי בתכונות תורשתיות באוכלוסייה לאורך דורות, כתוצאה מברירה טבעית של פרטים מותאמים יותר."},{"letter":"א","hebrew":"אבי העורקים","english":"Aorta","definition":"העורק הגדול ביותר בגוף, יוצא מהחדר השמאלי ומוביל דם עשיר בחמצן לכל הגוף (פרט לריאות)."},{"letter":"א","hebrew":"אברי רבייה","english":"Reproductive organs","definition":"האיברים המייצרים גמטות ומאפשרים הפריה והעמדת צאצאים: גונדות, צינורות ואיברי הזדווגות."},{"letter":"א","hebrew":"אדנין (A)","english":"Adenine","definition":"בסיס חנקני בנוקלאוטיד הנקשר בשני קשרי מימן עם תימין ב-DNA או עם אורציל ב-RNA."},{"letter":"א","hebrew":"אדרנלין","english":"Adrenaline","definition":"הורמון מבלוטת יותרת הכליה המופרש במצבי לחץ, מעלה דופק, לחץ דם ורמת גלוקוז בדם."},{"letter":"א","hebrew":"אוטוטרוף","english":"Autotroph","definition":"יצור המייצר בעצמו חומר אורגני מחומרים אנאורגניים, בעיקר דרך פוטוסינתזה (כמו צמחים ואצות)."},{"letter":"א","hebrew":"אוכלוסייה","english":"Population","definition":"קבוצת פרטים בני אותו מין החיים באותו אזור באותו זמן."},{"letter":"א","hebrew":"אוסמוזה","english":"Osmosis","definition":"מעבר פסיבי של מים דרך קרום חדיר למחצה, מריכוז מומסים נמוך לריכוז גבוה."},{"letter":"א","hebrew":"אופטימלית, טמפרטורה","english":"Optimum Temperature","definition":"הטמפרטורה בה קצב פעילות האנזים מגיע למקסימום, ללא פגיעה במבנה החלבון."},{"letter":"א","hebrew":"אופטימלית, רמת חומציות","english":"Optimum pH","definition":"רמת ה-pH בה קצב פעילות האנזים מגיע למקסימום; משתנה בין אנזימים שונים."},{"letter":"א","hebrew":"אופרון","english":"Operon","definition":"קבוצת גנים סמוכים בחיידק המשועתקים יחד תחת בקרה משותפת של פרומוטר ואופרטור."},{"letter":"א","hebrew":"אור","english":"Light","definition":"קרינה אלקטרומגנטית המהווה מקור אנרגיה לפוטוסינתזה ואות סביבתי המשפיע על תהליכים בצמחים ובבעלי חיים."},{"letter":"א","hebrew":"אורגניזם","english":"Organism","definition":"יצור חי הבנוי מתא אחד או יותר, מקיים חילוף חומרים ומסוגל להתרבות בכוחות עצמו."},{"letter":"א","hebrew":"אורגניזם מהונדס גנטית","english":"GMO","definition":"אורגניזם שהחומר הגנטי שלו שונה באופן מלאכותי בהנדסה גנטית כדי להקנות לו תכונות חדשות."},{"letter":"א","hebrew":"אורציל (U)","english":"Uracil","definition":"בסיס חנקני המופיע ב-RNA במקום תימין, נקשר לאדנין בשני קשרי מימן."},{"letter":"א","hebrew":"אזורים לא מקודדים לחלבון","english":"Non-coding regions","definition":"אזורים ב-DNA או ב-RNA שאינם מתורגמים לחלבון, כוללים אינטרונים ואזורים מווסתים."},{"letter":"א","hebrew":"אזורים מקודדים לחלבון (CDS)","english":"Coding Sequence","definition":"רצף הנוקלאוטידים המקודד לחלבון, מקודון ההתחלה ועד לקודון הסיום."},{"letter":"א","hebrew":"איזוטונית, תמיסה","english":"Isotonic Solution","definition":"תמיסה שריכוז המומסים בה שווה לזה שבתא; נפח התא נשמר קבוע."},{"letter":"א","hebrew":"אינטרון","english":"Intron","definition":"רצף נוקלאוטידים בגן ובתעתיק הראשוני, שאינו מקודד לחלבון ומוסר בתהליך השחבור."},{"letter":"א","hebrew":"אינסולין","english":"Insulin","definition":"הורמון מתאי ביטא בלבלב המופרש כשרמת הסוכר בדם עולה, ומעודד כניסת גלוקוז לתאים."},{"letter":"א","hebrew":"אלדוסטרון","english":"Aldosterone","definition":"הורמון סטרואידי מקליפת יותרת הכליה המווסת ספיגה חוזרת של נתרן ומים בכליות."},{"letter":"א","hebrew":"אלל","english":"Allele","definition":"אחת מצורות אפשריות של גן באוכלוסייה; ליצור דיפלואידי יש שני אללים לכל גן."},{"letter":"א","hebrew":"אלל דומיננטי","english":"Dominant Allele","definition":"אלל שלטני המתבטא הן בפרט הומוזיגוט והן בהטרוזיגוט; מסומן באות גדולה."},{"letter":"א","hebrew":"אלל רצסיבי","english":"Recessive Allele","definition":"אלל נסגני המתבטא רק בפרט הומוזיגוט; מסומן באות קטנה."},{"letter":"א","hebrew":"אלקטרופורזה","english":"Electrophoresis","definition":"שיטה להפרדת חלבונים או חומצות גרעין לפי גודל ומטען חשמלי באמצעות זרם חשמלי על גבי ג'ל."},{"letter":"א","hebrew":"אנדוציטוזה","english":"Endocytosis","definition":"קליטת חומרים אל תוך התא על ידי כליאתם בבועית הנוצרת מקיפול קרום התא, תוך השקעת אנרגיה."},{"letter":"א","hebrew":"אנדותל","english":"Endothelium","definition":"שכבת תאים דקה המרפדת את פנים הלב, כלי הדם וצינורות הלימפה."},{"letter":"א","hebrew":"אנזים","english":"Enzyme","definition":"חלבון המזרז תהליכים מטבוליים בתא; מבנהו המרחבי קובע את תפקודו ואת המצע אליו ייקשר."},{"letter":"א","hebrew":"אנזים משעתק","english":"RNA Polymerase","definition":"אנזים היוצר מולקולת RNA לאורך תבנית של DNA, מתחיל מאתר מקדם בגן."},{"letter":"א","hebrew":"אנזים שעתוק הפוך","english":"Reverse Transcriptase","definition":"אנזים נגיפי היוצר DNA מתבנית של RNA; משמש בהנדסה גנטית ליצירת cDNA."},{"letter":"א","hebrew":"אנזימי הגבלה","english":"Restriction Enzymes","definition":"אנזימים מחיידקים החותכים DNA ברצפים ספציפיים; משמשים להחדרת גנים בהנדסה גנטית."},{"letter":"א","hebrew":"אנטי-קודון","english":"Anti-Codon","definition":"רצף שלושה בסיסים ב-tRNA המשלים את הקודון ב-mRNA ומאפשר הובלת החומצה האמינית הנכונה."},{"letter":"א","hebrew":"אנטיביוטיקה","english":"Antibiotics","definition":"חומרים הפוגעים בתהליכים חיוניים בחיידקים; מקורם טבעי במיקרואורגניזמים או סינתטי במעבדה."},{"letter":"א","hebrew":"אנטיגן","english":"Antigen","definition":"\"תעודת זהות\" מולקולרית של גוף זר המעוררת תגובה חיסונית."},{"letter":"א","hebrew":"אנמיה","english":"Anemia","definition":"מצב של פגיעה ביכולת אספקת חמצן לתאים, בדרך כלל בשל מחסור בהמוגלובין או בתאי דם אדומים."},{"letter":"א","hebrew":"אנרגיה כימית","english":"Chemical Energy","definition":"אנרגיה פוטנציאלית האגורה בקשרים הכימיים של מולקולות, משתחררת בעת שבירת הקשרים."},{"letter":"א","hebrew":"אנרגיית אור","english":"Light Energy","definition":"אנרגיה במופע פוטונים, מקורה בשמש; נקלטת בכלורופיל ומומרת לאנרגיה כימית בפוטוסינתזה."},{"letter":"א","hebrew":"אסטרוגן","english":"Estrogen","definition":"הורמון מין סטרואידי מהשחלות, מבשיל את הביצית, מעבה את רירית הרחם ומפתח סימני מין משניים."},{"letter":"א","hebrew":"אקולוגיה","english":"Ecology","definition":"מדע החוקר את יחסי הגומלין בין אורגניזמים לבין סביבתם הטבעית ואת התפוצה שלהם."},{"letter":"א","hebrew":"אקסון","english":"Axon","definition":"שלוחה ארוכה היוצאת מגוף תא העצב, דרכה נשלח האות החשמלי לקצוות המסועפים בקצה."},{"letter":"א","hebrew":"אקסון (גנטיקה)","english":"Exon","definition":"רצף ב-DNA הנשאר ב-mRNA הסופי לאחר השחבור ויכול להיות מתורגם לחלבון."},{"letter":"א","hebrew":"אקסוציטוזה","english":"Exocytosis","definition":"פליטת חומרים מהתא החוצה על ידי התאחות בועית עם קרום התא."},{"letter":"א","hebrew":"אתנול","english":"Ethanol","definition":"תרכובת אורגנית הנוצרת כתוצר בתסיסה כוהלית של שמרים וחיידקים בתנאים אנאארוביים."},{"letter":"א","hebrew":"אתר אלוסטרי","english":"Allosteric Site","definition":"אתר באנזים השונה מהאתר הפעיל, אליו נקשר מעכב לא תחרותי המשנה את פעילות האנזים."},{"letter":"א","hebrew":"אתר מפעיל","english":"Operator","definition":"מקטע DNA סמוך לאתר המקדם באופרון, אליו נקשר חלבון מווסת השולט בקצב השעתוק."},{"letter":"א","hebrew":"אתר מקדם","english":"Promoter","definition":"מקטע DNA במעלה הגן האחראי על גיוס האנזים המשעתק ועל התחלת השעתוק."},{"letter":"א","hebrew":"אתר פעיל","english":"Active Site","definition":"אזור באנזים אליו נקשר המצע; בעל התאמה מרחבית ייחודית לסובסטרט."},{"letter":"ב","hebrew":"בדיקת שתן","english":"Urinalysis","definition":"בדיקה רפואית של הרכב השתן, משמשת לאבחון מחלות מטבוליות, זיהומים ובעיות אחרות."},{"letter":"ב","hebrew":"בועית מתכווצת","english":"Contractile Vacuole","definition":"אברון בחד-תאיים פרוטיסטים המסלק עודפי מים שחדרו בסביבה היפוטונית, תהליך אקטיבי."},{"letter":"ב","hebrew":"ביומסה","english":"Biomass","definition":"המסה הכוללת של היצורים החיים באזור מסוים, נמדדת לרוב כמשקל יבש ליחידת שטח."},{"letter":"ב","hebrew":"ביוספרה","english":"Biosphere","definition":"סך כל המערכות האקולוגיות בכדור הארץ שבהן מתקיימים חיים."},{"letter":"ב","hebrew":"בית גידול","english":"Habitat","definition":"המרחב הפיזי הטבעי בו חיים אורגניזמים, מאופיין בגורמים ביוטיים ואביוטיים."},{"letter":"ב","hebrew":"בלוטה","english":"Gland","definition":"תא או רקמה היוצרת ומפרישה חומרים כמו הורמונים, אנזימים, דמעה, זיעה או חלב."},{"letter":"ב","hebrew":"בלוטה אנדוקרינית","english":"Endocrine Gland","definition":"בלוטה המפרישה הורמונים ישירות לזרם הדם, ללא צינור מוצא."},{"letter":"ב","hebrew":"בלוטה אקסוקרינית","english":"Exocrine Gland","definition":"בלוטה המפרישה דרך צינור מוצא חומרים אל הסביבה החיצונית, כמו רוק, זיעה או אנזימי עיכול."},{"letter":"ב","hebrew":"בלוטת האצטרובל","english":"Pineal Gland","definition":"בלוטה במוח המייצרת מלטונין, המווסת את השעון הביולוגי ומחזורי שינה-ערות."},{"letter":"ב","hebrew":"בלוטת התימוס","english":"Thymus Gland","definition":"בלוטה במרכז בית החזה שבה מתפתחים ומבשילים לימפוציטים מסוג T; פעילה בעיקר בילדות."},{"letter":"ב","hebrew":"בלוטת התריס","english":"Thyroid Gland","definition":"בלוטה בבסיס הצוואר המייצרת T3 ו-T4, המווסתים את קצב חילוף החומרים והגדילה."},{"letter":"ב","hebrew":"בלוטת יותרת המוח","english":"Pituitary Gland","definition":"בלוטה במוח (היפופיזה) המפרישה הורמונים השולטים על בלוטות רבות אחרות בגוף."},{"letter":"ב","hebrew":"בסיס חנקני","english":"Nitrogenous Base","definition":"אחד ממרכיבי הנוקלאוטיד; ארבעה סוגים ב-DNA (A, T, C, G) ו-U במקום T ב-RNA."},{"letter":"ב","hebrew":"בקטריופאג'","english":"Bacteriophage","definition":"נגיף החודר ומתרבה בתוך תאי חיידקים."},{"letter":"ב","hebrew":"ברירה טבעית","english":"Natural Selection","definition":"מנגנון אבולוציוני שבו פרטים מותאמים שורדים ומעמידים יותר צאצאים, ובכך מעלים את שכיחות התכונות שלהם."},{"letter":"ב","hebrew":"ברירה מלאכותית","english":"Artificial Selection","definition":"תהליך מכוון בידי האדם לטיפוח זנים עם תכונות רצויות, על ידי שליטה ברבייה."},{"letter":"ב","hebrew":"בררנות הקרום","english":"Selective Permeability","definition":"תכונת קרום התא לאפשר מעבר חופשי רק לחלק מהחומרים, בהתאם לתכונותיהם."},{"letter":"ג","hebrew":"גדיל","english":"Strand","definition":"רצף ארוך של נוקלאוטידים המהווה צד אחד של מולקולת DNA או RNA."},{"letter":"ג","hebrew":"גדיל משלים","english":"Complementary Strand","definition":"גדיל DNA הנוצר על ידי זיווג בסיסים עם הגדיל המקורי (A-T, C-G) בתהליך השכפול."},{"letter":"ג","hebrew":"גואנין (G)","english":"Guanine","definition":"בסיס חנקני בנוקלאוטיד הנקשר בשלושה קשרי מימן עם ציטוזין."},{"letter":"ג","hebrew":"גונדה","english":"Gonad","definition":"בלוטת מין המייצרת גמטות והורמוני מין; אשכים בזכרים ושחלות בנקבות."},{"letter":"ג","hebrew":"גופיף צהוב","english":"Corpus Luteum","definition":"מבנה הנוצר מהזקיק לאחר הביוץ, מפריש פרוגסטרון לעיבוי רירית הרחם."},{"letter":"ג","hebrew":"גורם א-ביוטי","english":"Abiotic Factor","definition":"גורם דומם בסביבה המשפיע על אורגניזמים, כמו טמפרטורה, מים, אור או pH."},{"letter":"ג","hebrew":"גורם ביוטי","english":"Biotic Factor","definition":"אורגניזם או חלק ממנו בסביבה, המשפיע על שאר היצורים החיים בה."},{"letter":"ג","hebrew":"גורם מגביל (אנזימים)","english":"Limiting Factor","definition":"הגורם המונע עלייה נוספת בקצב פעילות האנזים בנקודה נתונה."},{"letter":"ג","hebrew":"גורם מגביל (אקולוגיה)","english":"Limiting Factor","definition":"משאב או תנאי הקובע את קצב גידול האוכלוסייה ומשפיע עליה יותר מכל גורם אחר."},{"letter":"ג","hebrew":"גזי חממה","english":"Greenhouse Gases","definition":"גזים באטמוספרה הבולעים קרינה תת-אדומה ותורמים להתחממות, כמו פחמן דו-חמצני ומתאן."},{"letter":"ג","hebrew":"גזע המוח","english":"Brain Stem","definition":"אזור במוח המחבר בין מוח השדרה למוח הגולגולת, מבקר על תפקודים בלתי רצוניים כמו נשימה וקצב לב."},{"letter":"ג","hebrew":"גירוי","english":"Stimulus","definition":"שינוי בסביבה הנקלט על ידי קולטנים וגורם לתגובה ביצור החי."},{"letter":"ג","hebrew":"גלגול","english":"Metamorphosis","definition":"שינוי יסודי במבנה הגוף של בעלי חיים מסוימים במהלך התפתחותם, תחת בקרה הורמונלית."},{"letter":"ג","hebrew":"גלוקגון","english":"Glucagon","definition":"הורמון מתאי אלפא בלבלב המופרש כשרמת הסוכר נמוכה, מעודד פירוק גליקוגן ושומן."},{"letter":"ג","hebrew":"גלוקוז","english":"Glucose","definition":"חד-סוכר בעל שישה פחמנים, מקור האנרגיה העיקרי לתאים בתהליך הנשימה התאית."},{"letter":"ג","hebrew":"גליצרול","english":"Glycerol","definition":"שלד של שלושה פחמנים המהווה בסיס לפוספוליפידים ולטריגליצרידים."},{"letter":"ג","hebrew":"גליקוגן","english":"Glycogen","definition":"רב-סוכר מסועף הבנוי מגלוקוז, חומר תשמורת בבעלי חיים, נאגר בכבד ובשרירים."},{"letter":"ג","hebrew":"גליקוליזה","english":"Glycolysis","definition":"פירוק גלוקוז לשתי מולקולות פירובט בציטופלסמה, מניב 2 ATP נטו ללא צורך בחמצן."},{"letter":"ג","hebrew":"גמטה","english":"Gamete","definition":"תא רבייה הפלואידי (n) הנוצר במיוזה; ביצית בנקבות ותא זרע בזכרים."},{"letter":"ג","hebrew":"גן","english":"Gene","definition":"מקטע DNA המקודד למידע תורשתי, על פי רוב לחלבון; היחידה הבסיסית של התורשה."},{"letter":"ג","hebrew":"גן בורר","english":"Selective Gene","definition":"גן המוחדר עם מחדר ומאפשר לזהות ולברור תאים שקלטו את המחדר בהצלחה (לרוב עמידות לאנטיביוטיקה)."},{"letter":"ג","hebrew":"גן מבני","english":"Structural Gene","definition":"גן המקודד לחלבון או RNA המבצע תפקוד בתא, ואינו משתתף בבקרה על ביטוי גנים אחרים."},{"letter":"ג","hebrew":"גן מדווח","english":"Reporter Gene","definition":"גן המוכנס לתאים כדי לסמן ולמדוד באופן ויזואלי את ביטויו של גן מטרה."},{"letter":"ג","hebrew":"גן מווסת","english":"Regulator Gene","definition":"גן המקודד לחלבון מווסת השולט על ביטוי של גנים מבניים אחרים."},{"letter":"ג","hebrew":"גנוטיפ","english":"Genotype","definition":"הרכב האללים של פרט עבור גן או גנים מסוימים."},{"letter":"ג","hebrew":"גנום","english":"Genome","definition":"מכלול המידע התורשתי של אורגניזם, כולל אזורים מקודדים ולא מקודדים לחלבון."},{"letter":"ג","hebrew":"גנים של תחזוקה שוטפת","english":"Housekeeping Genes","definition":"גנים המתבטאים בכל התאים ומקודדים לחלבונים בסיסיים החיוניים לקיום התא."},{"letter":"ד","hebrew":"דאוקסי-ריבוז","english":"Deoxyribose","definition":"חד-סוכר בעל חמישה פחמנים המהווה חלק ממבנה הנוקלאוטיד ב-DNA, חסר אטום חמצן בפחמן 2'."},{"letter":"ד","hebrew":"דה-פלסמוליזה","english":"De-plasmolysis","definition":"החזרת תא צמח ממצב פלסמוליזה על ידי השרייה בתמיסה היפוטונית; המים חוזרים לחלולית."},{"letter":"ד","hebrew":"דו-סוכר","english":"Disaccharide","definition":"פחמימה המורכבת משני חד-סוכרים, כמו סוכרוז, לקטוז או מלטוז."},{"letter":"ד","hebrew":"דוגמה המרכזית","english":"Central Dogma","definition":"עיקרון יסוד בביולוגיה המתאר זרימת מידע מ-DNA ל-RNA לחלבון."},{"letter":"ד","hebrew":"דומיננטיות חלקית","english":"Incomplete Dominance","definition":"דרך הורשה בה הפנוטיפ של הטרוזיגוט הוא ביניים בין שני האללים."},{"letter":"ד","hebrew":"דומיננטיות שלמה","english":"Complete Dominance","definition":"דרך הורשה בה האלל הדומיננטי ממסך לחלוטין את האלל הרצסיבי בהטרוזיגוט."},{"letter":"ד","hebrew":"דופן תא","english":"Cell Wall","definition":"מעטפת קשיחה סביב קרום התא, מצויה בצמחים (צלולוז), פטריות (כיטין) וחיידקים (פפטידוגליקן)."},{"letter":"ד","hebrew":"דחיית שתל","english":"Transplant Rejection","definition":"תגובה חיסונית שבה הגוף תוקף איבר מושתל שזוהה כ\"לא עצמי\"."},{"letter":"ד","hebrew":"דיאליזה","english":"Dialysis","definition":"שיטה מלאכותית לסינון הדם מפסולת ומים עודפים, מחליפה את תפקוד הכליה הפגועה."},{"letter":"ד","hebrew":"דיות","english":"Transpiration","definition":"התאדות מים מהצמח, בעיקר דרך הפיוניות בעלים."},{"letter":"ד","hebrew":"דיפוזיה","english":"Diffusion","definition":"מעבר פסיבי של חומרים מריכוז גבוה לריכוז נמוך, ללא השקעת אנרגיה."},{"letter":"ד","hebrew":"דכאן","english":"Repressor","definition":"חלבון מווסת הנקשר לאתר המפעיל ומונע מהאנזים המשעתק לשעתק את הגן."},{"letter":"ד","hebrew":"דלקת","english":"Inflammation","definition":"תגובה מקומית של רקמה לנזק, מתאפיינת בחום, אדמומיות, נפיחות, מוגלה וכאב."},{"letter":"ד","hebrew":"דממת (המופיליה)","english":"Hemophilia","definition":"מחלה תורשתית הנובעת ממחסור בגורמי קרישה, גורמת לקושי בעצירת דימומים."},{"letter":"ד","hebrew":"דמעה","english":"Tear","definition":"נוזל המופרש מבלוטת הדמעות, מכיל אנזים ליזוזים הפוגע בחיידקים; חלק מקו ההגנה הראשון."},{"letter":"ד","hebrew":"דנא ליגאז","english":"DNA Ligase","definition":"אנזים המאחה שני קצוות של מולקולות DNA; משמש בהנדסה גנטית לחיבור מחדר לנשא."},{"letter":"ד","hebrew":"דנא משלים (cDNA)","english":"Complementary DNA","definition":"מולקולת DNA המסונתזת מתבנית של mRNA על ידי אנזים שעתוק הפוך, מכילה רק אקסונים."},{"letter":"ד","hebrew":"דנדריט","english":"Dendrite","definition":"שלוחה דקה ומסועפת מגוף תא העצב, קולטת אותות מתאי עצב שכנים או מקולטנים."},{"letter":"ד","hebrew":"דנטורציה","english":"Denaturation","definition":"שינוי במבנה המרחבי של חלבון הגורם לאובדן תפקוד, נגרם מטמפרטורה גבוהה או pH קיצוני."},{"letter":"ד","hebrew":"דשן","english":"Fertilizer","definition":"חומר להעשרת הקרקע במינרלים חיוניים לצמיחה, ממקור כימי או ביולוגי."},{"letter":"ה","hebrew":"הדברה","english":"Pest Control","definition":"השמדה או צמצום של אוכלוסיות מזיקים בחקלאות או בסביבת מגורים."},{"letter":"ה","hebrew":"הדברה ביולוגית","english":"Biological Pest Control","definition":"שליטה במזיקים באמצעים אקולוגיים, למשל באמצעות אויבים טבעיים."},{"letter":"ה","hebrew":"הדברה כימית","english":"Chemical Pest Control","definition":"שליטה במזיקים באמצעות חומרי הדברה כימיים, לעיתים בעלי השפעה שלילית על הסביבה."},{"letter":"ה","hebrew":"הולכה בקפיצות","english":"Saltatory Conduction","definition":"הולכה מהירה של אות עצבי לאורך אקסון מיאליני בין מרווחי ראנוויה."},{"letter":"ה","hebrew":"הומאוסטזיס","english":"Homeostasis","definition":"יכולת היצור החי לשמור על סביבה פנימית יציבה למרות שינויים בסביבה החיצונית."},{"letter":"ה","hebrew":"הומאותרמיים","english":"Homeotherms","definition":"בעלי חיים המווסתים את חום גופם פיזיולוגית ושומרים על טמפרטורה יציבה (יונקים ועופות)."},{"letter":"ה","hebrew":"הומוזיגוט","english":"Homozygote","definition":"פרט ששני האללים שלו לגן מסוים זהים (AA או aa)."},{"letter":"ה","hebrew":"הורמון","english":"Hormone","definition":"מולקולה המופרשת מבלוטה אנדוקרינית לדם, משמשת לתקשורת בין תאית ומשפיעה על תאי מטרה."},{"letter":"ה","hebrew":"הורמון ביוץ (LH)","english":"Luteinizing Hormone","definition":"הורמון מההיפופיזה המעורר ביוץ ויוצר את הגופיף הצהוב לאחר הביוץ."},{"letter":"ה","hebrew":"הורמון מגרה זקיק (FSH)","english":"Follicle Stimulating Hormone","definition":"הורמון מההיפופיזה המעורר התפתחות זקיקים בשחלה וייצור תאי זרע באשכים."},{"letter":"ה","hebrew":"הורמון נוגד השתנה (ADH)","english":"Antidiuretic Hormone","definition":"הורמון המווסת ספיגה חוזרת של מים בכליות, יוצר שתן מרוכז כשיש מחסור במים."},{"letter":"ה","hebrew":"הורמון βhCG","english":"Beta-hCG","definition":"הורמון משליה המופרש מתחילת ההיריון, שומר על פעילות הגופיף הצהוב והפרשת פרוגסטרון."},{"letter":"ה","hebrew":"הורמונים סטרואידיים","english":"Steroid Hormones","definition":"הורמונים מסיסי שומן הנגזרים מכולסטרול, חוצים את קרום התא ומווסתים ביטוי גנים."},{"letter":"ה","hebrew":"הורמונים פפטידיים","english":"Peptide Hormones","definition":"הורמונים מסיסי מים הנקשרים לקולטנים על קרום תאי המטרה."},{"letter":"ה","hebrew":"הטלה","english":"Oviparity","definition":"תהליך רבייה בו ביצים מופרות מוטלות מחוץ לגוף הנקבה ומתפתחות שם (עופות, זוחלים)."},{"letter":"ה","hebrew":"הטרוזיגוט","english":"Heterozygote","definition":"פרט ששני האללים שלו לגן מסוים שונים (Aa)."},{"letter":"ה","hebrew":"הטרוטרוף","english":"Heterotroph","definition":"יצור המשיג מזון על ידי אכילה של יצורים אחרים או חומרים אורגניים."},{"letter":"ה","hebrew":"היפוטונית, תמיסה","english":"Hypotonic Solution","definition":"תמיסה שריכוז המומסים בה נמוך מזה שבתא; מים נכנסים לתא ונפחו גדל."},{"letter":"ה","hebrew":"היפופיזה","english":"Pituitary Gland","definition":"בלוטת יותרת המוח, שולטת על בלוטות אנדוקריניות רבות בגוף."},{"letter":"ה","hebrew":"היפותלמוס","english":"Hypothalamus","definition":"אזור במוח המווסת תפקודים חיוניים כמו טמפרטורה, רעב, צמא וקצב לב, מקשר בין מערכת העצבים להורמונלית."},{"letter":"ה","hebrew":"היפרטונית, תמיסה","english":"Hypertonic Solution","definition":"תמיסה שריכוז המומסים בה גבוה מזה שבתא; מים יוצאים מהתא ונפחו קטן."},{"letter":"ה","hebrew":"הלופילים","english":"Halophiles","definition":"מיקרואורגניזמים המסוגלים לשרוד ולהתרבות בסביבות בעלות ריכוז מלחים גבוה."},{"letter":"ה","hebrew":"המוגלובין","english":"Hemoglobin","definition":"חלבון בתאי הדם האדומים הקושר ומוביל חמצן; מבנהו רבעוני ומכיל ברזל."},{"letter":"ה","hebrew":"המלטה","english":"Viviparity","definition":"תהליך רבייה בו הצעירים מתפתחים בתוך גוף האם ומקבלים הזנה דרך שליה (יונקים)."},{"letter":"ה","hebrew":"המרת אנרגיה","english":"Energy Conversion","definition":"הפיכת אנרגיה מסוג אחד לסוג אחר, למשל מאור לאנרגיה כימית בפוטוסינתזה."},{"letter":"ה","hebrew":"הסתגלות","english":"Acclimation","definition":"שינוי מבני או פיזיולוגי הפיך באורגניזם בודד בתגובה לשינוי בסביבה; אינו עובר בתורשה."},{"letter":"ה","hebrew":"העברה אופקית","english":"Horizontal Gene Transfer","definition":"מעבר חומר תורשתי בין חיידקים שאינם צאצא ישיר, מאפשר שונות גנטית."},{"letter":"ה","hebrew":"העברה פסיבית","english":"Passive Transport","definition":"מעבר חומרים דרך קרום התא במורד מפל הריכוזים, ללא השקעת אנרגיה."},{"letter":"ה","hebrew":"העברה פעילה","english":"Active Transport","definition":"מעבר חומרים כנגד מפל הריכוזים תוך השקעת אנרגיה (ATP) דרך משאבות."},{"letter":"ה","hebrew":"הפלואידי, תא","english":"Haploid Cell","definition":"תא המכיל עותק אחד של החומר התורשתי, מערכת אחת של כרומוזומים (n)."},{"letter":"ה","hebrew":"הפרדה בלתי תלויה","english":"Independent Assortment","definition":"הפרדה אקראית של כרומוזומים הומולוגיים למוטות התא במיוזה הראשונה."},{"letter":"ה","hebrew":"הפריה","english":"Fertilization","definition":"איחוד תא זרע ותא ביצה ליצירת זיגוטה דיפלואידית."},{"letter":"ה","hebrew":"הקוד הגנטי","english":"Genetic Code","definition":"אוסף של 64 קודונים המקודדים ל-20 חומצות אמינו; קודון אחד מקודד לחומצה אמינית אחת בלבד."},{"letter":"ה","hebrew":"השרצה","english":"Ovoviviparity","definition":"תהליך רבייה בו ביצים מופרות נשמרות בגוף הנקבה והצעירים בוקעים מתוכן (בזוחלים וכרישים)."},{"letter":"ה","hebrew":"התאמה","english":"Adaptation","definition":"תכונה גנטית עוברת בתורשה המגדילה את הסיכוי לשרוד ולהתרבות, נוצרת בברירה טבעית."},{"letter":"ה","hebrew":"התמיינות","english":"Differentiation","definition":"תהליך בו תאים רוכשים צורה ותפקוד ייחודיים בגוף, באמצעות השתקה וביטוי של גנים שונים."},{"letter":"ו","hebrew":"וויסות חום","english":"Thermoregulation","definition":"שמירה על טמפרטורת גוף יציבה באמצעות מנגנונים פיזיולוגיים והתנהגותיים."},{"letter":"ו","hebrew":"ויטמינים","english":"Vitamins","definition":"תרכובות אורגניות חיוניות בכמויות קטנות לתהליכים מטבוליים; רוב בעלי החיים מקבלים אותן ממזון."},{"letter":"ו","hebrew":"וסת","english":"Menstruation","definition":"נשירה מחזורית של רירית הרחם אצל נקבות יונקים מסוימים, כשלא התרחשה הפריה."},{"letter":"ו","hebrew":"וריד","english":"Vein","definition":"כלי דם מאסף המוביל דם מהתאים בחזרה ללב, בעל דופן דקה ולומן רחב יחסית."},{"letter":"ו","hebrew":"וריד הריאה","english":"Pulmonary Vein","definition":"כלי דם המוביל דם עשיר בחמצן מהריאות לעלייה השמאלית של הלב."},{"letter":"ו","hebrew":"וריד כלילי","english":"Coronary Vein","definition":"וריד המחזיר דם משרירי הלב לוורידים הנבובים."},{"letter":"ו","hebrew":"ורידון","english":"Venule","definition":"כלי דם קטן המאסף דם מהנימים אל הוורידים."},{"letter":"ו","hebrew":"ורידים חלולים","english":"Vena Cava","definition":"הוורידים הרחבים בגוף, מובילים דם עני בחמצן מהגוף לעלייה הימנית."},{"letter":"ו","hebrew":"ושט","english":"Esophagus","definition":"צינור המוביל מזון מהלוע לקיבה באמצעות תנועות פריסטלטיות; לא מתבצעים בו עיכול או ספיגה."},{"letter":"ז","hebrew":"זיגוטה","english":"Zygote","definition":"תא דיפלואידי הנוצר מאיחוד גמטה זכרית ונקבית, ממנו מתפתח העובר."},{"letter":"ז","hebrew":"זיכרון חיסוני","english":"Immunological Memory","definition":"יכולת מערכת החיסון להגיב מהר וחזק יותר לחשיפה חוזרת לאנטיגן, הודות לתאי זיכרון."},{"letter":"ז","hebrew":"זימים","english":"Gills","definition":"אברי נשימה של דגים ויצורים מימיים, מאפשרים חילוף גזים ישיר בין הדם למים."},{"letter":"ז","hebrew":"זן טהור","english":"True-breeding","definition":"קבוצת פרטים שצאצאיהם מהכלאות עצמיות בעלי אותו פנוטיפ לאורך דורות; הומוזיגוטים לתכונה."},{"letter":"ז","hebrew":"זקיק","english":"Follicle","definition":"שקיק בשחלה המכיל ביצית מתבשלת מוקפת בתאים מגינים; משחרר את הביצית בביוץ."},{"letter":"ח","hebrew":"חבר","english":"Community","definition":"קבוצת אוכלוסיות ממינים שונים החיות באותו בית גידול ומקיימות יחסי גומלין."},{"letter":"ח","hebrew":"חד-סוכר","english":"Monosaccharide","definition":"הצורה הפשוטה ביותר של פחמימה, אבן הבניין של דו-סוכרים ורב-סוכרים; כמו גלוקוז ופרוקטוז."},{"letter":"ח","hebrew":"חדר","english":"Ventricle","definition":"אחד מתאי הלב המוזרם ממנו דם בעוצמה לעורקים; באדם יש חדר ימני ושמאלי."},{"letter":"ח","hebrew":"חוליתנים","english":"Vertebrates","definition":"בעלי חיים בעלי עמוד שדרה: דגים, דו-חיים, זוחלים, עופות ויונקים."},{"letter":"ח","hebrew":"חומצה אמינית","english":"Amino Acid","definition":"אבן הבניין של חלבונים; קיימות 20 חומצות אמינו שונות בטבע, מכילות אטום חנקן."},{"letter":"ח","hebrew":"חומצה פחמתית","english":"Carbonic Acid","definition":"חומצה חלשה (H₂CO₃) הנוצרת בדם מפחמן דו-חמצני ומים, חשובה למאזן ה-pH."},{"letter":"ח","hebrew":"חומצה פירובית","english":"Pyruvic Acid","definition":"חומצה הנוצרת מפירוק גלוקוז בגליקוליזה; שתי מולקולות פירובט לכל מולקולת גלוקוז."},{"letter":"ח","hebrew":"חומצות גרעין","english":"Nucleic Acids","definition":"תרכובות אורגניות (DNA ו-RNA) המהוות את החומר התורשתי, בנויות מנוקלאוטידים."},{"letter":"ח","hebrew":"חומצות שומן","english":"Fatty Acids","definition":"מולקולות ליפידיות עם שרשרת פחמימנים וקבוצה קרבוקסילית; רוויות או לא רוויות."},{"letter":"ח","hebrew":"חומר אורגני","english":"Organic Compound","definition":"תרכובת המכילה פחמן ומימן, נוצרת על ידי יצורים חיים, כמו חלבונים, שומנים ופחמימות."},{"letter":"ח","hebrew":"חומר אנאורגני","english":"Inorganic Compound","definition":"תרכובת שאינה מכילה פחמן ומימן, כמו מים, פחמן דו-חמצני, מלחים ויונים."},{"letter":"ח","hebrew":"חומר אפור","english":"Gray Matter","definition":"רקמה במערכת העצבים המרכזית המורכבת מגופי תאי עצב, אחראית על עיבוד מידע."},{"letter":"ח","hebrew":"חומר לבן","english":"White Matter","definition":"רקמה במערכת העצבים המרכזית המורכבת מאקסונים עטופי מיאלין, להעברת מידע בין אזורים."},{"letter":"ח","hebrew":"חומר תורשתי","english":"Genetic Material","definition":"DNA או RNA הנושאים את המידע המקודד לתכונות העוברות בתורשה."},{"letter":"ח","hebrew":"חוסם דם מוח","english":"Blood-Brain Barrier","definition":"מערכת תאים סלקטיבית המגנה על המוח, חוסמת רעלים ומאפשרת מעבר חומרים חיוניים."},{"letter":"ח","hebrew":"חזרה אופקית","english":"Horizontal Transfer","definition":"ראה: העברה אופקית."},{"letter":"ח","hebrew":"חטיבה סימפתטית","english":"Sympathetic Division","definition":"חלק ממערכת העצבים האוטונומית המופעלת במצבי מאמץ, סכנה והתרגשות."},{"letter":"ח","hebrew":"חטיבה פרסימפתטית","english":"Parasympathetic Division","definition":"חלק ממערכת העצבים האוטונומית הפעילה במצבי מנוחה והרגעה."},{"letter":"ח","hebrew":"חיידקים","english":"Bacteria","definition":"אורגניזמים פרוקריוטים חד-תאיים חסרי גרעין ואברונים, בעלי תפוצה רחבה ביותר על כדור הארץ."},{"letter":"ח","hebrew":"חילוף גזים","english":"Gas Exchange","definition":"מעבר חמצן ופחמן דו-חמצני בין הדם לסביבה בדיפוזיה, על פי מפל הלחצים החלקיים."},{"letter":"ח","hebrew":"חילוף חומרים","english":"Metabolism","definition":"מכלול תהליכים בהם תאים קולטים, מעבדים ומפיקים אנרגיה מחומרים; מתווך על ידי אנזימים."},{"letter":"ח","hebrew":"חיסון טבעי","english":"Natural Vaccination","definition":"הגנה חיסונית המתקבלת באופן טבעי, דרך חשיפה לאנטיגן או מעבר נוגדנים מהאם."},{"letter":"ח","hebrew":"חיסון מלאכותי","english":"Synthetic Vaccination","definition":"החדרה מבוקרת של אנטיגנים או נוגדנים לעורר תגובה חיסונית."},{"letter":"ח","hebrew":"חיסון סביל","english":"Passive Vaccination","definition":"הזרקת נוגדנים מוכנים כשנשקפת סכנה מיידית, אינו יוצר זיכרון חיסוני."},{"letter":"ח","hebrew":"חיסון פעיל","english":"Active Vaccination","definition":"חשיפה מבוקרת לפתוגן מומת או מוחלש כדי לעורר יצירת תאי זיכרון."},{"letter":"ח","hebrew":"חלבון","english":"Protein","definition":"מולקולה אורגנית הבנויה מרצף של חומצות אמינו; מבנהו המרחבי קובע את תפקודו."},{"letter":"ח","hebrew":"חלבוני הכישור","english":"Spindle Fibers","definition":"סיבים חלבוניים המנתבים את תנועת הכרומוזומים אל קצוות התא במיטוזה ובמיוזה."},{"letter":"ח","hebrew":"חלבוני חוצי קרום","english":"Trans-Membrane Proteins","definition":"חלבונים המשובצים בקרום התא ומאפשרים מעבר חומרים: תעלות, נשאים ומשאבות."},{"letter":"ח","hebrew":"חלולית","english":"Vacuole","definition":"אברון בתאי צמח המכיל מים, מומסים וחומרי תשמורת; שומר על מאזן המים בתא."},{"letter":"ח","hebrew":"חלמון","english":"Yolk","definition":"חומרי תשמורת בביצה, מורכב בעיקר מחלבונים ושומנים, מזין את העובר המתפתח."},{"letter":"ח","hebrew":"חמצן (מולקולה)","english":"Oxygen","definition":"גז חיוני לנשימה אווירנית, נקלט בריאות ומובל על ידי תאי הדם האדומים."},{"letter":"ט","hebrew":"טסטוסטרון","english":"Testosterone","definition":"הורמון מין סטרואידי מהאשכים, מפתח איברי רבייה זכריים, יוצר תאי זרע וסימני מין משניים."},{"letter":"ט","hebrew":"טסיות דם","english":"Platelets","definition":"חלקיקי תאים קטנים בדם, משתתפים בקרישה ובעצירת דימומים."},{"letter":"ט","hebrew":"טפיל","english":"Parasite","definition":"אורגניזם הניזון על חשבון פונדקאי וגורם לו נזק."},{"letter":"ט","hebrew":"טפילות","english":"Parasitism","definition":"יחסי גומלין בהם אורגניזם אחד מנצל ומזיק לאחר."},{"letter":"ט","hebrew":"טריגליצרידים","english":"Triglycerides","definition":"מולקולות שומן הבנויות מגליצרול ושלוש חומצות שומן; חומר תשמורת אנרגטי עיקרי בגוף."},{"letter":"ט","hebrew":"טרכאות","english":"Tracheae","definition":"מערכת צינורות פנימיים בחרקים המאפשרת חילוף גזים דרך פתחים בגוף (ספירקולות)."},{"letter":"ט","hebrew":"טרנסדוקציה","english":"Transduction","definition":"העברה אופקית של DNA בין חיידקים באמצעות נגיף כווקטור."},{"letter":"ט","hebrew":"טרנספורמציה","english":"Transformation","definition":"קליטת DNA חיצוני על ידי חיידק והשתלבותו בגנום."},{"letter":"ט","hebrew":"טרשת עורקים","english":"Atherosclerosis","definition":"מחלה בה רבדים שומניים מצטברים בעורקים, גורמים להיצרות ולחסימה."},{"letter":"י","hebrew":"יחסי גומלין","english":"Biological Interaction","definition":"אינטראקציות בין מינים שונים בבית גידול, המשפיעות על תפוצתם ושפעם."},{"letter":"י","hebrew":"יצרנים","english":"Primary Producers","definition":"אורגניזמים אוטוטרופיים בבסיס שרשרת המזון, בעיקר צמחים ואצות המבצעים פוטוסינתזה."},{"letter":"כ","hebrew":"כבד","english":"Liver","definition":"איבר רב-תפקודי: נטרול רעלים, ייצור חלבוני דם, אגירת גליקוגן וייצור מלחי מרה."},{"letter":"כ","hebrew":"כושר נשיאה","english":"Carrying Capacity","definition":"המספר המקסימלי של פרטים ממין מסוים שסביבה יכולה לקיים לאורך זמן."},{"letter":"כ","hebrew":"כושר רביה","english":"Fitness","definition":"מדד ליכולת של פרט לשרוד ולהעמיד צאצאים פוריים בסביבתו."},{"letter":"כ","hebrew":"כימואוטוטרוף","english":"Chemoautotroph","definition":"חיידקים המייצרים חומר אורגני בלי אנרגיית אור, אלא מאנרגיה כימית של תרכובות אנאורגניות."},{"letter":"כ","hebrew":"כיס מרה","english":"Gallbladder","definition":"איבר אוגר נוזלי מרה הנוצרים בכבד, מפריש אותם לתריסריון בעת אכילה לעיכול שומנים."},{"letter":"כ","hebrew":"כלורופיל","english":"Chlorophyll","definition":"פיגמנט ירוק בכלורופלסט הקולט אנרגיית אור לפוטוסינתזה."},{"letter":"כ","hebrew":"כלורופלסט","english":"Chloroplast","definition":"אברון בצמחים בו מתבצעת הפוטוסינתזה, מכיל כלורופיל ואנזימים."},{"letter":"כ","hebrew":"כלי דם","english":"Blood Vessels","definition":"צינורות דרכם זורם הדם: עורקים, ורידים ונימים."},{"letter":"כ","hebrew":"כליה","english":"Kidney","definition":"איבר זוגי המסנן את הדם ומווסת מים, מומסים ולחץ דם; מכיל כמיליון נפרונים."},{"letter":"כ","hebrew":"כפיס המוח","english":"Corpus Callosum","definition":"אזור חומר לבן המקשר בין שתי המיספרות המוח, מאפשר להן לחלוק מידע ולתפקד בתיאום."},{"letter":"כ","hebrew":"כרומוזום","english":"Chromosome","definition":"מבנה דחוס של DNA כרוך סביב חלבוני היסטונים; נצפה לפני חלוקת התא."},{"letter":"כ","hebrew":"כרומוזומים הומולוגיים","english":"Homologous Chromosomes","definition":"זוג כרומוזומים בתאים דיפלואידיים בעלי אותם גנים, אחד מהאם ואחד מהאב."},{"letter":"כ","hebrew":"כרומטידות אחיות","english":"Sister Chromatids","definition":"שתי מולקולות DNA זהות המחוברות בצנטרומר, נוצרות בשכפול הכרומוזום."},{"letter":"כ","hebrew":"כרומטין","english":"Chromatin","definition":"הצורה הפרושה של ה-DNA בגרעין במהלך רוב מחזור התא, לפני התכוויצו לכרומוזום."},{"letter":"כ","hebrew":"כשל חיסוני","english":"Immunodeficiency","definition":"פגיעה בתפקוד מערכת החיסון; יכולה להיות מולדת או נרכשת."},{"letter":"ל","hebrew":"לב","english":"Heart","definition":"איבר שרירי הפועל כמשאבה ומזרים דם בגוף; בלב אדם ארבעה חללים."},{"letter":"ל","hebrew":"לבלב","english":"Pancreas","definition":"איבר המתפקד כבלוטה אקסוקרינית (אנזימי עיכול) וגם אנדוקרינית (אינסולין, גלוקגון)."},{"letter":"ל","hebrew":"לחץ אוויר","english":"Air Pressure","definition":"הלחץ שמפעיל האוויר על דפנות החלל בו הוא נמצא; שינוי בלחץ בית החזה גורם לנשימה."},{"letter":"ל","hebrew":"לחץ דם","english":"Blood Pressure","definition":"הלחץ שהדם מפעיל על דפנות העורקים; נמדד כסיסטולי על דיאסטולי."},{"letter":"ל","hebrew":"לחץ דם דיאסטולי","english":"Diastolic Pressure","definition":"לחץ הדם המופעל על דפנות העורקים בזמן הרפיית שרירי הלב."},{"letter":"ל","hebrew":"לחץ דם סיסטולי","english":"Systolic Pressure","definition":"לחץ הדם המופעל על דפנות העורקים בזמן התכווצות שרירי הלב."},{"letter":"ל","hebrew":"ליגנד","english":"Ligand","definition":"מולקולה הנקשרת לקולטן ספציפי, יוצרת אות תאי."},{"letter":"ל","hebrew":"ליזוזום","english":"Lysosome","definition":"אברון העיכול בתאים אנימליים, מכיל אנזימים פעילים ב-pH חומצי."},{"letter":"ל","hebrew":"לימפוציטים מסוג B","english":"B Lymphocytes","definition":"תאי דם לבנים המתמיינים לתאי פלזמה המייצרים נוגדנים, ולתאי זיכרון; מבשילים במח העצם."},{"letter":"ל","hebrew":"לימפוציטים מסוג T","english":"T Lymphocytes","definition":"תאי דם לבנים המבשילים בתימוס; כוללים תאי עוזר, הורגים ורגולטוריים."},{"letter":"ל","hebrew":"ליפידים","english":"Lipids","definition":"מולקולות הידרופוביות המשמשות כחומרי תשמורת, מבניים, הורמונים ומלחי מרה."},{"letter":"מ","hebrew":"מאפיינים של חיים","english":"Characteristics of Life","definition":"המאפיינים הבסיסיים של יצורים חיים: חילוף חומרים, גדילה, התרבות, תגובה לגירויים והומאוסטזיס."},{"letter":"מ","hebrew":"מארג מזון","english":"Food Web","definition":"רשת של שרשרות מזון מצטלבות במערכת אקולוגית."},{"letter":"מ","hebrew":"מבנה ראשוני","english":"Primary Structure","definition":"רצף חומצות האמינו בחלבון, קשורות בקשרים פפטידיים."},{"letter":"מ","hebrew":"מבנה רבעוני","english":"Quaternary Structure","definition":"מבנה של חלבון המורכב מכמה שרשראות פוליפפטידיות, כמו בהמוגלובין."},{"letter":"מ","hebrew":"מבנה שלישוני","english":"Tertiary Structure","definition":"המבנה המרחבי הכולל של החלבון; קובע את תפקודו."},{"letter":"מ","hebrew":"מבנה שניוני","english":"Secondary Structure","definition":"התקפלות מקומית של חלבון לצורות כמו סליל אלפא או משטח בטא, מקשרי מימן."},{"letter":"מ","hebrew":"מגוון ביולוגי","english":"Biodiversity","definition":"מכלול השונות בטבע: מגוון גנטי, מגוון מינים ומגוון מערכות אקולוגיות."},{"letter":"מ","hebrew":"מגוון מינים","english":"Species Diversity","definition":"מספר המינים השונים בבית גידול או בביוספרה."},{"letter":"מ","hebrew":"מגיבים","english":"Reactants","definition":"התרכובות שאיתן מתחילה ריאקציה כימית."},{"letter":"מ","hebrew":"מגן הכישור","english":"Kinetochore","definition":"מקבץ חלבונים בצנטרומר המקשר בין הכרומטידות לחלבוני הכישור במהלך החלוקה."},{"letter":"מ","hebrew":"מוגלה","english":"Pus","definition":"נוזל לבן-צהבהב המופיע בזיהומים, מכיל פתוגנים, תאי דם לבנים ושיירי תאים."},{"letter":"מ","hebrew":"מוח","english":"Brain","definition":"מרכז עצבי המורכב ממיליארדי נוירונים; מעבד מידע ושולח תגובות לכל הגוף."},{"letter":"מ","hebrew":"מוח גדול","english":"Cerebrum","definition":"אזור במוח האחראי על תפיסה חושית, זיכרון, מחשבות ופעילות מוטורית רצונית; מחולק לשתי המיספרות."},{"letter":"מ","hebrew":"מוח השדרה","english":"Spinal Cord","definition":"המשך מוח הגולגולת, חלק ממערכת העצבים המרכזית, מוליך אותות בין המוח לגוף ומעורב ברפלקסים."},{"letter":"מ","hebrew":"מוחון","english":"Cerebellum","definition":"אזור במוח האחראי על תיאום תנועות, שיווי משקל ויציבה."},{"letter":"מ","hebrew":"מוטציה","english":"Mutation","definition":"שינוי ברצף הנוקלאוטידים ב-DNA; מקור לשונות הגנטית באוכלוסייה."},{"letter":"מ","hebrew":"מוליך עצבי","english":"Neurotransmitter","definition":"מולקולה המופרשת בקצה האקסון אל הסינפסה, נקשרת לקולטנים בתא הסמוך ומעוררת או מדכאת אותו."},{"letter":"מ","hebrew":"מח עצם","english":"Bone Marrow","definition":"רקמה בחלק הספוגי של העצם בה נוצרים תאי דם אדומים, לבנים וטסיות מתאי גזע."},{"letter":"מ","hebrew":"מחבר הכישור","english":"Kinetochore","definition":"מקבץ חלבונים בצנטרומר המקשר בין הכרומטידות לחלבוני הכישור בחלוקה."},{"letter":"מ","hebrew":"מחדר","english":"Insert","definition":"מקטע DNA המוכנס לנשא (וקטור) בהנדסה גנטית."},{"letter":"מ","hebrew":"מחזור דם גדול","english":"Systemic Circulation","definition":"מסלול הדם מהלב השמאלי לכל הגוף ובחזרה לעלייה הימנית."},{"letter":"מ","hebrew":"מחזור דם כפול","english":"Double Circulation","definition":"מערכת הובלה בה הדם עובר שני מחזורים: גדול (לב-גוף-לב) וקטן (לב-ריאות-לב)."},{"letter":"מ","hebrew":"מחזור דם קטן","english":"Pulmonary Circulation","definition":"מסלול הדם מהלב הימני לריאות ובחזרה לעלייה השמאלית; בו מתבצע חילוף הגזים."},{"letter":"מ","hebrew":"מחזור הוסת","english":"Menstrual Cycle","definition":"מחזור הורמונלי חודשי באישה הכולל הבשלת ביצית, ביוץ והכנת הרחם להפריה אפשרית."},{"letter":"מ","hebrew":"מחזור התא","english":"Cell Cycle","definition":"רצף האירועים מהיווצרות תא ועד לחלוקתו לתאי בת; כולל אינטרפזה ושלב חלוקה."},{"letter":"מ","hebrew":"מחלות אוטו-אימוניות","english":"Autoimmune Diseases","definition":"מחלות בהן מערכת החיסון תוקפת רקמות עצמיות של הגוף, כמו טרשת נפוצה או צליאק."},{"letter":"מ","hebrew":"מטבוליזם","english":"Metabolism","definition":"מכלול התהליכים הכימיים בתא: בנייה, פירוק והפקת אנרגיה."},{"letter":"מ","hebrew":"מי קולחין","english":"Reclaimed Water","definition":"מים המסוננים מטוהרים מביוב, משמשים בעיקר להשקיה חקלאית."},{"l ish":"Gut","definition":"חלק מצינור העיכול מהקיבה ועד פי הטבעת, בו מתפרק המזון ונספגים תוצריו."},{"letter":"מ","hebrew":"מעי גס","english":"Large Intestine","definition":"החלק האחרון בצינור העיכול, סופג מים ומלחים, מהווה בית גידול לחיידקים מועילים."},{"letter":"מ","hebrew":"מעי דק","english":"Small Intestine","definition":"אזור עיקרי לפירוק וספיגה של חומרי הזנה בעיכול; מתחיל בתריסריון."},{"letter":"מ","hebrew":"מערכת","english":"Organ System","definition":"קבוצת איברים העובדים יחד לביצוע תפקודים מסוימים בגוף."},{"letter":"מ","hebrew":"מערכת אנדוקרינית","english":"Endocrine System","definition":"מערכת בלוטות המייצרת ומפרישה הורמונים השולטים על תהליכים פיזיולוגיים בגוף."},{"letter":"מ","hebrew":"מערכת אקולוגית","english":"Ecosystem","definition":"מערכת הכוללת את כלל הגורמים הביוטיים והאביוטיים באזור מסוים ויחסי הגומלין ביניהם."},{"letter":"מ","hebrew":"מערכת דם סגורה","english":"Closed Circulatory System","definition":"מערכת בה הדם זורם רק בכלי דם ובלב, נפוצה בחולייתנים."},{"letter":"מ","hebrew":"מערכת דם פתוחה","english":"Open Circulatory System","definition":"מערכת בה הדם זורם בחלל הגוף וחודר לרקמות, נפוצה בחרקים ורכיכות."},{"letter":"מ","hebrew":"מערכת ההובלה","english":"Cardiovascular System","definition":"מערכת הכוללת לב, כלי דם ודם, מובילה חומרים לתאים ומהם."},{"letter":"מ","hebrew":"מערכת ההפרשה","english":"Urinary System","definition":"מערכת הכוללת כליות, שופכנים, שלפוחית ושופכה; מסננת את הדם ומסלקת פסולת."},{"letter":"מ","hebrew":"מערכת החיסון","english":"Immune System","definition":"מערכת המגינה על הגוף מפני גורמים זרים, מורכבת מתאי דם לבנים, בלוטות לימפה ונוגדנים."},{"letter":"מ","hebrew":"מערכת הלימפה","english":"Lymphatic System","definition":"רשת צינורות ובלוטות לימפה הפרוסה בגוף, מסייעת בתגובה החיסונית ובהובלת נוזלים."},{"letter":"מ","hebrew":"מערכת הנשימה","english":"Respiratory System","definition":"מערכת הכוללת קנה נשימה, סמפונות וריאות; מאפשרת חילוף גזים בין הדם לסביבה."},{"letter":"מ","hebrew":"מערכת העיכול","english":"Digestive System","definition":"מערכת הכוללת צינור עיכול ובלוטות עזר; מפרקת מזון וסופגת חומרי הזנה."},{"letter":"מ","hebrew":"מערכת העצבים","english":"Nervous System","definition":"מערכת המורכבת מנוירונים, קולטת ומעבדת מידע ומשגרת תגובות."},{"letter":"מ","hebrew":"מערכת העצבים ההיקפית","english":"Peripheral Nervous System","definition":"עצבים מחוץ למוח ולחוט השדרה, מקשרים בין המערכת המרכזית לבין שאר הגוף."},{"letter":"מ","hebrew":"מערכת העצבים המרכזית","english":"Central Nervous System","definition":"מוח הגולגולת ומוח השדרה; מעבדים מידע ושולחים תגובות."},{"letter":"מ","hebrew":"מערכת הרבייה","english":"Reproductive System","definition":"מערכת איברים המייצרים גמטות ומאפשרים הפריה והעמדת צאצאים."},{"letter":"מ","hebrew":"מפל ריכוזים","english":"Concentration Gradient","definition":"הבדל בריכוז מומסים בין שני אזורים; ככל שגבוה, קצב הדיפוזיה מהיר יותר."},{"letter":"מ","hebrew":"מפרקים","english":"Decomposers","definition":"אורגניזמים (חיידקים ופטריות) המפרקים חומר אורגני מת ומחזירים אותו לאנאורגני."},{"letter":"מ","hebrew":"מקור השכפול","english":"Origin of Replication","definition":"רצף ב-DNA בו מתחיל תהליך השכפול; פלסמיד מכיל אחד וכרומוזום מכיל כמה."},{"letter":"מ","hebrew":"מרכז הלב וכלי הדם","english":"Cardiovascular Center","definition":"אזור במוח המוארך המווסת את קצב הלב לפי ריכוז פחמן דו-חמצני בדם."},{"letter":"מ","hebrew":"מרכז הנשימה","english":"Respiratory Center","definition":"אזור במוח המוארך השולט על קצב הנשימה לפי שינויים בריכוז CO₂ וב-pH הדם."},{"letter":"מ","hebrew":"משאבות","english":"Pumps","definition":"חלבוני קרום המעבירים חומרים כנגד מפל הריכוזים תוך השקעת אנרגיה (ATP)."},{"letter":"מ","hebrew":"משאבים","english":"Resources","definition":"מזון, מים, אזורי מחיה וחומרים החיוניים להישרדות והתרבות; יכולים להוות גורם מגביל."},{"letter":"מ","hebrew":"משוב חיובי","english":"Positive Feedback","definition":"מנגנון בקרה המגביר את התגובה ההתחלתית, כמו בלידה או בקרישת דם."},{"letter":"מ","hebrew":"משוב שלילי","english":"Negative Feedback","definition":"מנגנון בקרה המעכב את התגובה כדי לשמור על איזון, נפוץ בהומאוסטזיס."},{"letter":"מ","hebrew":"משרן","english":"Inducer","definition":"מולקולה המסירה את הדכאן מהאתר המפעיל ומאפשרת שעתוק של גן."},{"letter":"נ","hebrew":"נאדיות","english":"Alveoli","definition":"שקיקים זעירים בריאות בעלי דופן דק, בהם מתבצע חילוף הגזים עם הדם."},{"letter":"נ","hebrew":"נגיף","english":"Virus","definition":"גורם מדבק תת-מיקרוסקופי התלוי בתא מארח להתרבות, מורכב מחומר תורשתי ומעטפת חלבונית."},{"letter":"נ","hebrew":"נוגדן","english":"Antibody","definition":"חלבון בצורת Y הנוצר בלימפוציטים מסוג B, נקשר ספציפית לאנטיגן ומסייע לחיסולו."},{"letter":"נ","hebrew":"נוירוטרנסמיטר","english":"Neurotransmitter","definition":"ראה: מוליך עצבי."},{"letter":"נ","hebrew":"נוירון","english":"Neuron","definition":"תא העצב, יחידת היסוד של מערכת העצבים; מקבל, מעבד ומעביר אותות עצביים."},{"letter":"נ","hebrew":"נוירון ביניים","english":"Interneuron","definition":"נוירון במערכת העצבים המרכזית המקשר בין נוירון תחושתי לנוירון מוטורי."},{"letter":"נ","hebrew":"נוירון חישה","english":"Sensory Neuron","definition":"נוירון הקולט גירויים מהסביבה ומעביר את המידע למערכת העצבים המרכזית."},{"letter":"נ","hebrew":"נוירון מוטורי","english":"Motor Neuron","definition":"נוירון השולח את התגובה מהמערכת המרכזית לתאי שריר או בלוטה."},{"letter":"נ","hebrew":"נוקלאואיד","english":"Nucleoid","definition":"אזור בתא חיידק בו נמצא החומר התורשתי; אינו מוקף בקרום."},{"letter":"נ","hebrew":"נוקלאוטיד","english":"Nucleotide","definition":"אבן הבניין של חומצות גרעין; מורכב מסוכר, קבוצת זרחה ובסיס חנקני."},{"letter":"נ","hebrew":"נימים","english":"Capillaries","definition":"כלי הדם הצרים ביותר, פרוסים ברקמות ומאפשרים מעבר חומרים בין הדם לתאים."},{"letter":"נ","hebrew":"ניצול אנרגיה","english":"Energy Use","definition":"שימוש באנרגיה כימית (ATP) לקיום תהליכים תאיים."},{"letter":"נ","hebrew":"נפח פעימה","english":"Stroke Volume","definition":"נפח הדם המוזרם מחדר הלב בכל פעימה."},{"letter":"נ","hebrew":"נפרון","english":"Nephron","definition":"יחידת הסינון בכליה; מכיל קופסית באומן, פקעית ואבובית מפותלת ליצירת שתן."},{"letter":"נ","hebrew":"נקודת רוויה","english":"Saturation Point","definition":"הנקודה בה כל האנזימים רוויים בסובסטרט והוספת עוד אינה מעלה את קצב התגובה."},{"letter":"נ","hebrew":"נרתיק","english":"Vagina","definition":"תעלה במערכת הרבייה הנקבית; קולטת תאי זרע, מהווה תעלת לידה ומאפשרת יציאת נוזלי הוסת."},{"letter":"נ","hebrew":"נשאים","english":"Carriers","definition":"חלבוני קרום הנקשרים לחומרים ספציפיים ומשנים מבנה כדי להעבירם, במורד מפל הריכוזים."},{"letter":"נ","hebrew":"נשימה אווירנית","english":"Aerobic Respiration","definition":"נשימה תאית בנוכחות חמצן, מפיקה כ-30-32 ATP מכל מולקולת גלוקוז."},{"letter":"נ","hebrew":"נשימה תאית","english":"Cellular Respiration","definition":"מסלול מטבולי בו מופקת אנרגיה כימית (ATP) מפירוק גלוקוז בנוכחות חמצן."},{"letter":"נ","hebrew":"נשיפה","english":"Exhalation","definition":"יציאת אוויר מהריאות עקב התרפות הסרעפת והשרירים הבין-צלעיים."},{"letter":"ס","hebrew":"סובסטרט (מצע)","english":"Substrate","definition":"מולקולה הנקשרת לאתר הפעיל של האנזים ועליה מתבצעת הקטליזה."},{"letter":"ס","hebrew":"סוכר","english":"Sugar","definition":"מולקולה אורגנית מפחמן, מימן וחמצן; משמשת לאחסון והפקת אנרגיה בתאים."},{"letter":"ס","hebrew":"סוכרים","english":"Sugars","definition":"ראה: סוכר."},{"letter":"ס","hebrew":"סימביוזה","english":"Symbiosis","definition":"יחסי גומלין בין מינים שונים, מהם שני הצדדים מפיקים תועלת."},{"letter":"ס","hebrew":"סינפסה","english":"Synapse","definition":"מרווח בין קצה האקסון של תא עצב אחד לתא הבא; דרכו עוברים מוליכים עצביים."},{"letter":"ס","hebrew":"סיסטולה","english":"Systole","definition":"שלב התכווצות שרירי הלב, בו הדם מוזרם לעורקים."},{"letter":"ס","hebrew":"סיסים","english":"Villi","definition":"בליטות דמויות אצבעות בדופן המעי הדק המגדילות את שטח הפנים לספיגה."},{"letter":"ס","hebrew":"ספיגה","english":"Absorption","definition":"מעבר חומרים מצינור העיכול לזרם הדם או הלימפה דרך דופן המעי."},{"letter":"ס","hebrew":"סרעפת","english":"Diaphragm","definition":"שריר שטוח המפריד בין חלל בית החזה לחלל הבטן, התכווצותו מאפשרת שאיפה."},{"letter":"ע","hebrew":"עובר","english":"Embryo","definition":"צבר תאים מתפתחים מהזיגוטה בתחילת ההיריון, עובר חלוקות מיטוטיות והתמיינות."},{"letter":"ע","hebrew":"עורק","english":"Artery","definition":"כלי דם רחב בעל דופן עבה וגמיש, מוביל דם מהלב לרקמות."},{"letter":"ע","hebrew":"עורק הריאה","english":"Pulmonary Artery","definition":"עורק המוביל דם עני בחמצן מהחדר הימני לריאות."},{"letter":"ע","hebrew":"עורק כלילי","english":"Coronary Artery","definition":"עורק היוצא מאבי העורקים ומספק דם עשיר בחמצן לשרירי הלב עצמם."},{"letter":"ע","hebrew":"עורקיק","english":"Arteriole","definition":"כלי דם צר בין עורק לנים, כיווצו או הרפייתו מווסתים זרימת דם לאיברים."},{"letter":"ע","hebrew":"עיכוב לא תחרותי","english":"Non-competitive Inhibition","definition":"עיכוב אנזים על ידי מולקולה הנקשרת לאתר אלוסטרי, משנה את מבנה האתר הפעיל."},{"letter":"ע","hebrew":"עיכוב תחרותי","english":"Competitive Inhibition","definition":"מולקולה דומה לסובסטרט נקשרת לאתר הפעיל ומתחרה איתו על האנזים."},{"letter":"ע","hebrew":"עליה","english":"Atrium","definition":"אחד מחללי הלב המקבל דם מוורידים ראשיים ומעבירו לחדרים."},{"letter":"ע","hebrew":"עמידות לאנטיביוטיקה","english":"Antibiotic Resistance","definition":"יכולת חיידקים לשגשג בנוכחות אנטיביוטיקה, לרוב מקודדת בפלסמיד."},{"letter":"פ","hebrew":"פגוציט","english":"Phagocyte","definition":"תא דם לבן הבולע ומפרק חיידקים, תאים מתים ושיירים בתהליך פגוציטוזה."},{"letter":"פ","hebrew":"פגוציטוזה","english":"Phagocytosis","definition":"בליעת חלקיקים גדולים על ידי תא, באמצעות יצירת שלוחות ציטופלסמטיות."},{"letter":"פ","hebrew":"פוטוסינתזה","english":"Photosynthesis","definition":"תהליך בו אנרגיית אור מומרת לאנרגיה כימית, יוצר גלוקוז וחמצן ממים ופחמן דו-חמצני."},{"letter":"פ","hebrew":"פויקילותרמיים","english":"Poikilotherms","definition":"בעלי חיים שטמפרטורת גופם משתנה עם הסביבה (זוחלים, דו-חיים, דגים, חסרי חוליות)."},{"letter":"פ","hebrew":"פולימר","english":"Polymer","definition":"מולקולה ארוכה הבנויה מיחידות חוזרות (מונומרים) הקשורות זו לזו."},{"letter":"פ","hebrew":"פולימראז","english":"Polymerase","definition":"משפחת אנזימים המסנתזים DNA או RNA על ידי הוספת נוקלאוטידים לפי תבנית."},{"letter":"פ","hebrew":"פוספוליפידים","english":"Phospholipids","definition":"מולקולות המרכיב היסודי של קרום התא, בעלות ראש מסיס במים וזנב הידרופובי."},{"letter":"פ","hebrew":"פחמן חד-חמצני","english":"Carbon Monoxide","definition":"גז רעיל הנקשר להמוגלובין בזיקה גבוהה פי 240 מחמצן, חסר ריח וצבע ולכן מסוכן."},{"letter":"פ","hebrew":"פיברין","english":"Fibrin","definition":"חלבון סיבי בלתי מסיס המהווה מרכיב מרכזי בקריש דם."},{"letter":"פ","hebrew":"פיברינוגן","english":"Fibrinogen","definition":"חלבון מסיס בדם ההופך לפיברין בתהליך קרישה לאחר פציעה."},{"letter":"פ","hebrew":"פיונית","english":"Stoma","definition":"פתח בעלי הצמח דרכו מתבצע חילוף גזים ודיות; מבוקר על ידי תאי שמירה."},{"letter":"פ","hebrew":"פין","english":"Penis","definition":"איבר מין זכרי המעביר תאי זרע אל גוף הנקבה בעת הזדווגות."},{"letter":"פ","hebrew":"פירמידה אקולוגית","english":"Ecological Pyramid","definition":"ייצוג חזותי של ביומסה או אנרגיה ברמות ההזנה השונות במערכת אקולוגית."},{"letter":"פ","hebrew":"פלזמיד","english":"Plasmid","definition":"מולקולת DNA מעגלית קצרה בחיידקים, נושאת לרוב גנים לעמידויות; משמשת בהנדסה גנטית."},{"letter":"פ","hebrew":"פלסמה","english":"Plasma","definition":"החלק הנוזלי של הדם, מכיל מים, חלבונים, מומסים ופסולת."},{"letter":"פ","hebrew":"פלסמוליזה","english":"Plasmolysis","definition":"תהליך בו תא צמח מאבד מים בתמיסה היפרטונית ונפח החלולית מצטמצם."},{"letter":"פ","hebrew":"פנוטיפ","english":"Phenotype","definition":"הביטוי החיצוני של התכונה בפרט, נקבע על ידי הגנוטיפ והסביבה."},{"letter":"פ","hebrew":"פעימת לב","english":"Heartbeat","definition":"מחזור שלם של התכווצות והרפיית הלב; באדם כ-0.8 שניות לפעימה."},{"letter":"פ","hebrew":"פפטידוגליקן","english":"Peptidoglycan","definition":"פולימר רב-סוכרים ופפטידים, מרכיב עיקרי בדופן התא של רוב החיידקים."},{"letter":"פ","hebrew":"פקעית","english":"Glomerulus","definition":"צבר נימי דם בתוך קופסית באומן בנפרון, בו מתחיל הסינון של הדם."},{"letter":"פ","hebrew":"פקעת","english":"Tuber","definition":"איבר אגירה תת-קרקעי בצמחים, אוגר חומרי תשמורת כמו עמילן."},{"letter":"פ","hebrew":"פרוגסטרון","english":"Progesterone","definition":"הורמון מהגופיף הצהוב ומהשליה, שומר על רירית הרחם ומאפשר את המשך ההיריון."},{"letter":"פ","hebrew":"פרולקטין","english":"Prolactin","definition":"הורמון מההיפופיזה המעודד ייצור חלב בבלוטות החלב לאחר לידה."},{"letter":"פ","hebrew":"פרוקריוטים","english":"Prokaryotes","definition":"יצורים חד-תאיים חסרי גרעין ואברונים, כמו חיידקים; קטנים מתאים אאוקריוטים."},{"letter":"פ","hebrew":"פתוגן","english":"Pathogen","definition":"גורם מחלה: חיידק, נגיף, פטריה או טפיל."},{"letter":"צ","hebrew":"ציטוזין (C)","english":"Cytosine","definition":"בסיס חנקני בנוקלאוטיד הנקשר בשלושה קשרי מימן עם גואנין."},{"letter":"צ","hebrew":"ציטופלזמה","english":"Cytoplasm","definition":"נוזל צמיג בתוך התא בו נמצאים האברונים ומתרחשים תהליכים מטבוליים רבים."},{"letter":"צ","hebrew":"צמח חד-שנתי","english":"Annual Plant","definition":"צמח המשלים את מחזור חייו בעונת צמיחה אחת ומת לאחר ייצור הזרעים."},{"letter":"צ","hebrew":"צמח רב-שנתי","english":"Perennial Plant","definition":"צמח שחייו נמשכים מספר שנים, בעל כמה מחזורי רבייה."},{"letter":"צ","hebrew":"צמחי CAM","english":"CAM Plants","definition":"צמחים בסביבות צחיחות הקולטים פחמן דו-חמצני בלילה ומשתמשים בו לפוטוסינתזה ביום."},{"letter":"צ","hebrew":"צנטרומר","english":"Centromere","definition":"אזור בכרומוזום המחבר בין שתי הכרומטידות האחיות, נקודת קישור לחלבוני הכישור."},{"letter":"צ","hebrew":"צרכן","english":"Consumer","definition":"אורגניזם הניזון מאורגניזמים אחרים; מסווג לראשוני, שניוני או שלישוני."},{"letter":"צ","hebrew":"צרכן ראשוני","english":"Primary Consumer","definition":"אורגניזם הניזון מיצרנים (צמחוני)."},{"letter":"צ","hebrew":"צרכן שלישוני","english":"Tertiary Consumer","definition":"אורגניזם הטורף צרכנים שניוניים."},{"letter":"צ","hebrew":"צרכן שניוני","english":"Secondary Consumer","definition":"אורגניזם הטורף צרכנים ראשוניים."},{"letter":"ק","hebrew":"קבוצת זרחה","english":"Phosphate Group","definition":"יון של זרחן וארבעה אטומי חמצן; חלק מהנוקלאוטיד ושלד הגדיל בחומצות הגרעין."},{"letter":"ק","hebrew":"קו-דומיננטיות","english":"Co-Dominance","definition":"דרך הורשה בה שני האללים מתבטאים במלואם בהטרוזיגוט, יוצרים שילוב מופעים שניהם."},{"letter":"ק","hebrew":"קודון","english":"Codon","definition":"רצף שלושה נוקלאוטידים ב-mRNA המקודד לחומצה אמינית אחת."},{"letter":"ק","hebrew":"קודון אתחול","english":"Start Codon","definition":"הרצף AUG מהווה תחילת התרגום ומקודד למתיונין."},{"letter":"ק","hebrew":"קודון סיום","english":"Stop Codon","definition":"אחד משלושה קודונים המסיימים את התרגום, אינם מקודדים לחומצה אמינית."},{"letter":"ק","hebrew":"קוטר תא","english":"Cell Diameter","definition":"מידת גודלו של התא, משתנה בין סוגי תאים שונים."},{"letter":"ק","hebrew":"קולטן","english":"Receptor","definition":"חלבון בקרום התא או בציטופלסמה שאליו נקשר ליגנד ספציפי, מתחיל מענה תאי."},{"letter":"ק","hebrew":"קולטן ייחודי","english":"Specific Receptor","definition":"קולטן בעל התאמה מרחבית למולקולה ייחודית, מבטיח ספציפיות בתגובה."},{"letter":"ק","hebrew":"קומנסליזם (סמוכנות)","english":"Commensalism","definition":"יחסי גומלין בהם מין אחד נהנה והשני לא מושפע."},{"letter":"ק","hebrew":"קוניוגציה","english":"Conjugation","definition":"העברה אופקית של DNA (לרוב פלסמיד) בין חיידקים במגע ישיר דרך גשר ציטופלסמטי."},{"letter":"ק","hebrew":"קופסית באומן","english":"Bowman's Capsule","definition":"מבנה גביעי בנפרון העוטף את הפקעית ובו נוצר התסנין הראשוני."},{"letter":"ק","hebrew":"קוצב לב משני","english":"Atrioventricular Node","definition":"מעביר את הדחף מקוצב הלב הראשי לחדרי הלב דרך סיבי פורקינייה."},{"letter":"ק","hebrew":"קוצב לב ראשי","english":"Sinoatrial Node","definition":"קבוצת תאים בעלייה הימנית המייצרת את הדחפים החשמליים לפעימת הלב."},{"letter":"ק","hebrew":"קיבה","english":"Stomach","definition":"שק שרירי בו מתחיל פירוק החלבונים על ידי האנזים פפסין ב-pH חומצי."},{"letter":"ק","hebrew":"קיבוע חנקן","english":"Nitrogen Fixation","definition":"תהליך בחיידקים המהפכים חנקן אטמוספרי לתרכובות אנאורגניות זמינות לצמחים."},{"letter":"ק","hebrew":"קיבוע פחמן","english":"Carbon Fixation","definition":"תהליך הפיכת פחמן דו-חמצני לחומר אורגני בפוטוסינתזה."},{"letter":"ק","hebrew":"קנה הנשימה","english":"Trachea","definition":"צינור עטוף בסחוס המוביל אוויר לסמפונות הריאה."},{"letter":"ק","hebrew":"קצב התגובה האנזימטית","english":"Reaction Rate","definition":"מספר המפגשים של האנזים עם הסובסטרט ליחידת זמן."},{"letter":"ק","hebrew":"קרום התא","english":"Plasma Membrane","definition":"שכבה כפולה של פוספוליפידים וחלבונים, בררנית בחדירותה לחומרים."},{"letter":"ק","hebrew":"קרישת דם","english":"Blood Clotting","definition":"תגובת שרשרת של חומרים מטסיות הדם ומהפלזמה לעצירת דימום בעת פציעה."},{"letter":"ק","hebrew":"קשר פפטידי","english":"Peptide Bond","definition":"קשר קוולנטי בין חומצות אמינו, מחבר את הקצה הקרבוקסילי של אחת לקצה האמיני של השנייה."},{"letter":"ק","hebrew":"קשת רפלקס","english":"Reflex Arc","definition":"המסלול העצבי של תגובת רפלקס: גירוי, נוירון חישה, מוח השדרה, נוירון מוטורי ותגובה."},{"letter":"ר","hebrew":"ראה","english":"Lung","definition":"איבר נשימה תוך-גופי, מכיל הסתעפויות סמפונות וקצותיהן נאדיות בהן מתבצע חילוף הגזים."},{"letter":"ר","hebrew":"ראשן","english":"Tadpole","definition":"השלב הראשון בהתפתחות דו-חיים, חי במים ומבנהו מותאם לחיים מימיים."},{"letter":"ר","hebrew":"רב-סוכר","english":"Polysaccharide","definition":"פולימר של חד-סוכרים, כמו עמילן וגליקוגן (חומרי תשמורת) או צלולוז (מבני)."},{"letter":"ר","hebrew":"רבייה אל-זוויגית","english":"Asexual Reproduction","definition":"רבייה הנוצרת מאורגניזם אחד, צאצאים זהים גנטית להורה."},{"letter":"ר","hebrew":"רבייה זוויגית","english":"Sexual Reproduction","definition":"רבייה הכוללת איחוד גמטות משני הורים, יוצרת שונות גנטית בצאצאים."},{"letter":"ר","hebrew":"רביית בתולים","english":"Parthenogenesis","definition":"רבייה אל-זוויגית בה צאצא מתפתח מביצית לא מופרית."},{"letter":"ר","hebrew":"רחם","english":"Uterus","definition":"איבר במערכת הרבייה הנקבית בו מתפתח העובר במהלך ההיריון."},{"letter":"ר","hebrew":"ריבוז","english":"Ribose","definition":"חד-סוכר בעל חמישה פחמנים, חלק ממבנה הנוקלאוטיד ב-RNA."},{"letter":"ר","hebrew":"ריבוזום","english":"Ribosome","definition":"מבנה משתי תת-יחידות של rRNA וחלבונים, מבצע את תרגום ה-mRNA לחלבון."},{"letter":"ר","hebrew":"רמת ארגון","english":"Biological Organization","definition":"ייצוג היררכי ממולקולה ועד ביוספרה של מורכבות מערכות ביולוגיות."},{"letter":"ר","hebrew":"רמת הזנה","english":"Trophic Level","definition":"מיקום של מין בשרשרת המזון, לפי מספר הצעדים מהיצרן."},{"letter":"ר","hebrew":"רנא מוביל (tRNA)","english":"Transfer RNA","definition":"מולקולת RNA המובילה חומצות אמינו לריבוזום בתהליך התרגום."},{"letter":"ר","hebrew":"רנא ריבוזומלי (rRNA)","english":"Ribosomal RNA","definition":"מולקולת RNA המהווה חלק מבני ותפקודי של הריבוזום."},{"letter":"ר","hebrew":"רנא שליח (mRNA)","english":"Messenger RNA","definition":"מולקולת RNA הנושאת את הקוד מהגן בגרעין לריבוזום, ממנה מיוצר חלבון."},{"letter":"ר","hebrew":"רפלקס","english":"Reflex","definition":"תגובה מהירה ובלתי רצונית של מערכת העצבים, מתבצעת לרוב דרך מוח השדרה."},{"letter":"ש","hebrew":"שאיפה","english":"Inhalation","definition":"כניסת אוויר לריאות עקב התכווצות הסרעפת והגדלת נפח בית החזה."},{"letter":"ש","hebrew":"שופכה","english":"Urethra","definition":"צינור שרירי המוביל שתן (ובזכרים גם זרע) משלפוחית השתן החוצה מהגוף."},{"letter":"ש","hebrew":"שופכן","english":"Ureter","definition":"צינור המוביל שתן מהכליה לשלפוחית השתן."},{"letter":"ש","hebrew":"שחבור","english":"Splicing","definition":"הסרת אינטרונים וחיבור אקסונים בתעתיק ראשוני ליצירת mRNA סופי."},{"letter":"ש","hebrew":"שחבור חליפי","english":"Alternative Splicing","definition":"חיבור שונה של אקסונים מאותו גן, יוצר חלבונים שונים מאותו רצף."},{"letter":"ש","hebrew":"שחלה","english":"Ovary","definition":"איבר רבייה נקבי המייצר ביציות ומפריש הורמו
