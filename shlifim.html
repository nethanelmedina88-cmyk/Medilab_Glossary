<script>
const GLOSSARY = [{"letter":"א","hebrew":"אאוקריוטים","english":"Eukaryote","definition":"אורגניזמים שתאיהם מכילים גרעין ואברונים תחומים בקרום. למשל בעלי חיים, צמחים, פטריות ופרוטיסטים."},{"letter":"א","hebrew":"אבולוציה","english":"Evolution","definition":"שינוי בתכונות תורשתיות באוכלוסייה לאורך דורות, כתוצאה מברירה טבעית של פרטים מותאמים יותר."},{"letter":"א","hebrew":"אבי העורקים","english":"Aorta","definition":"העורק הגדול ביותר בגוף, יוצא מהחדר השמאלי ומוביל דם עשיר בחמצן לכל הגוף (פרט לריאות)."},{"letter":"א","hebrew":"אברי רבייה","english":"Reproductive organs","definition":"האיברים המייצרים גמטות ומאפשרים הפריה והעמדת צאצאים: גונדות, צינורות ואיברי הזדווגות."},{"letter":"א","hebrew":"אדנין (A)","english":"Adenine","definition":"בסיס חנקני בנוקלאוטיד הנקשר בשני קשרי מימן עם תימין ב-DNA או עם אורציל ב-RNA."},{"letter":"א","hebrew":"אדרנלין","english":"Adrenaline","definition":"הורמון מבלוטת יותרת הכליה המופרש במצבי לחץ, מעלה דופק, לחץ דם ורמת גלוקוז בדם."},{"letter":"א","hebrew":"אוטוטרוף","english":"Autotroph","definition":"יצור המייצר בעצמו חומר אורגני מחומרים אנאורגניים, בעיקר דרך פוטוסינתזה (כמו צמחים ואצות)."},{"letter":"א","hebrew":"אוכלוסייה","english":"Population","definition":"קבוצת פרטים בני אותו מין החיים באותו אזור באותו זמן."},{"letter":"א","hebrew":"אוסמוזה","english":"Osmosis","definition":"מעבר פסיבי של מים דרך קרום חדיר למחצה, מריכוז מומסים נמוך לריכוז גבוה."},{"letter":"א","hebrew":"אופטימלית, טמפרטורה","english":"Optimum Temperature","definition":"הטמפרטורה בה קצב פעילות האנזים מגיע למקסימום, ללא פגיעה במבנה החלבון."},{"letter":"א","hebrew":"אופטימלית, רמת חומציות","english":"Optimum pH","definition":"רמת ה-pH בה קצב פעילות האנזים מגיע למקסימום; משתנה בין אנזימים שונים."},{"letter":"א","hebrew":"אופרון","english":"Operon","definition":"קבוצת גנים סמוכים בחיידק המשועתקים יחד תחת בקרה משותפת של פרומוטר ואופרטור."},{"letter":"א","hebrew":"אור","english":"Light","definition":"קרינה אלקטרומגנטית המהווה מקור אנרגיה לפוטוסינתזה ואות סביבתי המשפיע על תהליכים בצמחים ובבעלי חיים."},{"letter":"א","hebrew":"אורגניזם","english":"Organism","definition":"יצור חי הבנוי מתא אחד או יותר, מקיים חילוף חומרים ומסוגל להתרבות בכוחות עצמו."},{"letter":"א","hebrew":"אורגניזם מהונדס גנטית","english":"GMO","definition":"אורגניזם שהחומר הגנטי שלו שונה באופן מלאכותי בהנדסה גנטית כדי להקנות לו תכונות חדשות."},{"letter":"א","hebrew":"אורציל (U)","english":"Uracil","definition":"בסיס חנקני המופיע ב-RNA במקום תימין, נקשר לאדנין בשני קשרי מימן."},{"letter":"א","hebrew":"אזורים לא מקודדים לחלבון","english":"Non-coding regions","definition":"אזורים ב-DNA או ב-RNA שאינם מתורגמים לחלבון, כוללים אינטרונים ואזורים מווסתים."},{"letter":"א","hebrew":"אזורים מקודדים לחלבון (CDS)","english":"Coding Sequence","definition":"רצף הנוקלאוטידים המקודד לחלבון, מקודון ההתחלה ועד לקודון הסיום."},{"letter":"א","hebrew":"איזוטונית, תמיסה","english":"Isotonic Solution","definition":"תמיסה שריכוז המומסים בה שווה לזה שבתא; נפח התא נשמר קבוע."},{"letter":"א","hebrew":"אינטרון","english":"Intron","definition":"רצף נוקלאוטידים בגן ובתעתיק הראשוני, שאינו מקודד לחלבון ומוסר בתהליך השחבור."},{"letter":"א","hebrew":"אינסולין","english":"Insulin","definition":"הורמון מתאי ביטא בלבלב המופרש כשרמת הסוכר בדם עולה, ומעודד כניסת גלוקוז לתאים."},{"letter":"א","hebrew":"אלדוסטרון","english":"Aldosterone","definition":"הורמון סטרואידי מקליפת יותרת הכליה המווסת ספיגה חוזרת של נתרן ומים בכליות."},{"letter":"א","hebrew":"אלל","english":"Allele","definition":"אחת מצורות אפשריות של גן באוכלוסייה; ליצור דיפלואידי יש שני אללים לכל גן."},{"letter":"א","hebrew":"אלל דומיננטי","english":"Dominant Allele","definition":"אלל שלטני המתבטא הן בפרט הומוזיגוט והן בהטרוזיגוט; מסומן באות גדולה."},{"letter":"א","hebrew":"אלל רצסיבי","english":"Recessive Allele","definition":"אלל נסגני המתבטא רק בפרט הומוזיגוט; מסומן באות קטנה."},{"letter":"א","hebrew":"אלקטרופורזה","english":"Electrophoresis","definition":"שיטה להפרדת חלבונים או חומצות גרעין לפי גודל ומטען חשמלי באמצעות זרם חשמלי על גבי ג'ל."},{"letter":"א","hebrew":"אנדוציטוזה","english":"Endocytosis","definition":"קליטת חומרים אל תוך התא על ידי כליאתם בבועית הנוצרת מקיפול קרום התא, תוך השקעת אנרגיה."},{"letter":"א","hebrew":"אנדותל","english":"Endothelium","definition":"שכבת תאים דקה המרפדת את פנים הלב, כלי הדם וצינורות הלימפה."},{"letter":"א","hebrew":"אנזים","english":"Enzyme","definition":"חלבון המזרז תהליכים מטבוליים בתא; מבנהו המרחבי קובע את תפקודו ואת המצע אליו ייקשר."},{"letter":"א","hebrew":"אנזים משעתק","english":"RNA Polymerase","definition":"אנזים היוצר מולקולת RNA לאורך תבנית של DNA, מתחיל מאתר מקדם בגן."},{"letter":"א","hebrew":"אנזים שעתוק הפוך","english":"Reverse Transcriptase","definition":"אנזים נגיפי היוצר DNA מתבנית של RNA; משמש בהנדסה גנטית ליצירת cDNA."},{"letter":"א","hebrew":"אנזימי הגבלה","english":"Restriction Enzymes","definition":"אנזימים מחיידקים החותכים DNA ברצפים ספציפיים; משמשים להחדרת גנים בהנדסה גנטית."},{"letter":"א","hebrew":"אנטי-קודון","english":"Anti-Codon","definition":"רצף שלושה בסיסים ב-tRNA המשלים את הקודון ב-mRNA ומאפשר הובלת החומצה האמינית הנכונה."},{"letter":"א","hebrew":"אנטיביוטיקה","english":"Antibiotics","definition":"חומרים הפוגעים בתהליכים חיוניים בחיידקים; מקורם טבעי במיקרואורגניזמים או סינתטי במעבדה."},{"letter":"א","hebrew":"אנטיגן","english":"Antigen","definition":"\"תעודת זהות\" מולקולרית של גוף זר המעוררת תגובה חיסונית."},{"letter":"א","hebrew":"אנמיה","english":"Anemia","definition":"מצב של פגיעה ביכולת אספקת חמצן לתאים, בדרך כלל בשל מחסור בהמוגלובין או בתאי דם אדומים."},{"letter":"א","hebrew":"אנרגיה כימית","english":"Chemical Energy","definition":"אנרגיה פוטנציאלית האגורה בקשרים הכימיים של מולקולות, משתחררת בעת שבירת הקשרים."},{"letter":"א","hebrew":"אנרגיית אור","english":"Light Energy","definition":"אנרגיה במופע פוטונים, מקורה בשמש; נקלטת בכלורופיל ומומרת לאנרגיה כימית בפוטוסינתזה."},{"letter":"א","hebrew":"אסטרוגן","english":"Estrogen","definition":"הורמון מין סטרואידי מהשחלות, מבשיל את הביצית, מעבה את רירית הרחם ומפתח סימני מין משניים."},{"letter":"א","hebrew":"אקולוגיה","english":"Ecology","definition":"מדע החוקר את יחסי הגומלין בין אורגניזמים לבין סביבתם הטבעית ואת התפוצה שלהם."},{"letter":"א","hebrew":"אקסון","english":"Axon","definition":"שלוחה ארוכה היוצאת מגוף תא העצב, דרכה נשלח האות החשמלי לקצוות המסועפים בקצה."},{"letter":"א","hebrew":"אקסון (גנטיקה)","english":"Exon","definition":"רצף ב-DNA הנשאר ב-mRNA הסופי לאחר השחבור ויכול להיות מתורגם לחלבון."},{"letter":"א","hebrew":"אקסוציטוזה","english":"Exocytosis","definition":"פליטת חומרים מהתא החוצה על ידי התאחות בועית עם קרום התא."},{"letter":"א","hebrew":"אתנול","english":"Ethanol","definition":"תרכובת אורגנית הנוצרת כתוצר בתסיסה כוהלית של שמרים וחיידקים בתנאים אנאארוביים."},{"letter":"א","hebrew":"אתר אלוסטרי","english":"Allosteric Site","definition":"אתר באנזים השונה מהאתר הפעיל, אליו נקשר מעכב לא תחרותי המשנה את פעילות האנזים."},{"letter":"א","hebrew":"אתר מפעיל","english":"Operator","definition":"מקטע DNA סמוך לאתר המקדם באופרון, אליו נקשר חלבון מווסת השולט בקצב השעתוק."},{"letter":"א","hebrew":"אתר מקדם","english":"Promoter","definition":"מקטע DNA במעלה הגן האחראי על גיוס האנזים המשעתק ועל התחלת השעתוק."},{"letter":"א","hebrew":"אתר פעיל","english":"Active Site","definition":"אזור באנזים אליו נקשר המצע; בעל התאמה מרחבית ייחודית לסובסטרט."},{"letter":"ב","hebrew":"בדיקת שתן","english":"Urinalysis","definition":"בדיקה רפואית של הרכב השתן, משמשת לאבחון מחלות מטבוליות, זיהומים ובעיות אחרות."},{"letter":"ב","hebrew":"בועית מתכווצת","english":"Contractile Vacuole","definition":"אברון בחד-תאיים פרוטיסטים המסלק עודפי מים שחדרו בסביבה היפוטונית, תהליך אקטיבי."},{"letter":"ב","hebrew":"ביומסה","english":"Biomass","definition":"המסה הכוללת של היצורים החיים באזור מסוים, נמדדת לרוב כמשקל יבש ליחידת שטח."},{"letter":"ב","hebrew":"ביוספרה","english":"Biosphere","definition":"סך כל המערכות האקולוגיות בכדור הארץ שבהן מתקיימים חיים."},{"letter":"ב","hebrew":"בית גידול","english":"Habitat","definition":"המרחב הפיזי הטבעי בו חיים אורגניזמים, מאופיין בגורמים ביוטיים ואביוטיים."},{"letter":"ב","hebrew":"בלוטה","english":"Gland","definition":"תא או רקמה היוצרת ומפרישה חומרים כמו הורמונים, אנזימים, דמעה, זיעה או חלב."},{"letter":"ב","hebrew":"בלוטה אנדוקרינית","english":"Endocrine Gland","definition":"בלוטה המפרישה הורמונים ישירות לזרם הדם, ללא צינור מוצא."},{"letter":"ב","hebrew":"בלוטה אקסוקרינית","english":"Exocrine Gland","definition":"בלוטה המפרישה דרך צינור מוצא חומרים אל הסביבה החיצונית, כמו רוק, זיעה או אנזימי עיכול."},{"letter":"ב","hebrew":"בלוטת האצטרובל","english":"Pineal Gland","definition":"בלוטה במוח המייצרת מלטונין, המווסת את השעון הביולוגי ומחזורי שינה-ערות."},{"letter":"ב","hebrew":"בלוטת התימוס","english":"Thymus Gland","definition":"בלוטה במרכז בית החזה שבה מתפתחים ומבשילים לימפוציטים מסוג T; פעילה בעיקר בילדות."},{"letter":"ב","hebrew":"בלוטת התריס","english":"Thyroid Gland","definition":"בלוטה בבסיס הצוואר המייצרת T3 ו-T4, המווסתים את קצב חילוף החומרים והגדילה."},{"letter":"ב","hebrew":"בלוטת יותרת המוח","english":"Pituitary Gland","definition":"בלוטה במוח (היפופיזה) המפרישה הורמונים השולטים על בלוטות רבות אחרות בגוף."},{"letter":"ב","hebrew":"בסיס חנקני","english":"Nitrogenous Base","definition":"אחד ממרכיבי הנוקלאוטיד; ארבעה סוגים ב-DNA (A, T, C, G) ו-U במקום T ב-RNA."},{"letter":"ב","hebrew":"בקטריופאג'","english":"Bacteriophage","definition":"נגיף החודר ומתרבה בתוך תאי חיידקים."},{"letter":"ב","hebrew":"ברירה טבעית","english":"Natural Selection","definition":"מנגנון אבולוציוני שבו פרטים מותאמים שורדים ומעמידים יותר צאצאים, ובכך מעלים את שכיחות התכונות שלהם."},{"letter":"ב","hebrew":"ברירה מלאכותית","english":"Artificial Selection","definition":"תהליך מכוון בידי האדם לטיפוח זנים עם תכונות רצויות, על ידי שליטה ברבייה."},{"letter":"ב","hebrew":"בררנות הקרום","english":"Selective Permeability","definition":"תכונת קרום התא לאפשר מעבר חופשי רק לחלק מהחומרים, בהתאם לתכונותיהם."},{"letter":"ג","hebrew":"גדיל","english":"Strand","definition":"רצף ארוך של נוקלאוטידים המהווה צד אחד של מולקולת DNA או RNA."},{"letter":"ג","hebrew":"גדיל משלים","english":"Complementary Strand","definition":"גדיל DNA הנוצר על ידי זיווג בסיסים עם הגדיל המקורי (A-T, C-G) בתהליך השכפול."},{"letter":"ג","hebrew":"גואנין (G)","english":"Guanine","definition":"בסיס חנקני בנוקלאוטיד הנקשר בשלושה קשרי מימן עם ציטוזין."},{"letter":"ג","hebrew":"גונדה","english":"Gonad","definition":"בלוטת מין המייצרת גמטות והורמוני מין; אשכים בזכרים ושחלות בנקבות."},{"letter":"ג","hebrew":"גופיף צהוב","english":"Corpus Luteum","definition":"מבנה הנוצר מהזקיק לאחר הביוץ, מפריש פרוגסטרון לעיבוי רירית הרחם."},{"letter":"ג","hebrew":"גורם א-ביוטי","english":"Abiotic Factor","definition":"גורם דומם בסביבה המשפיע על אורגניזמים, כמו טמפרטורה, מים, אור או pH."},{"letter":"ג","hebrew":"גורם ביוטי","english":"Biotic Factor","definition":"אורגניזם או חלק ממנו בסביבה, המשפיע על שאר היצורים החיים בה."},{"letter":"ג","hebrew":"גורם מגביל (אנזימים)","english":"Limiting Factor","definition":"הגורם המונע עלייה נוספת בקצב פעילות האנזים בנקודה נתונה."},{"letter":"ג","hebrew":"גורם מגביל (אקולוגיה)","english":"Limiting Factor","definition":"משאב או תנאי הקובע את קצב גידול האוכלוסייה ומשפיע עליה יותר מכל גורם אחר."},{"letter":"ג","hebrew":"גזי חממה","english":"Greenhouse Gases","definition":"גזים באטמוספרה הבולעים קרינה תת-אדומה ותורמים להתחממות, כמו פחמן דו-חמצני ומתאן."},{"letter":"ג","hebrew":"גזע המוח","english":"Brain Stem","definition":"אזור במוח המחבר בין מוח השדרה למוח הגולגולת, מבקר על תפקודים בלתי רצוניים כמו נשימה וקצב לב."},{"letter":"ג","hebrew":"גירוי","english":"Stimulus","definition":"שינוי בסביבה הנקלט על ידי קולטנים וגורם לתגובה ביצור החי."},{"letter":"ג","hebrew":"גלגול","english":"Metamorphosis","definition":"שינוי יסודי במבנה הגוף של בעלי חיים מסוימים במהלך התפתחותם, תחת בקרה הורמונלית."},{"letter":"ג","hebrew":"גלוקגון","english":"Glucagon","definition":"הורמון מתאי אלפא בלבלב המופרש כשרמת הסוכר נמוכה, מעודד פירוק גליקוגן ושומן."},{"letter":"ג","hebrew":"גלוקוז","english":"Glucose","definition":"חד-סוכר בעל שישה פחמנים, מקור האנרגיה העיקרי לתאים בתהליך הנשימה התאית."},{"letter":"ג","hebrew":"גליצרול","english":"Glycerol","definition":"שלד של שלושה פחמנים המהווה בסיס לפוספוליפידים ולטריגליצרידים."},{"letter":"ג","hebrew":"גליקוגן","english":"Glycogen","definition":"רב-סוכר מסועף הבנוי מגלוקוז, חומר תשמורת בבעלי חיים, נאגר בכבד ובשרירים."},{"letter":"ג","hebrew":"גליקוליזה","english":"Glycolysis","definition":"פירוק גלוקוז לשתי מולקולות פירובט בציטופלסמה, מניב 2 ATP נטו ללא צורך בחמצן."},{"letter":"ג","hebrew":"גמטה","english":"Gamete","definition":"תא רבייה הפלואידי (n) הנוצר במיוזה; ביצית בנקבות ותא זרע בזכרים."},{"letter":"ג","hebrew":"גן","english":"Gene","definition":"מקטע DNA המקודד למידע תורשתי, על פי רוב לחלבון; היחידה הבסיסית של התורשה."},{"letter":"ג","hebrew":"גן בורר","english":"Selective Gene","definition":"גן המוחדר עם מחדר ומאפשר לזהות ולברור תאים שקלטו את המחדר בהצלחה (לרוב עמידות לאנטיביוטיקה)."},{"letter":"ג","hebrew":"גן מבני","english":"Structural Gene","definition":"גן המקודד לחלבון או RNA המבצע תפקוד בתא, ואינו משתתף בבקרה על ביטוי גנים אחרים."},{"letter":"ג","hebrew":"גן מדווח","english":"Reporter Gene","definition":"גן המוכנס לתאים כדי לסמן ולמדוד באופן ויזואלי את ביטויו של גן מטרה."},{"letter":"ג","hebrew":"גן מווסת","english":"Regulator Gene","definition":"גן המקודד לחלבון מווסת השולט על ביטוי של גנים מבניים אחרים."},{"letter":"ג","hebrew":"גנוטיפ","english":"Genotype","definition":"הרכב האללים של פרט עבור גן או גנים מסוימים."},{"letter":"ג","hebrew":"גנום","english":"Genome","definition":"מכלול המידע התורשתי של אורגניזם, כולל אזורים מקודדים ולא מקודדים לחלבון."},{"letter":"ג","hebrew":"גנים של תחזוקה שוטפת","english":"Housekeeping Genes","definition":"גנים המתבטאים בכל התאים ומקודדים לחלבונים בסיסיים החיוניים לקיום התא."},{"letter":"ד","hebrew":"דאוקסי-ריבוז","english":"Deoxyribose","definition":"חד-סוכר בעל חמישה פחמנים המהווה חלק ממבנה הנוקלאוטיד ב-DNA, חסר אטום חמצן בפחמן 2'."},{"letter":"ד","hebrew":"דה-פלסמוליזה","english":"De-plasmolysis","definition":"החזרת תא צמח ממצב פלסמוליזה על ידי השרייה בתמיסה היפוטונית; המים חוזרים לחלולית."},{"letter":"ד","hebrew":"דו-סוכר","english":"Disaccharide","definition":"פחמימה המורכבת משני חד-סוכרים, כמו סוכרוז, לקטוז או מלטוז."},{"letter":"ד","hebrew":"דוגמה המרכזית","english":"Central Dogma","definition":"עיקרון יסוד בביולוגיה המתאר זרימת מידע מ-DNA ל-RNA לחלבון."},{"letter":"ד","hebrew":"דומיננטיות חלקית","english":"Incomplete Dominance","definition":"דרך הורשה בה הפנוטיפ של הטרוזיגוט הוא ביניים בין שני האללים."},{"letter":"ד","hebrew":"דומיננטיות שלמה","english":"Complete Dominance","definition":"דרך הורשה בה האלל הדומיננטי ממסך לחלוטין את האלל הרצסיבי בהטרוזיגוט."},{"letter":"ד","hebrew":"דופן תא","english":"Cell Wall","definition":"מעטפת קשיחה סביב קרום התא, מצויה בצמחים (צלולוז), פטריות (כיטין) וחיידקים (פפטידוגליקן)."},{"letter":"ד","hebrew":"דחיית שתל","english":"Transplant Rejection","definition":"תגובה חיסונית שבה הגוף תוקף איבר מושתל שזוהה כ\"לא עצמי\"."},{"letter":"ד","hebrew":"דיאליזה","english":"Dialysis","definition":"שיטה מלאכותית לסינון הדם מפסולת ומים עודפים, מחליפה את תפקוד הכליה הפגועה."},{"letter":"ד","hebrew":"דיות","english":"Transpiration","definition":"התאדות מים מהצמח, בעיקר דרך הפיוניות בעלים."},{"letter":"ד","hebrew":"דיפוזיה","english":"Diffusion","definition":"מעבר פסיבי של חומרים מריכוז גבוה לריכוז נמוך, ללא השקעת אנרגיה."},{"letter":"ד","hebrew":"דכאן","english":"Repressor","definition":"חלבון מווסת הנקשר לאתר המפעיל ומונע מהאנזים המשעתק לשעתק את הגן."},{"letter":"ד","hebrew":"דלקת","english":"Inflammation","definition":"תגובה מקומית של רקמה לנזק, מתאפיינת בחום, אדמומיות, נפיחות, מוגלה וכאב."},{"letter":"ד","hebrew":"דממת (המופיליה)","english":"Hemophilia","definition":"מחלה תורשתית הנובעת ממחסור בגורמי קרישה, גורמת לקושי בעצירת דימומים."},{"letter":"ד","hebrew":"דמעה","english":"Tear","definition":"נוזל המופרש מבלוטת הדמעות, מכיל אנזים ליזוזים הפוגע בחיידקים; חלק מקו ההגנה הראשון."},{"letter":"ד","hebrew":"דנא ליגאז","english":"DNA Ligase","definition":"אנזים המאחה שני קצוות של מולקולות DNA; משמש בהנדסה גנטית לחיבור מחדר לנשא."},{"letter":"ד","hebrew":"דנא משלים (cDNA)","english":"Complementary DNA","definition":"מולקולת DNA המסונתזת מתבנית של mRNA על ידי אנזים שעתוק הפוך, מכילה רק אקסונים."},{"letter":"ד","hebrew":"דנדריט","english":"Dendrite","definition":"שלוחה דקה ומסועפת מגוף תא העצב, קולטת אותות מתאי עצב שכנים או מקולטנים."},{"letter":"ד","hebrew":"דנטורציה","english":"Denaturation","definition":"שינוי במבנה המרחבי של חלבון הגורם לאובדן תפקוד, נגרם מטמפרטורה גבוהה או pH קיצוני."},{"letter":"ד","hebrew":"דשן","english":"Fertilizer","definition":"חומר להעשרת הקרקע במינרלים חיוניים לצמיחה, ממקור כימי או ביולוגי."},{"letter":"ה","hebrew":"הדברה","english":"Pest Control","definition":"השמדה או צמצום של אוכלוסיות מזיקים בחקלאות או בסביבת מגורים."},{"letter":"ה","hebrew":"הדברה ביולוגית","english":"Biological Pest Control","definition":"שליטה במזיקים באמצעים אקולוגיים, למשל באמצעות אויבים טבעיים."},{"letter":"ה","hebrew":"הדברה כימית","english":"Chemical Pest Control","definition":"שליטה במזיקים באמצעות חומרי הדברה כימיים, לעיתים בעלי השפעה שלילית על הסביבה."},{"letter":"ה","hebrew":"הולכה בקפיצות","english":"Saltatory Conduction","definition":"הולכה מהירה של אות עצבי לאורך אקסון מיאליני בין מרווחי ראנוויה."},{"letter":"ה","hebrew":"הומאוסטזיס","english":"Homeostasis","definition":"יכולת היצור החי לשמור על סביבה פנימית יציבה למרות שינויים בסביבה החיצונית."},{"letter":"ה","hebrew":"הומאותרמיים","english":"Homeotherms","definition":"בעלי חיים המווסתים את חום גופם פיזיולוגית ושומרים על טמפרטורה יציבה (יונקים ועופות)."},{"letter":"ה","hebrew":"הומוזיגוט","english":"Homozygote","definition":"פרט ששני האללים שלו לגן מסוים זהים (AA או aa)."},{"letter":"ה","hebrew":"הורמון","english":"Hormone","definition":"מולקולה המופרשת מבלוטה אנדוקרינית לדם, משמשת לתקשורת בין תאית ומשפיעה על תאי מטרה."},{"letter":"ה","hebrew":"הורמון ביוץ (LH)","english":"Luteinizing Hormone","definition":"הורמון מההיפופיזה המעורר ביוץ ויוצר את הגופיף הצהוב לאחר הביוץ."},{"letter":"ה","hebrew":"הורמון מגרה זקיק (FSH)","english":"Follicle Stimulating Hormone","definition":"הורמון מההיפופיזה המעורר התפתחות זקיקים בשחלה וייצור תאי זרע באשכים."},{"letter":"ה","hebrew":"הורמון נוגד השתנה (ADH)","english":"Antidiuretic Hormone","definition":"הורמון המווסת ספיגה חוזרת של מים בכליות, יוצר שתן מרוכז כשיש מחסור במים."},{"letter":"ה","hebrew":"הורמון βhCG","english":"Beta-hCG","definition":"הורמון משליה המופרש מתחילת ההיריון, שומר על פעילות הגופיף הצהוב והפרשת פרוגסטרון."},{"letter":"ה","hebrew":"הורמונים סטרואידיים","english":"Steroid Hormones","definition":"הורמונים מסיסי שומן הנגזרים מכולסטרול, חוצים את קרום התא ומווסתים ביטוי גנים."},{"letter":"ה","hebrew":"הורמונים פפטידיים","english":"Peptide Hormones","definition":"הורמונים מסיסי מים הנקשרים לקולטנים על קרום תאי המטרה."},{"letter":"ה","hebrew":"הטלה","english":"Oviparity","definition":"תהליך רבייה בו ביצים מופרות מוטלות מחוץ לגוף הנקבה ומתפתחות שם (עופות, זוחלים)."},{"letter":"ה","hebrew":"הטרוזיגוט","english":"Heterozygote","definition":"פרט ששני האללים שלו לגן מסוים שונים (Aa)."},{"letter":"ה","hebrew":"הטרוטרוף","english":"Heterotroph","definition":"יצור המשיג מזון על ידי אכילה של יצורים אחרים או חומרים אורגניים."},{"letter":"ה","hebrew":"היפוטונית, תמיסה","english":"Hypotonic Solution","definition":"תמיסה שריכוז המומסים בה נמוך מזה שבתא; מים נכנסים לתא ונפחו גדל."},{"letter":"ה","hebrew":"היפופיזה","english":"Pituitary Gland","definition":"בלוטת יותרת המוח, שולטת על בלוטות אנדוקריניות רבות בגוף."},{"letter":"ה","hebrew":"היפותלמוס","english":"Hypothalamus","definition":"אזור במוח המווסת תפקודים חיוניים כמו טמפרטורה, רעב, צמא וקצב לב, מקשר בין מערכת העצבים להורמונלית."},{"letter":"ה","hebrew":"היפרטונית, תמיסה","english":"Hypertonic Solution","definition":"תמיסה שריכוז המומסים בה גבוה מזה שבתא; מים יוצאים מהתא ונפחו קטן."},{"letter":"ה","hebrew":"הלופילים","english":"Halophiles","definition":"מיקרואורגניזמים המסוגלים לשרוד ולהתרבות בסביבות בעלות ריכוז מלחים גבוה."},{"letter":"ה","hebrew":"המוגלובין","english":"Hemoglobin","definition":"חלבון בתאי הדם האדומים הקושר ומוביל חמצן; מבנהו רבעוני ומכיל ברזל."},{"letter":"ה","hebrew":"המלטה","english":"Viviparity","definition":"תהליך רבייה בו הצעירים מתפתחים בתוך גוף האם ומקבלים הזנה דרך שליה (יונקים)."},{"letter":"ה","hebrew":"המרת אנרגיה","english":"Energy Conversion","definition":"הפיכת אנרגיה מסוג אחד לסוג אחר, למשל מאור לאנרגיה כימית בפוטוסינתזה."},{"letter":"ה","hebrew":"הסתגלות","english":"Acclimation","definition":"שינוי מבני או פיזיולוגי הפיך באורגניזם בודד בתגובה לשינוי בסביבה; אינו עובר בתורשה."},{"letter":"ה","hebrew":"העברה אופקית","english":"Horizontal Gene Transfer","definition":"מעבר חומר תורשתי בין חיידקים שאינם צאצא ישיר, מאפשר שונות גנטית."},{"letter":"ה","hebrew":"העברה פסיבית","english":"Passive Transport","definition":"מעבר חומרים דרך קרום התא במורד מפל הריכוזים, ללא השקעת אנרגיה."},{"letter":"ה","hebrew":"העברה פעילה","english":"Active Transport","definition":"מעבר חומרים כנגד מפל הריכוזים תוך השקעת אנרגיה (ATP) דרך משאבות."},{"letter":"ה","hebrew":"הפלואידי, תא","english":"Haploid Cell","definition":"תא המכיל עותק אחד של החומר התורשתי, מערכת אחת של כרומוזומים (n)."},{"letter":"ה","hebrew":"הפרדה בלתי תלויה","english":"Independent Assortment","definition":"הפרדה אקראית של כרומוזומים הומולוגיים למוטות התא במיוזה הראשונה."},{"letter":"ה","hebrew":"הפריה","english":"Fertilization","definition":"איחוד תא זרע ותא ביצה ליצירת זיגוטה דיפלואידית."},{"letter":"ה","hebrew":"הקוד הגנטי","english":"Genetic Code","definition":"אוסף של 64 קודונים המקודדים ל-20 חומצות אמינו; קודון אחד מקודד לחומצה אמינית אחת בלבד."},{"letter":"ה","hebrew":"השרצה","english":"Ovoviviparity","definition":"תהליך רבייה בו ביצים מופרות נשמרות בגוף הנקבה והצעירים בוקעים מתוכן (בזוחלים וכרישים)."},{"letter":"ה","hebrew":"התאמה","english":"Adaptation","definition":"תכונה גנטית עוברת בתורשה המגדילה את הסיכוי לשרוד ולהתרבות, נוצרת בברירה טבעית."},{"letter":"ה","hebrew":"התמיינות","english":"Differentiation","definition":"תהליך בו תאים רוכשים צורה ותפקוד ייחודיים בגוף, באמצעות השתקה וביטוי של גנים שונים."},{"letter":"ו","hebrew":"וויסות חום","english":"Thermoregulation","definition":"שמירה על טמפרטורת גוף יציבה באמצעות מנגנונים פיזיולוגיים והתנהגותיים."},{"letter":"ו","hebrew":"ויטמינים","english":"Vitamins","definition":"תרכובות אורגניות חיוניות בכמויות קטנות לתהליכים מטבוליים; רוב בעלי החיים מקבלים אותן ממזון."},{"letter":"ו","hebrew":"וסת","english":"Menstruation","definition":"נשירה מחזורית של רירית הרחם אצל נקבות יונקים מסוימים, כשלא התרחשה הפריה."},{"letter":"ו","hebrew":"וריד","english":"Vein","definition":"כלי דם מאסף המוביל דם מהתאים בחזרה ללב, בעל דופן דקה ולומן רחב יחסית."},{"letter":"ו","hebrew":"וריד הריאה","english":"Pulmonary Vein","definition":"כלי דם המוביל דם עשיר בחמצן מהריאות לעלייה השמאלית של הלב."},{"letter":"ו","hebrew":"וריד כלילי","english":"Coronary Vein","definition":"וריד המחזיר דם משרירי הלב לוורידים הנבובים."},{"letter":"ו","hebrew":"ורידון","english":"Venule","definition":"כלי דם קטן המאסף דם מהנימים אל הוורידים."},{"letter":"ו","hebrew":"ורידים חלולים","english":"Vena Cava","definition":"הוורידים הרחבים בגוף, מובילים דם עני בחמצן מהגוף לעלייה הימנית."},{"letter":"ו","hebrew":"ושט","english":"Esophagus","definition":"צינור המוביל מזון מהלוע לקיבה באמצעות תנועות פריסטלטיות; לא מתבצעים בו עיכול או ספיגה."},{"letter":"ז","hebrew":"זיגוטה","english":"Zygote","definition":"תא דיפלואידי הנוצר מאיחוד גמטה זכרית ונקבית, ממנו מתפתח העובר."},{"letter":"ז","hebrew":"זיכרון חיסוני","english":"Immunological Memory","definition":"יכולת מערכת החיסון להגיב מהר וחזק יותר לחשיפה חוזרת לאנטיגן, הודות לתאי זיכרון."},{"letter":"ז","hebrew":"זימים","english":"Gills","definition":"אברי נשימה של דגים ויצורים מימיים, מאפשרים חילוף גזים ישיר בין הדם למים."},{"letter":"ז","hebrew":"זן טהור","english":"True-breeding","definition":"קבוצת פרטים שצאצאיהם מהכלאות עצמיות בעלי אותו פנוטיפ לאורך דורות; הומוזיגוטים לתכונה."},{"letter":"ז","hebrew":"זקיק","english":"Follicle","definition":"שקיק בשחלה המכיל ביצית מתבשלת מוקפת בתאים מגינים; משחרר את הביצית בביוץ."},{"letter":"ח","hebrew":"חבר","english":"Community","definition":"קבוצת אוכלוסיות ממינים שונים החיות באותו בית גידול ומקיימות יחסי גומלין."},{"letter":"ח","hebrew":"חד-סוכר","english":"Monosaccharide","definition":"הצורה הפשוטה ביותר של פחמימה, אבן הבניין של דו-סוכרים ורב-סוכרים; כמו גלוקוז ופרוקטוז."},{"letter":"ח","hebrew":"חדר","english":"Ventricle","definition":"אחד מתאי הלב המוזרם ממנו דם בעוצמה לעורקים; באדם יש חדר ימני ושמאלי."},{"letter":"ח","hebrew":"חוליתנים","english":"Vertebrates","definition":"בעלי חיים בעלי עמוד שדרה: דגים, דו-חיים, זוחלים, עופות ויונקים."},{"letter":"ח","hebrew":"חומצה אמינית","english":"Amino Acid","definition":"אבן הבניין של חלבונים; קיימות 20 חומצות אמינו שונות בטבע, מכילות אטום חנקן."},{"letter":"ח","hebrew":"חומצה פחמתית","english":"Carbonic Acid","definition":"חומצה חלשה (H₂CO₃) הנוצרת בדם מפחמן דו-חמצני ומים, חשובה למאזן ה-pH."},{"letter":"ח","hebrew":"חומצה פירובית","english":"Pyruvic Acid","definition":"חומצה הנוצרת מפירוק גלוקוז בגליקוליזה; שתי מולקולות פירובט לכל מולקולת גלוקוז."},{"letter":"ח","hebrew":"חומצות גרעין","english":"Nucleic Acids","definition":"תרכובות אורגניות (DNA ו-RNA) המהוות את החומר התורשתי, בנויות מנוקלאוטידים."},{"letter":"ח","hebrew":"חומצות שומן","english":"Fatty Acids","definition":"מולקולות ליפידיות עם שרשרת פחמימנים וקבוצה קרבוקסילית; רוויות או לא רוויות."},{"letter":"ח","hebrew":"חומר אורגני","english":"Organic Compound","definition":"תרכובת המכילה פחמן ומימן, נוצרת על ידי יצורים חיים, כמו חלבונים, שומנים ופחמימות."},{"letter":"ח","hebrew":"חומר אנאורגני","english":"Inorganic Compound","definition":"תרכובת שאינה מכילה פחמן ומימן, כמו מים, פחמן דו-חמצני, מלחים ויונים."},{"letter":"ח","hebrew":"חומר אפור","english":"Gray Matter","definition":"רקמה במערכת העצבים המרכזית המורכבת מגופי תאי עצב, אחראית על עיבוד מידע."},{"letter":"ח","hebrew":"חומר לבן","english":"White Matter","definition":"רקמה במערכת העצבים המרכזית המורכבת מאקסונים עטופי מיאלין, להעברת מידע בין אזורים."},{"letter":"ח","hebrew":"חומר תורשתי","english":"Genetic Material","definition":"DNA או RNA הנושאים את המידע המקודד לתכונות העוברות בתורשה."},{"letter":"ח","hebrew":"חוסם דם מוח","english":"Blood-Brain Barrier","definition":"מערכת תאים סלקטיבית המגנה על המוח, חוסמת רעלים ומאפשרת מעבר חומרים חיוניים."},{"letter":"ח","hebrew":"חזרה אופקית","english":"Horizontal Transfer","definition":"ראה: העברה אופקית."},{"letter":"ח","hebrew":"חטיבה סימפתטית","english":"Sympathetic Division","definition":"חלק ממערכת העצבים האוטונומית המופעלת במצבי מאמץ, סכנה והתרגשות."},{"letter":"ח","hebrew":"חטיבה פרסימפתטית","english":"Parasympathetic Division","definition":"חלק ממערכת העצבים האוטונומית הפעילה במצבי מנוחה והרגעה."},{"letter":"ח","hebrew":"חיידקים","english":"Bacteria","definition":"אורגניזמים פרוקריוטים חד-תאיים חסרי גרעין ואברונים, בעלי תפוצה רחבה ביותר על כדור הארץ."},{"letter":"ח","hebrew":"חילוף גזים","english":"Gas Exchange","definition":"מעבר חמצן ופחמן דו-חמצני בין הדם לסביבה בדיפוזיה, על פי מפל הלחצים החלקיים."},{"letter":"ח","hebrew":"חילוף חומרים","english":"Metabolism","definition":"מכלול תהליכים בהם תאים קולטים, מעבדים ומפיקים אנרגיה מחומרים; מתווך על ידי אנזימים."},{"letter":"ח","hebrew":"חיסון טבעי","english":"Natural Vaccination","definition":"הגנה חיסונית המתקבלת באופן טבעי, דרך חשיפה לאנטיגן או מעבר נוגדנים מהאם."},{"letter":"ח","hebrew":"חיסון מלאכותי","english":"Synthetic Vaccination","definition":"החדרה מבוקרת של אנטיגנים או נוגדנים לעורר תגובה חיסונית."},{"letter":"ח","hebrew":"חיסון סביל","english":"Passive Vaccination","definition":"הזרקת נוגדנים מוכנים כשנשקפת סכנה מיידית, אינו יוצר זיכרון חיסוני."},{"letter":"ח","hebrew":"חיסון פעיל","english":"Active Vaccination","definition":"חשיפה מבוקרת לפתוגן מומת או מוחלש כדי לעורר יצירת תאי זיכרון."},{"letter":"ח","hebrew":"חלבון","english":"Protein","definition":"מולקולה אורגנית הבנויה מרצף של חומצות אמינו; מבנהו המרחבי קובע את תפקודו."},{"letter":"ח","hebrew":"חלבוני הכישור","english":"Spindle Fibers","definition":"סיבים חלבוניים המנתבים את תנועת הכרומוזומים אל קצוות התא במיטוזה ובמיוזה."},{"letter":"ח","hebrew":"חלבוני חוצי קרום","english":"Trans-Membrane Proteins","definition":"חלבונים המשובצים בקרום התא ומאפשרים מעבר חומרים: תעלות, נשאים ומשאבות."},{"letter":"ח","hebrew":"חלולית","english":"Vacuole","definition":"אברון בתאי צמח המכיל מים, מומסים וחומרי תשמורת; שומר על מאזן המים בתא."},{"letter":"ח","hebrew":"חלמון","english":"Yolk","definition":"חומרי תשמורת בביצה, מורכב בעיקר מחלבונים ושומנים, מזין את העובר המתפתח."},{"letter":"ח","hebrew":"חמצן (מולקולה)","english":"Oxygen","definition":"גז חיוני לנשימה אווירנית, נקלט בריאות ומובל על ידי תאי הדם האדומים."},{"letter":"ט","hebrew":"טסטוסטרון","english":"Testosterone","definition":"הורמון מין סטרואידי מהאשכים, מפתח איברי רבייה זכריים, יוצר תאי זרע וסימני מין משניים."},{"letter":"ט","hebrew":"טסיות דם","english":"Platelets","definition":"חלקיקי תאים קטנים בדם, משתתפים בקרישה ובעצירת דימומים."},{"letter":"ט","hebrew":"טפיל","english":"Parasite","definition":"אורגניזם הניזון על חשבון פונדקאי וגורם לו נזק."},{"letter":"ט","hebrew":"טפילות","english":"Parasitism","definition":"יחסי גומלין בהם אורגניזם אחד מנצל ומזיק לאחר."},{"letter":"ט","hebrew":"טריגליצרידים","english":"Triglycerides","definition":"מולקולות שומן הבנויות מגליצרול ושלוש חומצות שומן; חומר תשמורת אנרגטי עיקרי בגוף."},{"letter":"ט","hebrew":"טרכאות","english":"Tracheae","definition":"מערכת צינורות פנימיים בחרקים המאפשרת חילוף גזים דרך פתחים בגוף (ספירקולות)."},{"letter":"ט","hebrew":"טרנסדוקציה","english":"Transduction","definition":"העברה אופקית של DNA בין חיידקים באמצעות נגיף כווקטור."},{"letter":"ט","hebrew":"טרנספורמציה","english":"Transformation","definition":"קליטת DNA חיצוני על ידי חיידק והשתלבותו בגנום."},{"letter":"ט","hebrew":"טרשת עורקים","english":"Atherosclerosis","definition":"מחלה בה רבדים שומניים מצטברים בעורקים, גורמים להיצרות ולחסימה."},{"letter":"י","hebrew":"יחסי גומלין","english":"Biological Interaction","definition":"אינטראקציות בין מינים שונים בבית גידול, המשפיעות על תפוצתם ושפעם."},{"letter":"י","hebrew":"יצרנים","english":"Primary Producers","definition":"אורגניזמים אוטוטרופיים בבסיס שרשרת המזון, בעיקר צמחים ואצות המבצעים פוטוסינתזה."},{"letter":"כ","hebrew":"כבד","english":"Liver","definition":"איבר רב-תפקודי: נטרול רעלים, ייצור חלבוני דם, אגירת גליקוגן וייצור מלחי מרה."},{"letter":"כ","hebrew":"כושר נשיאה","english":"Carrying Capacity","definition":"המספר המקסימלי של פרטים ממין מסוים שסביבה יכולה לקיים לאורך זמן."},{"letter":"כ","hebrew":"כושר רביה","english":"Fitness","definition":"מדד ליכולת של פרט לשרוד ולהעמיד צאצאים פוריים בסביבתו."},{"letter":"כ","hebrew":"כימואוטוטרוף","english":"Chemoautotroph","definition":"חיידקים המייצרים חומר אורגני בלי אנרגיית אור, אלא מאנרגיה כימית של תרכובות אנאורגניות."},{"letter":"כ","hebrew":"כיס מרה","english":"Gallbladder","definition":"איבר אוגר נוזלי מרה הנוצרים בכבד, מפריש אותם לתריסריון בעת אכילה לעיכול שומנים."},{"letter":"כ","hebrew":"כלורופיל","english":"Chlorophyll","definition":"פיגמנט ירוק בכלורופלסט הקולט אנרגיית אור לפוטוסינתזה."},{"letter":"כ","hebrew":"כלורופלסט","english":"Chloroplast","definition":"אברון בצמחים בו מתבצעת הפוטוסינתזה, מכיל כלורופיל ואנזימים."},{"letter":"כ","hebrew":"כלי דם","english":"Blood Vessels","definition":"צינורות דרכם זורם הדם: עורקים, ורידים ונימים."},{"letter":"כ","hebrew":"כליה","english":"Kidney","definition":"איבר זוגי המסנן את הדם ומווסת מים, מומסים ולחץ דם; מכיל כמיליון נפרונים."},{"letter":"כ","hebrew":"כפיס המוח","english":"Corpus Callosum","definition":"אזור חומר לבן המקשר בין שתי המיספרות המוח, מאפשר להן לחלוק מידע ולתפקד בתיאום."},{"letter":"כ","hebrew":"כרומוזום","english":"Chromosome","definition":"מבנה דחוס של DNA כרוך סביב חלבוני היסטונים; נצפה לפני חלוקת התא."},{"letter":"כ","hebrew":"כרומוזומים הומולוגיים","english":"Homologous Chromosomes","definition":"זוג כרומוזומים בתאים דיפלואידיים בעלי אותם גנים, אחד מהאם ואחד מהאב."},{"letter":"כ","hebrew":"כרומטידות אחיות","english":"Sister Chromatids","definition":"שתי מולקולות DNA זהות המחוברות בצנטרומר, נוצרות בשכפול הכרומוזום."},{"letter":"כ","hebrew":"כרומטין","english":"Chromatin","definition":"הצורה הפרושה של ה-DNA בגרעין במהלך רוב מחזור התא, לפני התכוויצו לכרומוזום."},{"letter":"כ","hebrew":"כשל חיסוני","english":"Immunodeficiency","definition":"פגיעה בתפקוד מערכת החיסון; יכולה להיות מולדת או נרכשת."},{"letter":"ל","hebrew":"לב","english":"Heart","definition":"איבר שרירי הפועל כמשאבה ומזרים דם בגוף; בלב אדם ארבעה חללים."},{"letter":"ל","hebrew":"לבלב","english":"Pancreas","definition":"איבר המתפקד כבלוטה אקסוקרינית (אנזימי עיכול) וגם אנדוקרינית (אינסולין, גלוקגון)."},{"letter":"ל","hebrew":"לחץ אוויר","english":"Air Pressure","definition":"הלחץ שמפעיל האוויר על דפנות החלל בו הוא נמצא; שינוי בלחץ בית החזה גורם לנשימה."},{"letter":"ל","hebrew":"לחץ דם","english":"Blood Pressure","definition":"הלחץ שהדם מפעיל על דפנות העורקים; נמדד כסיסטולי על דיאסטולי."},{"letter":"ל","hebrew":"לחץ דם דיאסטולי","english":"Diastolic Pressure","definition":"לחץ הדם המופעל על דפנות העורקים בזמן הרפיית שרירי הלב."},{"letter":"ל","hebrew":"לחץ דם סיסטולי","english":"Systolic Pressure","definition":"לחץ הדם המופעל על דפנות העורקים בזמן התכווצות שרירי הלב."},{"letter":"ל","hebrew":"ליגנד","english":"Ligand","definition":"מולקולה הנקשרת לקולטן ספציפי, יוצרת אות תאי."},{"letter":"ל","hebrew":"ליזוזום","english":"Lysosome","definition":"אברון העיכול בתאים אנימליים, מכיל אנזימים פעילים ב-pH חומצי."},{"letter":"ל","hebrew":"לימפוציטים מסוג B","english":"B Lymphocytes","definition":"תאי דם לבנים המתמיינים לתאי פלזמה המייצרים נוגדנים, ולתאי זיכרון; מבשילים במח העצם."},{"letter":"ל","hebrew":"לימפוציטים מסוג T","english":"T Lymphocytes","definition":"תאי דם לבנים המבשילים בתימוס; כוללים תאי עוזר, הורגים ורגולטוריים."},{"letter":"ל","hebrew":"ליפידים","english":"Lipids","definition":"מולקולות הידרופוביות המשמשות כחומרי תשמורת, מבניים, הורמונים ומלחי מרה."},{"letter":"מ","hebrew":"מאפיינים של חיים","english":"Characteristics of Life","definition":"המאפיינים הבסיסיים של יצורים חיים: חילוף חומרים, גדילה, התרבות, תגובה לגירויים והומאוסטזיס."},{"letter":"מ","hebrew":"מארג מזון","english":"Food Web","definition":"רשת של שרשרות מזון מצטלבות במערכת אקולוגית."},{"letter":"מ","hebrew":"מבנה ראשוני","english":"Primary Structure","definition":"רצף חומצות האמינו בחלבון, קשורות בקשרים פפטידיים."},{"letter":"מ","hebrew":"מבנה רבעוני","english":"Quaternary Structure","definition":"מבנה של חלבון המורכב מכמה שרשראות פוליפפטידיות, כמו בהמוגלובין."},{"letter":"מ","hebrew":"מבנה שלישוני","english":"Tertiary Structure","definition":"המבנה המרחבי הכולל של החלבון; קובע את תפקודו."},{"letter":"מ","hebrew":"מבנה שניוני","english":"Secondary Structure","definition":"התקפלות מקומית של חלבון לצורות כמו סליל אלפא או משטח בטא, מקשרי מימן."},{"letter":"מ","hebrew":"מגוון ביולוגי","english":"Biodiversity","definition":"מכלול השונות בטבע: מגוון גנטי, מגוון מינים ומגוון מערכות אקולוגיות."},{"letter":"מ","hebrew":"מגוון מינים","english":"Species Diversity","definition":"מספר המינים השונים בבית גידול או בביוספרה."},{"letter":"מ","hebrew":"מגיבים","english":"Reactants","definition":"התרכובות שאיתן מתחילה ריאקציה כימית."},{"letter":"מ","hebrew":"מגן הכישור","english":"Kinetochore","definition":"מקבץ חלבונים בצנטרומר המקשר בין הכרומטידות לחלבוני הכישור במהלך החלוקה."},{"letter":"מ","hebrew":"מוגלה","english":"Pus","definition":"נוזל לבן-צהבהב המופיע בזיהומים, מכיל פתוגנים, תאי דם לבנים ושיירי תאים."},{"letter":"מ","hebrew":"מוח","english":"Brain","definition":"מרכז עצבי המורכב ממיליארדי נוירונים; מעבד מידע ושולח תגובות לכל הגוף."},{"letter":"מ","hebrew":"מוח גדול","english":"Cerebrum","definition":"אזור במוח האחראי על תפיסה חושית, זיכרון, מחשבות ופעילות מוטורית רצונית; מחולק לשתי המיספרות."},{"letter":"מ","hebrew":"מוח השדרה","english":"Spinal Cord","definition":"המשך מוח הגולגולת, חלק ממערכת העצבים המרכזית, מוליך אותות בין המוח לגוף ומעורב ברפלקסים."},{"letter":"מ","hebrew":"מוחון","english":"Cerebellum","definition":"אזור במוח האחראי על תיאום תנועות, שיווי משקל ויציבה."},{"letter":"מ","hebrew":"מוטציה","english":"Mutation","definition":"שינוי ברצף הנוקלאוטידים ב-DNA; מקור לשונות הגנטית באוכלוסייה."},{"letter":"מ","hebrew":"מוליך עצבי","english":"Neurotransmitter","definition":"מולקולה המופרשת בקצה האקסון אל הסינפסה, נקשרת לקולטנים בתא הסמוך ומעוררת או מדכאת אותו."},{"letter":"מ","hebrew":"מח עצם","english":"Bone Marrow","definition":"רקמה בחלק הספוגי של העצם בה נוצרים תאי דם אדומים, לבנים וטסיות מתאי גזע."},{"letter":"מ","hebrew":"מחבר הכישור","english":"Kinetochore","definition":"מקבץ חלבונים בצנטרומר המקשר בין הכרומטידות לחלבוני הכישור בחלוקה."},{"letter":"מ","hebrew":"מחדר","english":"Insert","definition":"מקטע DNA המוכנס לנשא (וקטור) בהנדסה גנטית."},{"letter":"מ","hebrew":"מחזור דם גדול","english":"Systemic Circulation","definition":"מסלול הדם מהלב השמאלי לכל הגוף ובחזרה לעלייה הימנית."},{"letter":"מ","hebrew":"מחזור דם כפול","english":"Double Circulation","definition":"מערכת הובלה בה הדם עובר שני מחזורים: גדול (לב-גוף-לב) וקטן (לב-ריאות-לב)."},{"letter":"מ","hebrew":"מחזור דם קטן","english":"Pulmonary Circulation","definition":"מסלול הדם מהלב הימני לריאות ובחזרה לעלייה השמאלית; בו מתבצע חילוף הגזים."},{"letter":"מ","hebrew":"מחזור הוסת","english":"Menstrual Cycle","definition":"מחזור הורמונלי חודשי באישה הכולל הבשלת ביצית, ביוץ והכנת הרחם להפריה אפשרית."},{"letter":"מ","hebrew":"מחזור התא","english":"Cell Cycle","definition":"רצף האירועים מהיווצרות תא ועד לחלוקתו לתאי בת; כולל אינטרפזה ושלב חלוקה."},{"letter":"מ","hebrew":"מחלות אוטו-אימוניות","english":"Autoimmune Diseases","definition":"מחלות בהן מערכת החיסון תוקפת רקמות עצמיות של הגוף, כמו טרשת נפוצה או צליאק."},{"letter":"מ","hebrew":"מטבוליזם","english":"Metabolism","definition":"מכלול התהליכים הכימיים בתא: בנייה, פירוק והפקת אנרגיה."},{"letter":"מ","hebrew":"מי קולחין","english":"Reclaimed Water","definition":"מים המסוננים מטוהרים מביוב, משמשים בעיקר להשקיה חקלאית."},{"letter":"מ","hebrew":"מיאלין, מעטפת","english":"Myelin Sheath","definition":"שכבת בידוד שומנית סביב האקסון, מאיצה את ההולכה העצבית."},{"letter":"מ","hebrew":"מיוזה","english":"Meiosis","definition":"חלוקת תא בשני שלבים היוצרת ארבעה תאים הפלואידיים, בסיס ליצירת גמטות."},{"letter":"מ","hebrew":"מיטוזה","english":"Mitosis","definition":"חלוקת תא היוצרת שני תאי בת זהים גנטית לתא האם; בסיס לגדילת רקמות."},{"letter":"מ","hebrew":"מיטוכונדריון","english":"Mitochondrion","definition":"אברון המבצע את השלבים האווירניים של הנשימה התאית ומפיק רוב ה-ATP בתא."},{"letter":"מ","hebrew":"מים מטבוליים","english":"Metabolic Water","definition":"מים הנוצרים בתהליכים מטבוליים בתאים, מקור עיקרי לבעלי חיים בסביבות צחיחות."},{"letter":"מ","hebrew":"מין","english":"Species","definition":"קבוצת פרטים שיכולים להזדווג ולהעמיד צאצאים פוריים בתנאים טבעיים."},{"letter":"מ","hebrew":"מין אנדמי","english":"Endemic Species","definition":"מין הקיים רק באזור גאוגרפי מצומצם, רגיש להכחדה."},{"letter":"מ","hebrew":"מין פולש","english":"Invasive Species","definition":"מין שהובא למערכת אקולוגית חדשה ופוגע באיזון בה."},{"letter":"מ","hebrew":"מיקרואורגניזם","english":"Microorganism","definition":"יצורים מיקרוסקופיים, בעיקר חד-תאיים, הנראים רק תחת מיקרוסקופ."},{"letter":"מ","hebrew":"מיקרוביוטה","english":"Microbiota","definition":"אוסף המיקרואורגניזמים החיים בגוף יצורים חיים אחרים בסימביוזה."},{"letter":"מ","hebrew":"מישור המשווה","english":"Equatorial Plane","definition":"אזור במרכז התא בו מסתדרים הכרומוזומים לפני משיכתם לקטבים בחלוקת התא."},{"letter":"מ","hebrew":"מסלול ליזוגני","english":"Lysogenic Pathway","definition":"מסלול התרבות בו DNA נגיפי משתלב בגנום המארח ונשאר רדום, עד למצב עקה."},{"letter":"מ","hebrew":"מסלול ליטי","english":"Lytic Pathway","definition":"מסלול התרבות בו הנגיף משתלט מיד על התא המארח, מתרבה וגורם להריסתו."},{"letter":"מ","hebrew":"מסתם","english":"Valve","definition":"מבנה המאפשר זרימה בכיוון אחד בלבד; בלב ארבעה מסתמים, וגם בוורידים יש מסתמים."},{"letter":"מ","hebrew":"מעי","english":"Gut","definition":"חלק מצינור העיכול מהקיבה ועד פי הטבעת, בו מתפרק המזון ונספגים תוצריו."},{"letter":"מ","hebrew":"מעי גס","english":"Large Intestine","definition":"החלק האחרון בצינור העיכול, סופג מים ומלחים, מהווה בית גידול לחיידקים מועילים."},{"letter":"מ","hebrew":"מעי דק","english":"Small Intestine","definition":"אזור עיקרי לפירוק וספיגה של חומרי הזנה בעיכול; מתחיל בתריסריון."},{"letter":"מ","hebrew":"מערכת","english":"Organ System","definition":"קבוצת איברים העובדים יחד לביצוע תפקודים מסוימים בגוף."},{"letter":"מ","hebrew":"מערכת אנדוקרינית","english":"Endocrine System","definition":"מערכת בלוטות המייצרת ומפרישה הורמונים השולטים על תהליכים פיזיולוגיים בגוף."},{"letter":"מ","hebrew":"מערכת אקולוגית","english":"Ecosystem","definition":"מערכת הכוללת את כלל הגורמים הביוטיים והאביוטיים באזור מסוים ויחסי הגומלין ביניהם."},{"letter":"מ","hebrew":"מערכת דם סגורה","english":"Closed Circulatory System","definition":"מערכת בה הדם זורם רק בכלי דם ובלב, נפוצה בחולייתנים."},{"letter":"מ","hebrew":"מערכת דם פתוחה","english":"Open Circulatory System","definition":"מערכת בה הדם זורם בחלל הגוף וחודר לרקמות, נפוצה בחרקים ורכיכות."},{"letter":"מ","hebrew":"מערכת ההובלה","english":"Cardiovascular System","definition":"מערכת הכוללת לב, כלי דם ודם, מובילה חומרים לתאים ומהם."},{"letter":"מ","hebrew":"מערכת ההפרשה","english":"Urinary System","definition":"מערכת הכוללת כליות, שופכנים, שלפוחית ושופכה; מסננת את הדם ומסלקת פסולת."},{"letter":"מ","hebrew":"מערכת החיסון","english":"Immune System","definition":"מערכת המגינה על הגוף מפני גורמים זרים, מורכבת מתאי דם לבנים, בלוטות לימפה ונוגדנים."},{"letter":"מ","hebrew":"מערכת הלימפה","english":"Lymphatic System","definition":"רשת צינורות ובלוטות לימפה הפרוסה בגוף, מסייעת בתגובה החיסונית ובהובלת נוזלים."},{"letter":"מ","hebrew":"מערכת הנשימה","english":"Respiratory System","definition":"מערכת הכוללת קנה נשימה, סמפונות וריאות; מאפשרת חילוף גזים בין הדם לסביבה."},{"letter":"מ","hebrew":"מערכת העיכול","english":"Digestive System","definition":"מערכת הכוללת צינור עיכול ובלוטות עזר; מפרקת מזון וסופגת חומרי הזנה."},{"letter":"מ","hebrew":"מערכת העצבים","english":"Nervous System","definition":"מערכת המורכבת מנוירונים, קולטת ומעבדת מידע ומשגרת תגובות."},{"letter":"מ","hebrew":"מערכת העצבים ההיקפית","english":"Peripheral Nervous System","definition":"עצבים מחוץ למוח ולחוט השדרה, מקשרים בין המערכת המרכזית לבין שאר הגוף."},{"letter":"מ","hebrew":"מערכת העצבים המרכזית","english":"Central Nervous System","definition":"מוח הגולגולת ומוח השדרה; מעבדים מידע ושולחים תגובות."},{"letter":"מ","hebrew":"מערכת הרבייה","english":"Reproductive System","definition":"מערכת איברים המייצרים גמטות ומאפשרים הפריה והעמדת צאצאים."},{"letter":"מ","hebrew":"מפל ריכוזים","english":"Concentration Gradient","definition":"הבדל בריכוז מומסים בין שני אזורים; ככל שגבוה, קצב הדיפוזיה מהיר יותר."},{"letter":"מ","hebrew":"מפרקים","english":"Decomposers","definition":"אורגניזמים (חיידקים ופטריות) המפרקים חומר אורגני מת ומחזירים אותו לאנאורגני."},{"letter":"מ","hebrew":"מקור השכפול","english":"Origin of Replication","definition":"רצף ב-DNA בו מתחיל תהליך השכפול; פלסמיד מכיל אחד וכרומוזום מכיל כמה."},{"letter":"מ","hebrew":"מרכז הלב וכלי הדם","english":"Cardiovascular Center","definition":"אזור במוח המוארך המווסת את קצב הלב לפי ריכוז פחמן דו-חמצני בדם."},{"letter":"מ","hebrew":"מרכז הנשימה","english":"Respiratory Center","definition":"אזור במוח המוארך השולט על קצב הנשימה לפי שינויים בריכוז CO₂ וב-pH הדם."},{"letter":"מ","hebrew":"משאבות","english":"Pumps","definition":"חלבוני קרום המעבירים חומרים כנגד מפל הריכוזים תוך השקעת אנרגיה (ATP)."},{"letter":"מ","hebrew":"משאבים","english":"Resources","definition":"מזון, מים, אזורי מחיה וחומרים החיוניים להישרדות והתרבות; יכולים להוות גורם מגביל."},{"letter":"מ","hebrew":"משוב חיובי","english":"Positive Feedback","definition":"מנגנון בקרה המגביר את התגובה ההתחלתית, כמו בלידה או בקרישת דם."},{"letter":"מ","hebrew":"משוב שלילי","english":"Negative Feedback","definition":"מנגנון בקרה המעכב את התגובה כדי לשמור על איזון, נפוץ בהומאוסטזיס."},{"letter":"מ","hebrew":"משרן","english":"Inducer","definition":"מולקולה המסירה את הדכאן מהאתר המפעיל ומאפשרת שעתוק של גן."},{"letter":"נ","hebrew":"נאדיות","english":"Alveoli","definition":"שקיקים זעירים בריאות בעלי דופן דק, בהם מתבצע חילוף הגזים עם הדם."},{"letter":"נ","hebrew":"נגיף","english":"Virus","definition":"גורם מדבק תת-מיקרוסקופי התלוי בתא מארח להתרבות, מורכב מחומר תורשתי ומעטפת חלבונית."},{"letter":"נ","hebrew":"נוגדן","english":"Antibody","definition":"חלבון בצורת Y הנוצר בלימפוציטים מסוג B, נקשר ספציפית לאנטיגן ומסייע לחיסולו."},{"letter":"נ","hebrew":"נוירוטרנסמיטר","english":"Neurotransmitter","definition":"ראה: מוליך עצבי."},{"letter":"נ","hebrew":"נוירון","english":"Neuron","definition":"תא העצב, יחידת היסוד של מערכת העצבים; מקבל, מעבד ומעביר אותות עצביים."},{"letter":"נ","hebrew":"נוירון ביניים","english":"Interneuron","definition":"נוירון במערכת העצבים המרכזית המקשר בין נוירון תחושתי לנוירון מוטורי."},{"letter":"נ","hebrew":"נוירון חישה","english":"Sensory Neuron","definition":"נוירון הקולט גירויים מהסביבה ומעביר את המידע למערכת העצבים המרכזית."},{"letter":"נ","hebrew":"נוירון מוטורי","english":"Motor Neuron","definition":"נוירון השולח את התגובה מהמערכת המרכזית לתאי שריר או בלוטה."},{"letter":"נ","hebrew":"נוקלאואיד","english":"Nucleoid","definition":"אזור בתא חיידק בו נמצא החומר התורשתי; אינו מוקף בקרום."},{"letter":"נ","hebrew":"נוקלאוטיד","english":"Nucleotide","definition":"אבן הבניין של חומצות גרעין; מורכב מסוכר, קבוצת זרחה ובסיס חנקני."},{"letter":"נ","hebrew":"נימים","english":"Capillaries","definition":"כלי הדם הצרים ביותר, פרוסים ברקמות ומאפשרים מעבר חומרים בין הדם לתאים."},{"letter":"נ","hebrew":"ניצול אנרגיה","english":"Energy Use","definition":"שימוש באנרגיה כימית (ATP) לקיום תהליכים תאיים."},{"letter":"נ","hebrew":"נפח פעימה","english":"Stroke Volume","definition":"נפח הדם המוזרם מחדר הלב בכל פעימה."},{"letter":"נ","hebrew":"נפרון","english":"Nephron","definition":"יחידת הסינון בכליה; מכיל קופסית באומן, פקעית ואבובית מפותלת ליצירת שתן."},{"letter":"נ","hebrew":"נקודת רוויה","english":"Saturation Point","definition":"הנקודה בה כל האנזימים רוויים בסובסטרט והוספת עוד אינה מעלה את קצב התגובה."},{"letter":"נ","hebrew":"נרתיק","english":"Vagina","definition":"תעלה במערכת הרבייה הנקבית; קולטת תאי זרע, מהווה תעלת לידה ומאפשרת יציאת נוזלי הוסת."},{"letter":"נ","hebrew":"נשאים","english":"Carriers","definition":"חלבוני קרום הנקשרים לחומרים ספציפיים ומשנים מבנה כדי להעבירם, במורד מפל הריכוזים."},{"letter":"נ","hebrew":"נשימה אווירנית","english":"Aerobic Respiration","definition":"נשימה תאית בנוכחות חמצן, מפיקה כ-30-32 ATP מכל מולקולת גלוקוז."},{"letter":"נ","hebrew":"נשימה תאית","english":"Cellular Respiration","definition":"מסלול מטבולי בו מופקת אנרגיה כימית (ATP) מפירוק גלוקוז בנוכחות חמצן."},{"letter":"נ","hebrew":"נשיפה","english":"Exhalation","definition":"יציאת אוויר מהריאות עקב התרפות הסרעפת והשרירים הבין-צלעיים."},{"letter":"ס","hebrew":"סובסטרט (מצע)","english":"Substrate","definition":"מולקולה הנקשרת לאתר הפעיל של האנזים ועליה מתבצעת הקטליזה."},{"letter":"ס","hebrew":"סוכר","english":"Sugar","definition":"מולקולה אורגנית מפחמן, מימן וחמצן; משמשת לאחסון והפקת אנרגיה בתאים."},{"letter":"ס","hebrew":"סוכרים","english":"Sugars","definition":"ראה: סוכר."},{"letter":"ס","hebrew":"סימביוזה","english":"Symbiosis","definition":"יחסי גומלין בין מינים שונים, מהם שני הצדדים מפיקים תועלת."},{"letter":"ס","hebrew":"סינפסה","english":"Synapse","definition":"מרווח בין קצה האקסון של תא עצב אחד לתא הבא; דרכו עוברים מוליכים עצביים."},{"letter":"ס","hebrew":"סיסטולה","english":"Systole","definition":"שלב התכווצות שרירי הלב, בו הדם מוזרם לעורקים."},{"letter":"ס","hebrew":"סיסים","english":"Villi","definition":"בליטות דמויות אצבעות בדופן המעי הדק המגדילות את שטח הפנים לספיגה."},{"letter":"ס","hebrew":"ספיגה","english":"Absorption","definition":"מעבר חומרים מצינור העיכול לזרם הדם או הלימפה דרך דופן המעי."},{"letter":"ס","hebrew":"סרעפת","english":"Diaphragm","definition":"שריר שטוח המפריד בין חלל בית החזה לחלל הבטן, התכווצותו מאפשרת שאיפה."},{"letter":"ע","hebrew":"עובר","english":"Embryo","definition":"צבר תאים מתפתחים מהזיגוטה בתחילת ההיריון, עובר חלוקות מיטוטיות והתמיינות."},{"letter":"ע","hebrew":"עורק","english":"Artery","definition":"כלי דם רחב בעל דופן עבה וגמיש, מוביל דם מהלב לרקמות."},{"letter":"ע","hebrew":"עורק הריאה","english":"Pulmonary Artery","definition":"עורק המוביל דם עני בחמצן מהחדר הימני לריאות."},{"letter":"ע","hebrew":"עורק כלילי","english":"Coronary Artery","definition":"עורק היוצא מאבי העורקים ומספק דם עשיר בחמצן לשרירי הלב עצמם."},{"letter":"ע","hebrew":"עורקיק","english":"Arteriole","definition":"כלי דם צר בין עורק לנים, כיווצו או הרפייתו מווסתים זרימת דם לאיברים."},{"letter":"ע","hebrew":"עיכוב לא תחרותי","english":"Non-competitive Inhibition","definition":"עיכוב אנזים על ידי מולקולה הנקשרת לאתר אלוסטרי, משנה את מבנה האתר הפעיל."},{"letter":"ע","hebrew":"עיכוב תחרותי","english":"Competitive Inhibition","definition":"מולקולה דומה לסובסטרט נקשרת לאתר הפעיל ומתחרה איתו על האנזים."},{"letter":"ע","hebrew":"עליה","english":"Atrium","definition":"אחד מחללי הלב המקבל דם מוורידים ראשיים ומעבירו לחדרים."},{"letter":"ע","hebrew":"עמידות לאנטיביוטיקה","english":"Antibiotic Resistance","definition":"יכולת חיידקים לשגשג בנוכחות אנטיביוטיקה, לרוב מקודדת בפלסמיד."},{"letter":"פ","hebrew":"פגוציט","english":"Phagocyte","definition":"תא דם לבן הבולע ומפרק חיידקים, תאים מתים ושיירים בתהליך פגוציטוזה."},{"letter":"פ","hebrew":"פגוציטוזה","english":"Phagocytosis","definition":"בליעת חלקיקים גדולים על ידי תא, באמצעות יצירת שלוחות ציטופלסמטיות."},{"letter":"פ","hebrew":"פוטוסינתזה","english":"Photosynthesis","definition":"תהליך בו אנרגיית אור מומרת לאנרגיה כימית, יוצר גלוקוז וחמצן ממים ופחמן דו-חמצני."},{"letter":"פ","hebrew":"פויקילותרמיים","english":"Poikilotherms","definition":"בעלי חיים שטמפרטורת גופם משתנה עם הסביבה (זוחלים, דו-חיים, דגים, חסרי חוליות)."},{"letter":"פ","hebrew":"פולימר","english":"Polymer","definition":"מולקולה ארוכה הבנויה מיחידות חוזרות (מונומרים) הקשורות זו לזו."},{"letter":"פ","hebrew":"פולימראז","english":"Polymerase","definition":"משפחת אנזימים המסנתזים DNA או RNA על ידי הוספת נוקלאוטידים לפי תבנית."},{"letter":"פ","hebrew":"פוספוליפידים","english":"Phospholipids","definition":"מולקולות המרכיב היסודי של קרום התא, בעלות ראש מסיס במים וזנב הידרופובי."},{"letter":"פ","hebrew":"פחמן חד-חמצני","english":"Carbon Monoxide","definition":"גז רעיל הנקשר להמוגלובין בזיקה גבוהה פי 240 מחמצן, חסר ריח וצבע ולכן מסוכן."},{"letter":"פ","hebrew":"פיברין","english":"Fibrin","definition":"חלבון סיבי בלתי מסיס המהווה מרכיב מרכזי בקריש דם."},{"letter":"פ","hebrew":"פיברינוגן","english":"Fibrinogen","definition":"חלבון מסיס בדם ההופך לפיברין בתהליך קרישה לאחר פציעה."},{"letter":"פ","hebrew":"פיונית","english":"Stoma","definition":"פתח בעלי הצמח דרכו מתבצע חילוף גזים ודיות; מבוקר על ידי תאי שמירה."},{"letter":"פ","hebrew":"פין","english":"Penis","definition":"איבר מין זכרי המעביר תאי זרע אל גוף הנקבה בעת הזדווגות."},{"letter":"פ","hebrew":"פירמידה אקולוגית","english":"Ecological Pyramid","definition":"ייצוג חזותי של ביומסה או אנרגיה ברמות ההזנה השונות במערכת אקולוגית."},{"letter":"פ","hebrew":"פלזמיד","english":"Plasmid","definition":"מולקולת DNA מעגלית קצרה בחיידקים, נושאת לרוב גנים לעמידויות; משמשת בהנדסה גנטית."},{"letter":"פ","hebrew":"פלסמה","english":"Plasma","definition":"החלק הנוזלי של הדם, מכיל מים, חלבונים, מומסים ופסולת."},{"letter":"פ","hebrew":"פלסמוליזה","english":"Plasmolysis","definition":"תהליך בו תא צמח מאבד מים בתמיסה היפרטונית ונפח החלולית מצטמצם."},{"letter":"פ","hebrew":"פנוטיפ","english":"Phenotype","definition":"הביטוי החיצוני של התכונה בפרט, נקבע על ידי הגנוטיפ והסביבה."},{"letter":"פ","hebrew":"פעימת לב","english":"Heartbeat","definition":"מחזור שלם של התכווצות והרפיית הלב; באדם כ-0.8 שניות לפעימה."},{"letter":"פ","hebrew":"פפטידוגליקן","english":"Peptidoglycan","definition":"פולימר רב-סוכרים ופפטידים, מרכיב עיקרי בדופן התא של רוב החיידקים."},{"letter":"פ","hebrew":"פקעית","english":"Glomerulus","definition":"צבר נימי דם בתוך קופסית באומן בנפרון, בו מתחיל הסינון של הדם."},{"letter":"פ","hebrew":"פקעת","english":"Tuber","definition":"איבר אגירה תת-קרקעי בצמחים, אוגר חומרי תשמורת כמו עמילן."},{"letter":"פ","hebrew":"פרוגסטרון","english":"Progesterone","definition":"הורמון מהגופיף הצהוב ומהשליה, שומר על רירית הרחם ומאפשר את המשך ההיריון."},{"letter":"פ","hebrew":"פרולקטין","english":"Prolactin","definition":"הורמון מההיפופיזה המעודד ייצור חלב בבלוטות החלב לאחר לידה."},{"letter":"פ","hebrew":"פרוקריוטים","english":"Prokaryotes","definition":"יצורים חד-תאיים חסרי גרעין ואברונים, כמו חיידקים; קטנים מתאים אאוקריוטים."},{"letter":"פ","hebrew":"פתוגן","english":"Pathogen","definition":"גורם מחלה: חיידק, נגיף, פטריה או טפיל."},{"letter":"צ","hebrew":"ציטוזין (C)","english":"Cytosine","definition":"בסיס חנקני בנוקלאוטיד הנקשר בשלושה קשרי מימן עם גואנין."},{"letter":"צ","hebrew":"ציטופלזמה","english":"Cytoplasm","definition":"נוזל צמיג בתוך התא בו נמצאים האברונים ומתרחשים תהליכים מטבוליים רבים."},{"letter":"צ","hebrew":"צמח חד-שנתי","english":"Annual Plant","definition":"צמח המשלים את מחזור חייו בעונת צמיחה אחת ומת לאחר ייצור הזרעים."},{"letter":"צ","hebrew":"צמח רב-שנתי","english":"Perennial Plant","definition":"צמח שחייו נמשכים מספר שנים, בעל כמה מחזורי רבייה."},{"letter":"צ","hebrew":"צמחי CAM","english":"CAM Plants","definition":"צמחים בסביבות צחיחות הקולטים פחמן דו-חמצני בלילה ומשתמשים בו לפוטוסינתזה ביום."},{"letter":"צ","hebrew":"צנטרומר","english":"Centromere","definition":"אזור בכרומוזום המחבר בין שתי הכרומטידות האחיות, נקודת קישור לחלבוני הכישור."},{"letter":"צ","hebrew":"צרכן","english":"Consumer","definition":"אורגניזם הניזון מאורגניזמים אחרים; מסווג לראשוני, שניוני או שלישוני."},{"letter":"צ","hebrew":"צרכן ראשוני","english":"Primary Consumer","definition":"אורגניזם הניזון מיצרנים (צמחוני)."},{"letter":"צ","hebrew":"צרכן שלישוני","english":"Tertiary Consumer","definition":"אורגניזם הטורף צרכנים שניוניים."},{"letter":"צ","hebrew":"צרכן שניוני","english":"Secondary Consumer","definition":"אורגניזם הטורף צרכנים ראשוניים."},{"letter":"ק","hebrew":"קבוצת זרחה","english":"Phosphate Group","definition":"יון של זרחן וארבעה אטומי חמצן; חלק מהנוקלאוטיד ושלד הגדיל בחומצות הגרעין."},{"letter":"ק","hebrew":"קו-דומיננטיות","english":"Co-Dominance","definition":"דרך הורשה בה שני האללים מתבטאים במלואם בהטרוזיגוט, יוצרים שילוב מופעים שניהם."},{"letter":"ק","hebrew":"קודון","english":"Codon","definition":"רצף שלושה נוקלאוטידים ב-mRNA המקודד לחומצה אמינית אחת."},{"letter":"ק","hebrew":"קודון אתחול","english":"Start Codon","definition":"הרצף AUG מהווה תחילת התרגום ומקודד למתיונין."},{"letter":"ק","hebrew":"קודון סיום","english":"Stop Codon","definition":"אחד משלושה קודונים המסיימים את התרגום, אינם מקודדים לחומצה אמינית."},{"letter":"ק","hebrew":"קוטר תא","english":"Cell Diameter","definition":"מידת גודלו של התא, משתנה בין סוגי תאים שונים."},{"letter":"ק","hebrew":"קולטן","english":"Receptor","definition":"חלבון בקרום התא או בציטופלסמה שאליו נקשר ליגנד ספציפי, מתחיל מענה תאי."},{"letter":"ק","hebrew":"קולטן ייחודי","english":"Specific Receptor","definition":"קולטן בעל התאמה מרחבית למולקולה ייחודית, מבטיח ספציפיות בתגובה."},{"letter":"ק","hebrew":"קומנסליזם (סמוכנות)","english":"Commensalism","definition":"יחסי גומלין בהם מין אחד נהנה והשני לא מושפע."},{"letter":"ק","hebrew":"קוניוגציה","english":"Conjugation","definition":"העברה אופקית של DNA (לרוב פלסמיד) בין חיידקים במגע ישיר דרך גשר ציטופלסמטי."},{"letter":"ק","hebrew":"קופסית באומן","english":"Bowman's Capsule","definition":"מבנה גביעי בנפרון העוטף את הפקעית ובו נוצר התסנין הראשוני."},{"letter":"ק","hebrew":"קוצב לב משני","english":"Atrioventricular Node","definition":"מעביר את הדחף מקוצב הלב הראשי לחדרי הלב דרך סיבי פורקינייה."},{"letter":"ק","hebrew":"קוצב לב ראשי","english":"Sinoatrial Node","definition":"קבוצת תאים בעלייה הימנית המייצרת את הדחפים החשמליים לפעימת הלב."},{"letter":"ק","hebrew":"קיבה","english":"Stomach","definition":"שק שרירי בו מתחיל פירוק החלבונים על ידי האנזים פפסין ב-pH חומצי."},{"letter":"ק","hebrew":"קיבוע חנקן","english":"Nitrogen Fixation","definition":"תהליך בחיידקים המהפכים חנקן אטמוספרי לתרכובות אנאורגניות זמינות לצמחים."},{"letter":"ק","hebrew":"קיבוע פחמן","english":"Carbon Fixation","definition":"תהליך הפיכת פחמן דו-חמצני לחומר אורגני בפוטוסינתזה."},{"letter":"ק","hebrew":"קנה הנשימה","english":"Trachea","definition":"צינור עטוף בסחוס המוביל אוויר לסמפונות הריאה."},{"letter":"ק","hebrew":"קצב התגובה האנזימטית","english":"Reaction Rate","definition":"מספר המפגשים של האנזים עם הסובסטרט ליחידת זמן."},{"letter":"ק","hebrew":"קרום התא","english":"Plasma Membrane","definition":"שכבה כפולה של פוספוליפידים וחלבונים, בררנית בחדירותה לחומרים."},{"letter":"ק","hebrew":"קרישת דם","english":"Blood Clotting","definition":"תגובת שרשרת של חומרים מטסיות הדם ומהפלזמה לעצירת דימום בעת פציעה."},{"letter":"ק","hebrew":"קשר פפטידי","english":"Peptide Bond","definition":"קשר קוולנטי בין חומצות אמינו, מחבר את הקצה הקרבוקסילי של אחת לקצה האמיני של השנייה."},{"letter":"ק","hebrew":"קשת רפלקס","english":"Reflex Arc","definition":"המסלול העצבי של תגובת רפלקס: גירוי, נוירון חישה, מוח השדרה, נוירון מוטורי ותגובה."},{"letter":"ר","hebrew":"ראה","english":"Lung","definition":"איבר נשימה תוך-גופי, מכיל הסתעפויות סמפונות וקצותיהן נאדיות בהן מתבצע חילוף הגזים."},{"letter":"ר","hebrew":"ראשן","english":"Tadpole","definition":"השלב הראשון בהתפתחות דו-חיים, חי במים ומבנהו מותאם לחיים מימיים."},{"letter":"ר","hebrew":"רב-סוכר","english":"Polysaccharide","definition":"פולימר של חד-סוכרים, כמו עמילן וגליקוגן (חומרי תשמורת) או צלולוז (מבני)."},{"letter":"ר","hebrew":"רבייה אל-זוויגית","english":"Asexual Reproduction","definition":"רבייה הנוצרת מאורגניזם אחד, צאצאים זהים גנטית להורה."},{"letter":"ר","hebrew":"רבייה זוויגית","english":"Sexual Reproduction","definition":"רבייה הכוללת איחוד גמטות משני הורים, יוצרת שונות גנטית בצאצאים."},{"letter":"ר","hebrew":"רביית בתולים","english":"Parthenogenesis","definition":"רבייה אל-זוויגית בה צאצא מתפתח מביצית לא מופרית."},{"letter":"ר","hebrew":"רחם","english":"Uterus","definition":"איבר במערכת הרבייה הנקבית בו מתפתח העובר במהלך ההיריון."},{"letter":"ר","hebrew":"ריבוז","english":"Ribose","definition":"חד-סוכר בעל חמישה פחמנים, חלק ממבנה הנוקלאוטיד ב-RNA."},{"letter":"ר","hebrew":"ריבוזום","english":"Ribosome","definition":"מבנה משתי תת-יחידות של rRNA וחלבונים, מבצע את תרגום ה-mRNA לחלבון."},{"letter":"ר","hebrew":"רמת ארגון","english":"Biological Organization","definition":"ייצוג היררכי ממולקולה ועד ביוספרה של מורכבות מערכות ביולוגיות."},{"letter":"ר","hebrew":"רמת הזנה","english":"Trophic Level","definition":"מיקום של מין בשרשרת המזון, לפי מספר הצעדים מהיצרן."},{"letter":"ר","hebrew":"רנא מוביל (tRNA)","english":"Transfer RNA","definition":"מולקולת RNA המובילה חומצות אמינו לריבוזום בתהליך התרגום."},{"letter":"ר","hebrew":"רנא ריבוזומלי (rRNA)","english":"Ribosomal RNA","definition":"מולקולת RNA המהווה חלק מבני ותפקודי של הריבוזום."},{"letter":"ר","hebrew":"רנא שליח (mRNA)","english":"Messenger RNA","definition":"מולקולת RNA הנושאת את הקוד מהגן בגרעין לריבוזום, ממנה מיוצר חלבון."},{"letter":"ר","hebrew":"רפלקס","english":"Reflex","definition":"תגובה מהירה ובלתי רצונית של מערכת העצבים, מתבצעת לרוב דרך מוח השדרה."},{"letter":"ש","hebrew":"שאיפה","english":"Inhalation","definition":"כניסת אוויר לריאות עקב התכווצות הסרעפת והגדלת נפח בית החזה."},{"letter":"ש","hebrew":"שופכה","english":"Urethra","definition":"צינור שרירי המוביל שתן (ובזכרים גם זרע) משלפוחית השתן החוצה מהגוף."},{"letter":"ש","hebrew":"שופכן","english":"Ureter","definition":"צינור המוביל שתן מהכליה לשלפוחית השתן."},{"letter":"ש","hebrew":"שחבור","english":"Splicing","definition":"הסרת אינטרונים וחיבור אקסונים בתעתיק ראשוני ליצירת mRNA סופי."},{"letter":"ש","hebrew":"שחבור חליפי","english":"Alternative Splicing","definition":"חיבור שונה של אקסונים מאותו גן, יוצר חלבונים שונים מאותו רצף."},{"letter":"ש","hebrew":"שחלה","english":"Ovary","definition":"איבר רבייה נקבי המייצר ביציות ומפריש הורמוני מין נקביים."},{"letter":"ש","hebrew":"שחלוף","english":"Crossing Over","definition":"החלפת מקטעים בין כרומוזומים הומולוגיים במיוזה הראשונה; מגדיל שונות גנטית."},{"letter":"ש","hebrew":"שיחבור","english":"Splicing","definition":"ראה: שחבור."},{"letter":"ש","hebrew":"שיעתוק","english":"Transcription","definition":"יצירת מולקולת RNA מתבנית של גן ב-DNA, באמצעות האנזים המשעתק."},{"letter":"ש","hebrew":"שלב הגידול המעריכי","english":"Log Phase","definition":"שלב בעקומת גידול חיידקים בו האוכלוסייה מוכפלת בכל דור באופן אקספוננציאלי."},{"letter":"ש","hebrew":"שלב העמידה","english":"Stationary Phase","definition":"שלב בעקומת גידול בו תמותה ולידה מתאזנות; אוכלוסייה כמעט קבועה."},{"letter":"ש","hebrew":"שלב השהייה","english":"Lag Phase","definition":"שלב ראשון בעקומת גידול חיידקים, מאופיין בהתרבות אפסית והסתגלות מטבולית."},{"letter":"ש","hebrew":"שלב התמותה","english":"Death Phase","definition":"שלב סופי בעקומת גידול חיידקים, בו כמות החיידקים יורדת בעקבות חוסר נוטריינטים."},{"letter":"ש","hebrew":"שלד התא","english":"Cytoskeleton","definition":"רשת סיבים חלבוניים בציטופלסמה, מקנה יציבות, תנועה ומסייע בחלוקת התא."},{"letter":"ש","hebrew":"שליה","english":"Placenta","definition":"איבר ייחודי המתפתח בהיריון, מאפשר העברת מזון, חמצן ופסולת בין האם לעובר."},{"letter":"ש","hebrew":"שפע","english":"Abundance","definition":"מספר הפרטים ממין מסוים החיים באזור ספציפי."},{"letter":"ש","hebrew":"שק חלמון","english":"Yolk Sac","definition":"שק קרומי המחובר לעובר בשלבים מוקדמים, מספק הזנה ומקור ראשוני לתאי דם אדומים."},{"letter":"ש","hebrew":"שריר הלב","english":"Cardiac Muscle","definition":"רקמת שריר המרכיב את הלב, מתכווצת באופן עצמאי ובלתי רצוני."},{"letter":"ש","hebrew":"שרשרת מזון","english":"Food Chain","definition":"ייצוג של מעבר אנרגיה ביצרנים, צרכנים ומפרקים במערכת אקולוגית."},{"letter":"ש","hebrew":"שתנן","english":"Urea","definition":"תרכובת המיוצרת בכבד מאמוניה רעילה, מסולקת מהגוף בשתן."},{"letter":"ת","hebrew":"תא אם","english":"Mother Cell","definition":"התא המתחלק במיטוזה או במיוזה ויוצר תאי בת."},{"letter":"ת","hebrew":"תא ביצה","english":"Egg Cell","definition":"הגמטה הנקבית, גדולה ובעלת חומרי תשמורת להתפתחות העובר."},{"letter":"ת","hebrew":"תא בת","english":"Daughter Cell","definition":"תא הנוצר מחלוקת תא האם במיטוזה או במיוזה."},{"letter":"ת","hebrew":"תא דיפלואידי","english":"Diploid Cell","definition":"תא המכיל שני עותקים של החומר התורשתי (2n), אחד מכל הורה."},{"letter":"ת","hebrew":"תא הפלואידי","english":"Haploid Cell","definition":"ראה: הפלואידי, תא."},{"letter":"ת","hebrew":"תא זרע","english":"Sperm Cell","definition":"הגמטה הזכרית, בעלת שוטון לתנועה; ראש עם חומר תורשתי וצוואר עם מיטוכונדריה."},{"letter":"ת","hebrew":"תא רבייה","english":"Gamete","definition":"ראה: גמטה."},{"letter":"ת","hebrew":"תאחיזה","english":"Linkage","definition":"גנים הנמצאים באותו כרומוזום נוטים לעבור יחד לתא רבייה."},{"letter":"ת","hebrew":"תאחיזה לכרומוזום X","english":"X-linkage","definition":"הורשה של גנים מכרומוזום X, גורמת לשכיחות גבוהה יותר של תכונות רצסיביות בזכרים."},{"letter":"ת","hebrew":"תאי גזע","english":"Stem Cells","definition":"תאים לא ממוינים בעלי פוטנציאל להתמיין למגוון סוגי תאים."},{"letter":"ת","hebrew":"תאי דם אדומים","english":"Red Blood Cells","definition":"תאים חסרי גרעין ומיטוכונדריה הנושאים חמצן בעזרת המוגלובין; חיים כ-120 ימים."},{"letter":"ת","hebrew":"תאי זיכרון","english":"Memory Cells","definition":"לימפוציטים מסוג B או T שנשארו לאחר זיהום, מאפשרים תגובה מהירה לחשיפה חוזרת."},{"letter":"ת","hebrew":"תאי שמירה","english":"Guard Cells","definition":"תאי הפיונית בעלי השמירה הפותחים וסוגרים את הפיונית לפי תנאי הסביבה."},{"letter":"ת","hebrew":"תגובה ראשונית","english":"Primary Response","definition":"תגובה חיסונית איטית וחלשה בחשיפה ראשונה לאנטיגן."},{"letter":"ת","hebrew":"תגובה שניונית","english":"Secondary Response","definition":"תגובה חיסונית מהירה וחזקה בחשיפה חוזרת לאנטיגן, הודות לתאי זיכרון."},{"letter":"ת","hebrew":"תגובת שרשרת של פולימראז (PCR)","english":"PCR","definition":"שיטה מעבדתית לשכפול מהיר של מקטעי DNA ס let _audioCtx = null;
function playSuccessSound(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    const now = ctx.currentTime;
    // Pleasant 3-note ascending chime: C5 -> E5 -> G5
    [
      {freq: 523.25, start: 0, dur: 0.12},   // C5
      {freq: 659.25, start: 0.1, dur: 0.12}, // E5
      {freq: 783.99, start: 0.2, dur: 0.25}  // G5
    ].forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.freq;
      gain.gain.setValueAtTime(0, now + n.start);
      gain.gain.linearRampToValueAtTime(0.15, now + n.start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + n.start);
      osc.stop(now + n.start + n.dur);
    });
  } catch(e){ /* sound is optional */ }
}

function playWrongSound(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    const now = ctx.currentTime;
    // Soft descending tone for wrong answer

    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(180, now + 0.3);

    gain.gain.linearRampToValueAtTime(0.1, now + 0.02);

function todayDateStr(){

  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function daysBetween(date1, date2){
  const d1 = new Date(date1); const d2 = new Date(date2);
  return Math.floor((d2-d1)/(1000*60*60*24));
}

function updateStreak(){
  const today = todayDateStr();
  if(userProgress.lastActiveDate === today) return;
  if(!userProgress.lastActiveDate){
    userProgress.streak = 1;
  } else {
    const days = daysBetween(userProgress.lastActiveDate, today);
    if(days === 1) userProgress.streak += 1;
    else if(days > 1) userProgress.streak = 1;
  }
  userProgress.longestStreak = Math.max(userProgress.longestStreak || 0, userProgress.streak);
  userProgress.lastActiveDate = today;
  saveProgress();
  checkBadges();
}

let _quizStreakCount = 0; // tracks current correct streak in quiz session

function checkBadges(){
  const newBadges = [];
  const earned = new Set(userProgress.earnedBadges);
  
  BADGES.forEach(badge => {
    if(earned.has(badge.id)) return;
    let win = false;
    switch(badge.id){
      case 'first_term': win = studied.size >= 1; break;
      case 'ten_streak': win = _quizStreakCount >= 10; break;
      case 'streak_3': win = userProgress.streak >= 3; break;
      case 'streak_7': win = userProgress.streak >= 7; break;
      case 'streak_30': win = userProgress.streak >= 30; break;
      case 'quiz_50': win = (lifetimeStats.quizTotal||0) >= 50; break;
      case 'quiz_200': win = (lifetimeStats.quizTotal||0) >= 200; break;
      case 'accuracy_90': {
        const t = lifetimeStats.quizTotal||0;
        win = t >= 50 && (lifetimeStats.quizCorrect/t) >= 0.9;
        break;
      }
      case 'fav_10': win = favorites.size >= 10; break;
      case 'studied_100': win = studied.size >= 100; break;
      case 'studied_all': win = studied.size >= 465; break;
      case 'cell_master':
      case 'genetics_master': {
        if(!badge.topic) break;
        const topicTerms = GLOSSARY.filter(t => TERM_TOPIC_MAP[t.hebrew] === badge.topic);
        if(topicTerms.length === 0) break;
        win = topicTerms.every(t => studied.has(t.hebrew));
        break;
      }
    }
    if(win){
      newBadges.push(badge);
      userProgress.earnedBadges.push(badge.id);
    }
  });
  
  if(newBadges.length){
    saveProgress();
    newBadges.forEach(b => showBadgeToast(b));
  }
}

// ===== SPACED REPETITION (Feature #2) =====
// status: 'unsure'(repeat 1 day), 'known'(repeat 7 days), 'mastered'(repeat 30 days)
function markTermStatus(term, status){
  const today = new Date();
  const nextDate = new Date();
  const intervals = {unsure: 1, known: 7, mastered: 30};
  nextDate.setDate(today.getDate() + intervals[status]);
  
  if(!userProgress.termsMemory[term]){
    userProgress.termsMemory[term] = {reviewCount: 0};
  }
  userProgress.termsMemory[term].lastSeen = todayDateStr();
  userProgress.termsMemory[term].nextReview = nextDate.toISOString().slice(0,10);
  userProgress.termsMemory[term].status = status;
  userProgress.termsMemory[term].reviewCount = (userProgress.termsMemory[term].reviewCount||0) + 1;
  
  if(status === 'mastered' || status === 'known'){
    studied.add(term);
    saveStudied();
  } else {
    studied.delete(term);
    saveStudied();
  }
  saveProgress();
}

function getTermsForReview(){
  const today = todayDateStr();
  return Object.entries(userProgress.termsMemory)
    .filter(([term, data]) => data.nextReview <= today)
    .map(([term]) => term);
}

function speakText(text){
  if(!speechEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'he-IL';
  utter.rate = 0.9;
  utter.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const heVoice = voices.find(v => v.lang.startsWith('he'));
  if(heVoice) utter.voice = heVoice;
  currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}

async function loadUserData(uid){
  syncStatus = 'syncing'; render();
  try{
    const doc = await db.collection('users').doc(uid).get();
    if(doc.exists){
      const data = doc.data();
      // Cloud is source of truth on login
      favorites = new Set(data.favorites || []);
      studied = new Set(data.studied || []);
      if(data.stats) lifetimeStats = data.stats;
      localStorage.setItem('ml_favs', JSON.stringify([...favorites]));
      localStorage.setItem('ml_studied', JSON.stringify([...studied]));
      localStorage.setItem('ml_stats', JSON.stringify(lifetimeStats));
      syncStatus = 'synced';
      render();
      setTimeout(()=>{syncStatus='';render();},2000);
    } else {
      // First time user — push current local data to cloud
      await saveUserData(uid);
    }
  }catch(e){
    console.error('Load failed:', e);
    alert('שגיאה בטעינת הנתונים מהענן: ' + e.message);
    syncStatus = '';
    render();
  }
}

async function saveUserData(uid){
  if(!currentUser) return;
  syncStatus = 'syncing';
  updateSyncIndicator();
  try{
    await db.collection('users').doc(uid).set({
      displayName: currentUser.displayName,
      email: currentUser.email,
      photoURL: currentUser.photoURL,
      favorites: [...favorites],
      studied: [...studied],
      stats: lifetimeStats,
      lastSync: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    syncStatus = 'synced';
    updateSyncIndicator();
    setTimeout(()=>{ syncStatus=''; updateSyncIndicator(); }, 1500);
  }catch(e){
    console.error('Save failed:', e);
    syncStatus = 'error';
    updateSyncIndicator();
    alert('שגיאה בסנכרון: ' + e.message);
  }
}

    arr = arr.filter(t => t.letter === activeLetter);

  if(searchQ.trim()){

    arr = arr.filter(t=>t.hebrew.toLowerCase().includes(q)||t.english.toLowerCase().includes(q)||t.definition.toLowerCase().includes(q));
  }
  return arr;
}

function buildQuizQuestion(term, pool){
  // Two question types only
  const type = Math.random() < 0.5 ? 'def_to_term' : 'term_to_def';
  
  // Build distractor pool from SAME sub-topic for challenging, related distractors
  const topic = term._topic;
  const sameTopicTerms = (QUIZ_DISTRACTOR_POOLS[topic] || [])
    .filter(name => name !== term.hebrew);
  
  // Map names to GLOSSARY entries
  const termMap = {};
  GLOSSARY.forEach(t => termMap[t.hebrew] = t);
  let distractors = sameTopicTerms
    .map(name => termMap[name])
    .filter(t => t); // only existing entries
  
  // Shuffle and pick 3
  distractors = distractors.sort(() => Math.random() - .5).slice(0, 3);
  
  // Safety fallback: if somehow fewer than 3 from topic, fill with closely-named glossary terms
  if(distractors.length < 3){
    const filler = GLOSSARY
      .filter(t => t.hebrew !== term.hebrew && !distractors.some(d => d.hebrew === t.hebrew))
      .sort(() => Math.random() - .5)
      .slice(0, 3 - distractors.length);
    distractors = [...distractors, ...filler];
  }
  
  let promptLabel, prompt, options;
  if(type === 'def_to_term'){
    promptLabel = '<svg viewBox="0 0 100 100" width="18" height="18" style="vertical-align:middle;margin-left:4px"><circle cx="50" cy="50" r="42" fill="none" stroke="#C44747" stroke-width="3"/><circle cx="50" cy="50" r="28" fill="none" stroke="#C44747" stroke-width="2.5"/><circle cx="50" cy="50" r="14" fill="#F47A6E" stroke="#C44747" stroke-width="2.5"/></svg> מהו המושג המתאים להגדרה?';
    prompt = term.definition;
    options = [term, ...distractors].sort(() => Math.random() - .5)
      .map(t => ({text: t.hebrew, isCorrect: t.hebrew === term.hebrew}));
  } else {
    promptLabel = '<svg viewBox="0 0 100 100" width="18" height="18" style="vertical-align:middle;margin-left:4px"><path d="M 14 18 L 50 14 L 86 18 L 86 84 L 50 80 L 14 84 Z" fill="#F9D85C" stroke="#1B6FA8" stroke-width="3"/><line x1="50" y1="14" x2="50" y2="80" stroke="#1B6FA8" stroke-width="3"/></svg> מהי ההגדרה הנכונה למושג:';
    prompt = term.hebrew;
    options = [term, ...distractors].sort(() => Math.random() - .5)
      .map(t => ({text: t.definition, isCorrect: t.hebrew === term.hebrew}));
  }
  return {promptLabel, prompt, options, term};
}

function continueLearn(termName){
  // Find the term and jump to flash mode at that index
  const idx = GLOSSARY.findIndex(t => t.hebrew === termName);
  if(idx >= 0){
    cardIdx = idx;
    isFlipped = false;
    studyView = 'card';
    setMode('study');
  } else {
    setMode('study');
  }
}

function startReview(){
  // Filter to only terms due for review
  const reviewTerms = getTermsForReview();
  if(reviewTerms.length === 0){
    setMode('study');
    return;
  }
  // Temporary: just go to flash mode
  setMode('flash');
}

function buildTermList(filtered){
  return `<div class="term-list">
    ${filtered.map(t => {
      const isFav = favorites.has(t.hebrew);
      const isStudied = studied.has(t.hebrew);
      const safe = t.hebrew.replace(/'/g, "\\'");
      const cleanDef = t.definition.replace(/'/g, "\\'").replace(/"/g, '');
      return `
        <div class="term-row ${isStudied?'is-studied':''}">
          <div class="term-letter-box">${t.letter}</div>
          <div class="term-content">
            <div class="term-line-1">
              <div class="term-titles">
                <div class="term-heb">${highlightText(t.hebrew, searchQ)}</div>
                <div class="term-eng">${highlightText(t.english, searchQ)}</div>
              </div>
              <div class="term-row-acts">
                <button class="term-act-btn" onclick="speakText('${safe} ' + '${cleanDef}')">${icon('volume', 13)}</button>
                <button class="term-act-btn ${isFav?'is-fav':''}" onclick="toggleFav('${safe}')">${isFav ? icon('heart', 13) : icon('heartOutline', 13)}</button>
                <button class="term-act-btn ${isStudied?'is-studied':''}" onclick="toggleStudiedDirect('${safe}')">${isStudied ? icon('check', 13) : icon('plus', 13)}</button>
              </div>
            </div>
            <div class="term-defin">${highlightText(t.definition, searchQ)}</div>
          </div>
        </div>
      `;
    }).join('')}
  </div>`;
}

function buildFlashView(filtered){
  const t = filtered[Math.min(cardIdx, filtered.length - 1)];
  if(!t) return '';
  const isFav = favorites.has(t.hebrew);
  const safe = t.hebrew.replace(/'/g, "\\'");
  const cleanDef = t.definition.replace(/'/g, "\\'").replace(/"/g, '');
  const progress = Math.round(((cardIdx + 1) / filtered.length) * 100);
  
  return `<div class="flash-screen">
    <div class="flash-progress">
      <div class="flash-counter"><strong>${cardIdx + 1}</strong> / ${filtered.length}</div>
      <div class="flash-prog-bar"><div class="flash-prog-fill" style="width:${progress}%"></div></div>
      <div class="flash-counter">${progress}%</div>
    </div>
    
    <div class="flash-stage" id="flashStage">
      <div class="flash-card ${isFlipped?'flipped':''}" id="flashCardEl" onclick="flipFlashCard()">
        <div class="flash-face front">
          <div class="flash-corner right"><div class="flash-letter-badge">${t.letter}</div></div>
          <div class="flash-corner left">
            <button class="flash-action-btn ${isFav?'fav-on':''}" onclick="event.stopPropagation();toggleFav('${safe}')">
              ${isFav ? icon('heart', 16) : icon('heartOutline', 16)}
            </button>
          </div>
          <div class="flash-tag">מושג</div>
          <div class="flash-main">${t.hebrew}</div>
          <div class="flash-sub">${t.english}</div>
          <div class="flash-flip-hint">לחץ לגלות הגדרה</div>
        </div>
        <div class="flash-face back">
          <div class="flash-corner right"><div class="flash-letter-badge">${t.letter}</div></div>
          <div class="flash-corner left">
            <button class="flash-action-btn" onclick="event.stopPropagation();speakText('${safe} ' + '${cleanDef}')">
              ${icon('volume', 16)}
            </button>
          </div>
          <div class="flash-tag">${t.hebrew}</div>
          <div class="flash-def-text">${t.definition}</div>
        </div>
      </div>
    </div>
    
    <div class="flash-rate-row">
      <button class="rate-btn r-no" onclick="markTermStatusAndNext('${safe}','unsure')">
        <span class="rate-emoji">😕</span>
        <span class="rate-label">לא בטוח</span>
      </button>
      <button class="rate-btn r-maybe" onclick="markTermStatusAndNext('${safe}','known')">
        <span class="rate-emoji">🤔</span>
        <span class="rate-label">בערך</span>
      </button>
      <button class="rate-btn r-yes" onclick="markTermStatusAndNext('${safe}','mastered')">
        <span class="rate-emoji">😎</span>
        <span class="rate-label">יודע</span>
      </button>
    </div>
    
    <div class="flash-nav-row">
      <button class="flash-nav-btn" ${cardIdx===0?'disabled':''} onclick="nav(-1)">
        ${icon('arrowRight', 14)} <span>הקודם</span>
      </button>
      <button class="flash-nav-btn" ${cardIdx>=filtered.length-1?'disabled':''} onclick="nav(1)">
        <span>הבא</span> ${icon('arrowLeft', 14)}
      </button>
    </div>
  </div>`;
}

function flipFlashCard(){
  isFlipped = !isFlipped;
  const el = document.getElementById('flashCardEl');
  if(el){
    if(isFlipped) el.classList.add('flipped');
    else el.classList.remove('flipped');
  }
}
